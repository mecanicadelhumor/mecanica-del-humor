<!--
  C55.1 · muestrario de animación a medida, escrito por la dirección (Opus 5.5) el 30/09/2026.
  Mismo guion y misma voz (caché) que el MDS-027 publicado el 29/09. NO se sube a YouTube (C54).

  Contrato, el mismo que escena.html: pintar(t) deja el lienzo EXACTAMENTE como
  tiene que estar en el segundo t de la narración (t = 0 es el principio de la voz,
  sin el colchón de montaje.py). Nada de Math.random(), nada de la hora del
  sistema, nada de animaciones CSS: todo sale de t (regla 11.5). Sin red (11.6).
  Los instantes de cada palabra salen de fondo_visual.mapa_de_tiempo() sobre la
  voz real de cada escena (el mismo estimador que usa C50 para sus cortes).
-->

// ---------------------------------------------------------------- utilidades
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const tramo = (t, a, b) => cl((t - a) / (b - a));
const sal = x => 1 - Math.pow(1 - x, 3);                 // easeOutCubic
const suave = x => x * x * (3 - 2 * x);
const rebote = x => { x = cl(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const mezcla = (a, b, p) => a + (b - a) * p;
const INI = ESC.map(e => e[0]);
const TOTAL = ESC[5][0] + ESC[5][1];
// instante (s, línea de tiempo del vídeo) de la palabra que empieza por `pal` en la escena n (1..6)
function W(n, pal, vez = 1) {
  const norm = s => s.normalize("NFD").replace(/[^\p{L}\p{N}]/gu, "").toLowerCase();
  let k = 0;
  for (const [t, w] of ESC[n - 1][2]) if (norm(w) === norm(pal) && ++k === vez) return t;
  throw new Error(`palabra «${pal}» no está en la escena ${n}`);
}
const LARGOS = new Map();
function dibuja(el, p) {                                  // trazo que se dibuja solo
  if (typeof el === "string") el = $(el);
  let L = LARGOS.get(el);
  if (L === undefined) { L = el.getTotalLength ? el.getTotalLength() : 1000; LARGOS.set(el, L); el.style.strokeDasharray = L + " " + L; }

}
const op = (el, v) => ((typeof el === "string" ? $(el) : el).style.opacity = cl(v));
const tf = (el, s) => ((typeof el === "string" ? $(el) : el).setAttribute("transform", s));
function escribe(el, texto, p) { (typeof el === "string" ? $(el) : el).textContent = texto.slice(0, Math.round(texto.length * cl(p))); }

// Una línea de texto grande que entra palabra a palabra con la voz.
// partes: [[texto, instante, esAmbar], ...]
function prepara_banda(id, partes) {
  const b = $(id); b.innerHTML = "";
  partes.forEach(([txt, , am]) => {
    const s = document.createElement("span");
    s.className = "p" + (am ? " am" : ""); s.textContent = txt; b.appendChild(s);
  });
  b._partes = partes;
}
function banda(id, t, fuera_a) {
  const b = $(id);
  const partes = b._partes;
  const entra = partes[0][1] - 0.1;
  let o = tramo(t, entra, entra + 0.15);
  let dy = 0;
  if (fuera_a !== undefined) { const f = tramo(t, fuera_a, fuera_a + 0.28); o *= 1 - f; dy = -60 * sal(f); }
  b.style.opacity = o; b.style.transform = `translateY(${dy}px)`;
  [...b.children].forEach((s, i) => {
    const p = sal(tramo(t, partes[i][1] - 0.08, partes[i][1] + 0.22));
    s.style.opacity = 0.0 + p;
    s.style.transform = `translateY(${(1 - p) * 38}px) scale(${partes[i][2] ? mezcla(1.25, 1, rebote(tramo(t, partes[i][1] - 0.02, partes[i][1] + 0.4))) : 1})`;
  });
}
// visibilidad de una escena con barrido entre medias
function visible(g, t, a, b) {
  const o = tramo(t, a - 0.05, a + 0.2) * (1 - tramo(t, b - 0.12, b + 0.08));
  op(g, o);
}

// ---------------------------------------------------------------- cargar
function cargar() {
  // la palabra INTEGRAL, letra a letra
  const g = $("palabra");
  const letras = "INTEGRAL".split("");
  const anchos = letras.map(() => 0);

  let x = 0;

  x = 540 - tot / 2;

  // las cinco figuras de la mesa
  const figs = $("figs"), jas = $("jas");
  [200, 370, 540, 710, 880].forEach((cx, k) => {
    const f = document.createElementNS("http://www.w3.org/2000/svg", "g");

      `<path d="M${cx - 82} 1000 C${cx - 82} 900 ${cx + 82} 900 ${cx + 82} 1000" fill="#0B1220" stroke="${k === 2 ? "#F2F4F8" : "#8A97AE"}" stroke-width="6"/>` +
      (k === 2 ? `<path d="M${cx - 18} 850 H${cx + 18}" stroke="#F2F4F8" stroke-width="6" stroke-linecap="round"/>`

    f.id = "fig" + k; figs.appendChild(f);
    if (k !== 2) for (let j = 0; j < 2; j++) {
      const tx = document.createElementNS("http://www.w3.org/2000/svg", "text");
      tx.textContent = "ja"; tx.setAttribute("x", cx + (j ? 34 : -70)); tx.setAttribute("y", 760 - j * 40);
      tx.id = `ja${k}${j}`; jas.appendChild(tx);

      re.setAttribute("x", x); re.setAttribute("y", 470 + r * 88); re.setAttribute("width", wd); re.setAttribute("height", 44);
      re.setAttribute("rx", 12); re.setAttribute("fill", "#8A97AE"); re.id = `bq${r}_${c}`; re._n = n++; re._cx = x + wd / 2; re._cy = 470 + r * 88 + 22;
      bl.appendChild(re); x += wd + 26;

    const a = k * Math.PI / 4, l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("x1", Math.cos(a) * 40); l.setAttribute("y1", Math.sin(a) * 40);

  }
  // las líneas de texto grandes, con la palabra en ámbar donde la marca el guion
  prepara_banda("b1", [["—¿El ", W(1, "si")], ["pan ", W(1, "pan")], ["es ", W(1, "es")], ["integral", W(1, "integral"), true], ["?", W(1, "integral")]]);
  prepara_banda("b2", [["—No, ", W(2, "no")], ["está ", W(2, "esta")], ["cortado", W(2, "cortado"), true], [".", W(2, "cortado")]]);
  prepara_banda("b3", [["Y lo ", W(3, "pregunta")], ["pregunta ", W(3, "pregunta")], ["en serio", W(3, "en", 2), true]]);
  prepara_banda("b6", [["Busca ", W(6, "busca")], ["la ", W(6, "la")], ["palabra ", W(6, "palabra")], ["con ", W(6, "con")], ["dos ", W(6, "dos")], ["significados", W(6, "significados"), true]]);

// ---------------------------------------------------------------- pintar
function pintar(t) {
  const [i1, i2, i3, i4, i5, i6] = INI;
  // fondo vivo: la retícula deriva despacio
  tf("fondo-reti", `translate(${-(t * 7) % 60} ${-(t * 11) % 60})`);
  $("prog").style.width = (cl(t / TOTAL) * 1080) + "px";
  // barrido de cambio de plano (entre la 2 y la 3, la 3 y la 4, la 4 y la 5, la 5 y la 6)
  let bar = 0, bx = 0;
  for (const c of [i3, i4, i5, i6]) { const p = tramo(t, c - 0.18, c + 0.22); if (p > 0 && p < 1) { bar = 1; bx = mezcla(-10, 1090, suave(p)); } }
  op("barrido", bar * 0.9); $("barrido").setAttribute("x", bx);

    const acerca = suave(tramo(t, i2 + 0.05, W(2, "cortado") - 0.1));
    s = mezcla(mezcla(1.14, 1, sal(tramo(t, 0, 1.8))) + 0.025 * tramo(t, 0, i2), 1.32, acerca); fx = mezcla(540, 760, acerca); fy = mezcla(900, 880, acerca);
  } else {

  pinta_cafe(t); pinta_mesa(t); pinta_dos(t); pinta_salto(t); pinta_cierre(t);
  pinta_textos(t); pinta_engranaje(t); pinta_firma(t);
}

function pinta_cafe(t) {
  const [i1, i2, i3] = INI;
  op("cafe", 1 - tramo(t, i3 - 0.12, i3 + 0.1));
  if (t > i3 + 0.2) return;
  escribe("plano1", "FIG. 1 · UNA CAFETERÍA", tramo(t, W(1, "cafeteria") - 0.1, W(1, "cafeteria") + 0.5));
  op("plano1", 1 - tramo(t, i2 + 0.1, i2 + 0.4));

  tf("gente", `translate(0 ${(1 - sal(tramo(t, W(1, "gente") - 0.1, W(1, "gente") + 0.4))) * 30})`);

  document.querySelectorAll("#barra-g .tr").forEach((e, k) => dibuja(e, 1));
  document.querySelectorAll("#maquina .tr").forEach((e, k) => dibuja(e, 1));
  const pv = tramo(t, 0.6, 1.2);
  op("vapor", 0.8 * pv);

  const tc = W(1, "camarero");

  op("pajarita", tramo(t, tc + 0.25, tc + 0.45));
  // el camarero inclina la cabeza al contestar
  const inc = sal(tramo(t, i2 + 0.2, i2 + 0.6)) * (1 - sal(tramo(t, W(2, "cortado") + 0.2, W(2, "cortado") + 0.6)));
  tf("cab-cam", `rotate(${-9 * inc} 520 690)`);
  // etiquetas de plano técnico
  const et = (id, lid, t0) => { op(id, tramo(t, t0, t0 + 0.25) * (1 - tramo(t, i2 + 0.2, i2 + 0.5))); dibuja(lid, tramo(t, t0 - 0.1, t0 + 0.2)); op(lid, 1 - tramo(t, i2 + 0.2, i2 + 0.5)); };
  et("t-barra", "l-barra", tb + 0.1); et("t-cam", "l-cam", tc + 0.1); et("t-pan", "l-pan", W(1, "pan") + 0.1);
  // el pan entra con un bote

  const pp = rebote(tramo(t, tp - 0.12, tp + 0.4));
  tf("pan", `translate(760 900) scale(${cl(pp, 0, 2)}) translate(-760 -900)`);
  op("pan", tramo(t, tp - 0.12, tp));
  // el cuchillo baja justo en «cortado» y la hogaza se abre en rodajas
  const tcor = W(2, "cortado");
  const pk = tramo(t, tcor - 0.55, tcor - 0.25), baja = suave(tramo(t, tcor - 0.12, tcor + 0.22)), sube = tramo(t, tcor + 0.35, tcor + 0.7);
  op("cuchillo", pk * (1 - sube));

  const abre = rebote(tramo(t, tcor + 0.12, tcor + 0.6));
  for (let k = 0; k < 5; k++) tf("r" + k, `translate(${(k - 2) * 40 * abre} ${-Math.abs(k - 2) * 4 * abre}) rotate(${(k - 2) * 4 * abre} ${672 + 58 * k} 900)`);
}

function pinta_mesa(t) {
  const [, , i3, i4] = INI;
  visible("mesa", t, i3, i4);
  if (t < i3 - 0.3 || t > i4 + 0.3) return;
  escribe("plano3", "FIG. 2 · LA MESA", tramo(t, i3 + 0.1, i3 + 0.6));
  const tm = W(3, "mesa");
  dibuja("mesa-tablero", sal(tramo(t, tm - 0.2, tm + 0.35))); dibuja("mesa-patas", sal(tramo(t, tm + 0.05, tm + 0.45)));
  const risa0 = W(3, "hay");
  for (let k = 0; k < 5; k++) {
    const f = $("fig" + k), a = tramo(t, tm + 0.05 + k * 0.07, tm + 0.35 + k * 0.07);
    let dy = (1 - rebote(a)) * 60;
    if (k !== 2) dy -= Math.abs(Math.sin((t - risa0) * 8.5 + k * 1.3)) * 16 * tramo(t, risa0, risa0 + 0.3);
    op(f, a); tf(f, `translate(0 ${dy})`);

    }

  op("bocadillo", tramo(t, tq - 0.1, tq + 0.1));
  dibuja(document.querySelector("#bocadillo .tr"), sal(tramo(t, tq - 0.1, tq + 0.45)));
  const tqu = W(3, "que");
  const pq = rebote(tramo(t, tqu - 0.05, tqu + 0.35));
  op("interroga", tramo(t, tqu - 0.05, tqu + 0.05));
  const tco = W(3, "cortado");
  const mueve = sal(tramo(t, tco - 0.1, tco + 0.3));

function pinta_dos(t) {

  });
  // «dos cosas»: la palabra se separa y aparece la bifurcación
  const td = W(4, "dos");
  const parte = sal(tramo(t, td - 0.1, td + 0.35));
  $("palabra").setAttribute("transform", `translate(540 520) scale(${1 + 0.06 * Math.sin(parte * Math.PI)}) translate(-540 -520)`);
  op("v4-trav", 0.5 * tramo(t, td, td + 0.4));
  ["v4-rail-i", "v4-rail-i2"].forEach(id => dibuja(id, sal(tramo(t, td - 0.05, td + 0.55))));
  ["v4-rail-d", "v4-rail-d2"].forEach(id => dibuja(id, sal(tramo(t, td + 0.1, td + 0.7))));
  const th = W(4, "harina"), te = W(4, "entero");
  const ph = rebote(tramo(t, th - 0.1, th + 0.35)), pe = rebote(tramo(t, te - 0.1, te + 0.35));
  op("harina", tramo(t, th - 0.1, th)); tf("harina", `translate(300 960) scale(${ph}) translate(-300 -960)`);
  op("entera", tramo(t, te - 0.1, te)); tf("entera", `translate(780 960) scale(${pe}) translate(-780 -960)`);
  // «se quedó en la primera»: el que escucha baja por la vía y se queda en la 1
  const tq = W(4, "quedo"), tp = W(4, "primera");
  const camino = $("v4-rail-i"), L = camino.getTotalLength();
  const pr = suave(tramo(t, tq - 0.1, tp + 0.15));
  const pt = camino.getPointAtLength(L * pr * 0.93);
  op("oyente4", tramo(t, tq - 0.2, tq)); $("oyente4").setAttribute("cx", pt.x); $("oyente4").setAttribute("cy", pt.y);
  const llega = tramo(t, tp + 0.15, tp + 0.9);
  op("onda4", (1 - llega) * (llega > 0 ? 1 : 0)); $("onda4").setAttribute("cx", pt.x); $("onda4").setAttribute("cy", pt.y); $("onda4").setAttribute("r", 22 + 60 * llega);
  const apaga = tramo(t, tp, tp + 0.4);
  ["v4-rail-d", "v4-rail-d2", "entera"].forEach(id => $(id).style.opacity = mezcla(id === "entera" ? cl(tramo(t, te - 0.1, te)) : 1, 0.28, apaga));
  $("v4-rail-i").style.stroke = apaga > 0.5 ? "#4CC9F0" : "#F2F4F8";

function pinta_salto(t) {
  const [, , , , i5, i6] = INI;
  visible("salto", t, i5, i6);
  if (t < i5 - 0.3 || t > i6 + 0.3) return;
  escribe("plano5", "FIG. 4 · EL SALTO", tramo(t, i5 + 0.1, i5 + 0.6));
  op("v5-trav", 0.5 * tramo(t, i5 + 0.1, i5 + 0.6));
  ["v5-1", "v5-1b"].forEach(id => dibuja(id, sal(tramo(t, i5 + 0.05, i5 + 0.7))));
  ["v5-2", "v5-2b"].forEach(id => dibuja(id, sal(tramo(t, i5 + 0.2, i5 + 0.85))));
  op("n1", tramo(t, i5 + 0.3, i5 + 0.6)); op("n2", tramo(t, i5 + 0.45, i5 + 0.75));
  const ts = W(5, "saltar"), tg = W(5, "golpe"), te = W(5, "el"), tn = W(5, "salto");
  dibuja("v5-x", sal(tramo(t, ts - 0.1, ts + 0.4)));
  op("palanca", tramo(t, ts - 0.1, ts + 0.2));
  tf("brazo", `rotate(${mezcla(-32, 32, suave(tramo(t, tg - 0.45, tg - 0.2)))})`);
  // A: va por la 1, salta en «de golpe» a la 2 y sigue
  const ta0 = W(5, "obliga") - 0.1, tsw = tg - 0.08;
  let ax, ay;
  if (t < tsw) { ax = mezcla(90, 470, sal(tramo(t, ta0, tsw)) * 0.2 + tramo(t, ta0, tsw) * 0.8); ay = 560; }
  else if (t < tsw + 0.26) { const p = suave(tramo(t, tsw, tsw + 0.26)); ax = mezcla(470, 610, p); ay = mezcla(560, 820, p) - Math.sin(p * Math.PI) * 90; }
  else { ax = mezcla(610, 1010, sal(tramo(t, tsw + 0.26, tsw + 1.1))); ay = 820; }
  $("puntoA").setAttribute("cx", ax); $("puntoA").setAttribute("cy", ay);
  op("puntoA", tramo(t, ta0 - 0.15, ta0) * (1 - tramo(t, tsw + 0.9, tsw + 1.1)));
  const pc = tramo(t, tsw + 0.08, tsw + 0.5);
  op("chispa", (pc > 0 && pc < 1) ? 1 - pc : 0);
  tf("chispa", `translate(540 690) scale(${0.6 + pc * 1.2})`);
  // B: «y él no saltó» — pasa por el cambio de vía sin cambiar, y se para en la 1
  const tb0 = te - 0.1;
  const bxp = sal(tramo(t, tb0, tn + 0.55));
  const bx = mezcla(90, 880, bxp);
  $("puntoB").setAttribute("cx", bx); $("puntoB").setAttribute("cy", 560);
  op("puntoB", tramo(t, tb0 - 0.15, tb0));
  const pq = rebote(tramo(t, tn + 0.45, tn + 0.85));
  op("interroga5", tramo(t, tn + 0.45, tn + 0.55));
  tf("interroga5", `translate(880 490) scale(${pq})`);
}

function pinta_cierre(t) {
  const [, , , , , i6] = INI;
  const tf6 = TOTAL - 0.9;
  op("cierre", tramo(t, i6 - 0.05, i6 + 0.2));
  if (t < i6 - 0.3) return;
  escribe("plano6", "FIG. 5 · CUALQUIER CHISTE", tramo(t, i6 + 0.1, i6 + 0.7));
  const t0 = W(6, "esto");
  const bq = [...$("bloques").children];
  const tb = W(6, "busca"), tpal = W(6, "palabra"), tdos = W(6, "dos"), tsig = W(6, "significados");
  const elegido = $("bq3_1");
  bq.forEach(re => {
    const a = tramo(t, t0 + re._n * 0.05, t0 + 0.25 + re._n * 0.05);
    re.setAttribute("opacity", 0.38 * a * (re === elegido ? 1 : 1 - 0.45 * tramo(t, tpal, tpal + 0.3)));
    re.setAttribute("transform", `translate(0 ${(1 - sal(a)) * 24})`);
  });
  const luz = tramo(t, tpal - 0.05, tpal + 0.25);
  elegido.setAttribute("fill", luz > 0.5 ? "#4CC9F0" : "#8A97AE");
  elegido.setAttribute("opacity", mezcla(0.38, 1, luz) * tramo(t, t0 + elegido._n * 0.05, t0 + 0.25 + elegido._n * 0.05));
  // la lupa recorre las filas y se para en la palabra
  const ruta = [[180, 492], [760, 492], [180, 668], [elegido._cx, elegido._cy]];
  const pl = tramo(t, tb - 0.3, tpal);
  const seg = Math.min(2, Math.floor(pl * 3)), ps = suave(pl * 3 - seg);
  const lx = mezcla(ruta[seg][0], ruta[seg + 1][0], pl >= 1 ? 1 : ps), ly = mezcla(ruta[seg][1], ruta[seg + 1][1], pl >= 1 ? 1 : ps);
  op("lupa", tramo(t, tb - 0.4, tb - 0.2) * (1 - tramo(t, tdos, tdos + 0.3)));
  tf("lupa", `translate(${lx} ${ly})`);
  // la palabra se bifurca: dos significados
  tf("fork6", `translate(${elegido._cx} ${elegido._cy + 30})`);
  dibuja("f6-i", sal(tramo(t, tdos - 0.1, tsig + 0.3))); dibuja("f6-d", sal(tramo(t, tdos, tsig + 0.4)));
  op("f6-n1", tramo(t, tsig + 0.2, tsig + 0.4)); op("f6-n2", tramo(t, tsig + 0.3, tsig + 0.5));
  // «por qué a unos les cuesta saltar»: alguien duda en la bifurcación
  const tpq = W(6, "por"), tns = W(6, "no");
  const bam = Math.sin((t - tpq) * 6) * 55 * tramo(t, tpq + 0.2, tpq + 0.6);
  op("duda6", tramo(t, tpq - 0.1, tpq + 0.1)); $("duda6").setAttribute("cx", bam); $("duda6").setAttribute("cy", 70);
  const pco = rebote(tramo(t, tns - 0.05, tns + 0.35));
  op("coral6", tramo(t, tns - 0.05, tns + 0.05)); $("coral6").setAttribute("transform", `translate(0 290) scale(${pco}) translate(0 -290)`);
}

function pinta_textos(t) {
  const [i1, i2, i3, i4, i5, i6] = INI;
  banda("b1", t, i2 + 0.05);
  banda("b2", t, i3 - 0.15);
  banda("b3", t, i4 - 0.15);
  banda("b6", t);
  // la comparación
  const th = W(4, "harina"), te = W(4, "entero"), fin4 = i5 - 0.15;
  [["ca", th], ["cb", te]].forEach(([id, t0]) => {
    const p = sal(tramo(t, t0 - 0.1, t0 + 0.25)), f = tramo(t, fin4, fin4 + 0.25);
    const e = $(id); e.style.opacity = p * (1 - f); e.style.transform = `translateY(${(1 - p) * 30}px)`;
  });
  const apaga = tramo(t, W(4, "primera"), W(4, "primera") + 0.4);
  $("cb").style.opacity = parseFloat($("cb").style.opacity) * mezcla(1, 0.35, apaga);
  // la lista
  [["i1", W(5, "un")], ["i2", W(5, "el")]].forEach(([id, t0]) => {
    const p = sal(tramo(t, t0 - 0.1, t0 + 0.25)), f = tramo(t, i6 - 0.15, i6 + 0.1);
    const e = $(id); e.style.opacity = p * (1 - f); e.style.transform = `translateX(${(1 - p) * -40}px)`;
  });
  const ts = W(6, "significados");
  const ps = sal(tramo(t, ts + 0.3, ts + 0.7));
  $("sub6").style.opacity = ps * (1 - tramo(t, TOTAL - 0.62, TOTAL - 0.47));
  $("b6").style.opacity = parseFloat($("b6").style.opacity || 0) * (1 - tramo(t, TOTAL - 0.62, TOTAL - 0.47));
}

const EXPR = [null, null, "duda", "rie", "piensa", "duda"];   // las del guion, escena a escena
function pinta_engranaje(t) {
  const [, , i3] = INI;
  const n = INI.filter(x => x <= t).length;             // escena actual (1..6)
  const e = $("eng"), s = e.querySelector("svg");
  const p = rebote(tramo(t, i3 + 0.2, i3 + 0.6));
  const fuera = tramo(t, TOTAL - 0.55, TOTAL - 0.35);
  e.style.opacity = tramo(t, i3 + 0.2, i3 + 0.3) * (1 - fuera);
  e.style.transform = `scale(${p})`;
  const ex = EXPR[n - 1] || "neutra";
  s.setAttribute("class", "mdh-cara ex-" + ex);
  const eje = s.querySelector(".eje"); if (eje) eje.style.transform = `rotate(${t * 60}deg)`;
}

function pinta_firma(t) {
  const t0 = TOTAL - 0.55;
  const p = sal(tramo(t, t0, t0 + 0.45));
  op("velo", 0.94 * p);
  const f = $("firma"); f.style.opacity = p; f.style.transform = `translateY(${(1 - p) * 30}px)`;
  // el Engranaje de la firma: grande y en el centro
  const fg = $("eng-firma");
  const q = rebote(tramo(t, t0 + 0.05, t0 + 0.5));
  fg.style.cssText = `position:absolute;width:340px;height:340px;left:370px;top:760px;opacity:${tramo(t, t0 + 0.05, t0 + 0.15)};transform:scale(${q})`;
  fg.querySelector("svg").setAttribute("class", "mdh-cara ex-media");
  const eje = fg.querySelector(".eje"); if (eje) eje.style.transform = `rotate(${t * 60}deg)`;
}

// Comprobación de la barrera C21 aplicada a este lienzo: ningún texto se sale de su caja ni del lienzo.
function comprobar(t) {
  pintar(t);
  const malos = [];
  document.querySelectorAll(".banda,.caja,.item,.sub,#firma").forEach(e => {
    if (parseFloat(getComputedStyle(e).opacity) < 0.05) return;
    if (e.scrollWidth > e.clientWidth + 1) malos.push(`${e.id || e.className}: ${e.scrollWidth}>${e.clientWidth}`);
    const r = e.getBoundingClientRect();
    if (r.right > 1080 || r.left < 0 || r.bottom > 1650) malos.push(`${e.id || e.className}: fuera de la zona segura (${Math.round(r.left)},${Math.round(r.bottom)})`);
  });
  return malos;
}
window.cargar = cargar; window.pintar = pintar; window.comprobar = comprobar; window.TOTAL = TOTAL;
cargar(); pintar(0);
</script>
