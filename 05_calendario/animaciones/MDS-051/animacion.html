<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>MDS-051 · animación a medida (C55.2)</title>
<!--
  MDS-051 · escenas [4, 5] · brazo A del ciclo B1 (C55.2) · fondo azul noche #16213A.
  Página autónoma: sin red, sin Math.random ni Date. Todo sale de (n, t); los movimientos se anclan
  a las palabras de la voz con W(), nunca a segundos escritos a mano. Sin caras: formas, objetos, esquemas.
-->
<style>
html,body{margin:0;padding:0;background:#05080f}
body{margin:0}
#lienzo{position:relative;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#16213A;
  font-family:system-ui,"DejaVu Sans",Arial,sans-serif;color:#16213A}
#dib{position:absolute;left:0;top:0;width:1080px;height:1920px}
.bq{position:absolute;font-weight:900;line-height:1.12;letter-spacing:-.01em}
.bq .p{display:inline-block;opacity:0;transform-origin:50% 80%}
</style></head>
<body><div id="lienzo"></div>
<script>
const ESCENAS_LISTA = [4, 5];
const BG = "#16213A", PUNTO = "#1F2D4D", TX = "#F2F4F8", HL = "#FFB020", SUB = "#A9B4CC", GR = "#6C7A99", PANEL = "#22305A";
const PAL = ["#EF476F","#4CC9F0","#06D6A0","#9B5DE5","#FFB020"];
// ---------------------------------------------------------------- núcleo común
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const tramo = (t, a, b) => cl((t - a) / (b - a));
const suave = x => x * x * (3 - 2 * x);
const sal = x => 1 - Math.pow(1 - x, 3);
const rebote = x => { x = cl(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const AM = "#FFB020", CI = "#4CC9F0", CO = "#EF476F", ME = "#06D6A0", VI = "#9B5DE5";
function E(tag, at, par) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (par) par.appendChild(e); return e; }
function hex(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }
function mezcla(a, b, p) { const A = hex(a), B = hex(b); return "#" + A.map((v, i) => Math.round(lerp(v, B[i], cl(p))).toString(16).padStart(2, "0")).join(""); }
const op = (el, v) => { el.style.opacity = cl(v); };
const tf = (el, s) => el.setAttribute("transform", s);

// tiempos de la voz (los pone el render antes de pintar)
let T = {};
window.cargarTiempos = d => { T = d || {}; };
const norm = s => s.normalize("NFD").replace(/[^\p{L}\p{N}]/gu, "").toLowerCase();
function W(n, pal, vez = 1) {           // instante en que la voz dice `pal` en la escena n
  let k = 0;
  for (const [t, w] of (T[n] || {}).palabras || []) if (norm(w) === norm(pal) && ++k === vez) return t;
  return 0.6;
}
const DUR = n => ((T[n] || {}).dur) || 8;
const S = {};

// ---------------------------------------------------------------- construcción
let FONDO, PART = [], BLQ = {};
function construir() {
  const lienzo = $("lienzo");
  const svg = E("svg", { id: "dib", viewBox: "0 0 1080 1920", width: 1080, height: 1920 }, lienzo);
  const defs = E("defs", {}, svg);
  const pat = E("pattern", { id: "reti", width: 72, height: 72, patternUnits: "userSpaceOnUse" }, defs);
  E("circle", { cx: 18, cy: 18, r: 5, fill: PUNTO }, pat);
  E("circle", { cx: 54, cy: 54, r: 5, fill: PUNTO }, pat);
  FONDO = pat;
  E("rect", { x: 0, y: 0, width: 1080, height: 1920, fill: "url(#reti)" }, svg);
  for (let i = 0; i < 22; i++) {
    const col = PAL[i % PAL.length];
    const c = i % 2 ? E("circle", { r: 7 + (i % 4) * 3, fill: col, opacity: 0.55 }, svg)
                    : E("rect", { x: -9, y: -9, width: 18 + (i % 3) * 4, height: 18 + (i % 3) * 4, rx: 5, fill: col, opacity: 0.55 }, svg);
    c._x = (i * 197) % 1080; c._y = (i * 331) % 1920; c._v = 16 + (i * 7) % 26; c._f = i * 1.3; c._r = i % 2;
    PART.push(c);
  }
  const cam = E("g", { id: "cam" }, svg);
  E("rect", { id: "prog", x: 0, y: 0, width: 0, height: 12, fill: HL }, svg);
  for (const n of ESCENAS_LISTA) {
    const g = E("g", { id: "s" + n }, cam);
    S[n].build(g, defs);
    const cont = document.createElement("div"); cont.id = "tx" + n; lienzo.appendChild(cont);
    BLQ[n] = (S[n].bloques || []).map(b => {
      const d = document.createElement("div"); d.className = "bq";
      d.style.cssText = `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;font-size:${b.size}px;color:${b.col || TX};text-align:${b.al || "left"}`;
      let am = false; const sp = [];
      b.txt.split(" ").forEach((tok, i) => {
        let t = tok;
        if (t.startsWith("*")) { am = true; t = t.slice(1); }
        const cierra = t.endsWith("*"); if (cierra) t = t.slice(0, -1);
        const s = document.createElement("span"); s.className = "p"; s.textContent = t;
        if (am) s.style.color = HL, s._am = true;
        if (i) d.appendChild(document.createTextNode(" "));
        d.appendChild(s); sp.push(s);
        if (cierra) am = false;
      });
      cont.appendChild(d);
      return { b, d, sp };
    });
  }
}

// ---------------------------------------------------------------- pintar
window.ESCENAS = ESCENAS_LISTA;
window.pintarEscena = function (n, t) {
  if (!FONDO) construir();
  const dur = DUR(n);
  for (const m of ESCENAS_LISTA) { $("s" + m).style.display = m === n ? "" : "none"; $("tx" + m).style.display = m === n ? "" : "none"; }
  FONDO.setAttribute("patternTransform", `translate(${(t * 16) % 72} ${(t * -11) % 72})`);
  PART.forEach(c => {
    const y = ((c._y - t * c._v) % 1980 + 1980) % 1980 - 30;
    const x = c._x + 22 * Math.sin(t * 0.8 + c._f);
    if (c._r) { c.setAttribute("cx", x); c.setAttribute("cy", y); }
    else c.setAttribute("transform", `translate(${x} ${y}) rotate(${t * 40 + c._f * 50})`);
  });
  const z = 1 + 0.04 * (t / dur);
  tf($("cam"), `translate(${540 + 7 * Math.sin(t * 0.5)} ${960 - 10 * t / dur * 4}) scale(${z}) translate(-540 -960)`);
  $("prog").setAttribute("width", 1080 * cl(t / dur));
  S[n].paint(t, dur);
  for (const { b, sp } of BLQ[n]) {
    const t0 = Math.min(b.en(), dur - 0.6);
    sp.forEach((s, i) => {
      const a = t0 + i * 0.09, p = sal(tramo(t, a, a + 0.28));
      const k = s._am ? lerp(1.35, 1, rebote(tramo(t, a, a + 0.45))) : lerp(0.9, 1, p);
      s.style.opacity = p;
      s.style.transform = `translateY(${(1 - p) * 40}px) scale(${k})`;
    });
  }
};
window.comprobarEscena = function (n, t) {
  window.pintarEscena(n, t);
  const m = [];
  for (const { b, sp } of BLQ[n]) {             // se mide sin transformaciones (offset*), no con la animación de entrada
    const ancho = Math.max(...sp.map(s => s.offsetLeft + s.offsetWidth));
    const alto = Math.max(...sp.map(s => s.offsetTop + s.offsetHeight));
    if (ancho > b.w + 1) m.push(`${b.txt}: no cabe a lo ancho`);
    if (alto > b.h + 1) m.push(`${b.txt}: no cabe en su caja (${alto} > ${b.h})`);
    if (b.y + Math.max(alto, b.h) > 1650) m.push(`${b.txt}: pasa de la zona segura`);
    if (b.x < 30 || b.x + b.w > 1050) m.push(`${b.txt}: fuera del ancho`);
  }
  return m;
};
window.addEventListener("DOMContentLoaded", () => { if (!FONDO) construir(); });


function rayos(g, n) { const a = []; for (let k = 0; k < n; k++) a.push(E("line", { stroke: CO, "stroke-width": 12, "stroke-linecap": "round" }, g)); return a; }
function pintaRayos(ls, cx, cy, t, r0, r1, vis) {
  ls.forEach((l, k) => {
    const a = (k * 360 / ls.length + t * 30) * Math.PI / 180, b = r0, c = r0 + (r1 - r0) * (0.6 + 0.4 * Math.sin(t * 7 + k)) * vis;
    l.setAttribute("x1", cx + b * Math.cos(a)); l.setAttribute("y1", cy + b * Math.sin(a));
    l.setAttribute("x2", cx + c * Math.cos(a)); l.setAttribute("y2", cy + c * Math.sin(a));
  });
}
const cuerpo = cx => `M${cx - 120} 900 Q${cx - 120} 700 ${cx} 700 Q${cx + 120} 700 ${cx + 120} 900 Z`;

// ======================= ESCENA 4 · el diario: la risa en persona, por teléfono y por chat
S[4] = {
  bloques: [
    { x: 70, y: 940, w: 450, h: 160, size: 66, txt: "Risa de verdad", en: () => W(4, "cara") - 0.2 },
    { x: 70, y: 1110, w: 450, h: 60, size: 40, col: SUB, txt: "en persona", en: () => W(4, "cara", 2) },
    { x: 560, y: 940, w: 450, h: 160, size: 66, txt: "Risa *escrita*", en: () => W(4, "chat") - 0.2 },
    { x: 560, y: 1110, w: 450, h: 60, size: 40, col: SUB, txt: "en el chat", en: () => W(4, "chat") + 0.3 },
  ],
  build(g) {
    const r = this.r = { fil: [], ray: [] };
    r.pag = E("g", {}, g);
    E("rect", { x: 100, y: 330, width: 880, height: 540, rx: 34, fill: PANEL, stroke: TX, "stroke-width": 7 }, r.pag);
    for (let k = 0; k < 6; k++) E("circle", { cx: 190 + k * 140, cy: 330, r: 16, fill: BG, stroke: TX, "stroke-width": 7 }, r.pag);
    const ys = [470, 620, 770];
    r.fila = ys.map((y, i) => {
      const f = E("g", {}, g); f._y = y;
      const col = [CI, ME, VI][i];
      if (i === 0) {
        E("path", { d: `M165 ${y - 34} h56 a12 12 0 0 1 12 12 v22 a12 12 0 0 1 -12 12 h-30 l-14 14 v-14 h-12 a12 12 0 0 1 -12 -12 v-22 a12 12 0 0 1 12 -12 Z`, fill: col, stroke: TX, "stroke-width": 6, "stroke-linejoin": "round" }, f);
        E("path", { d: `M265 ${y - 8} h40 a12 12 0 0 1 12 12 v20 a12 12 0 0 1 -12 12 h-8 v14 l-14 -14 h-18 a12 12 0 0 1 -12 -12 v-20 a12 12 0 0 1 12 -12 Z`, fill: AM, stroke: TX, "stroke-width": 6, "stroke-linejoin": "round" }, f);
      } else if (i === 1) {
        E("rect", { x: 190, y: y - 44, width: 66, height: 90, rx: 14, fill: col, stroke: TX, "stroke-width": 6 }, f);
        E("line", { x1: 210, y1: y + 30, x2: 236, y2: y + 30, stroke: TX, "stroke-width": 7, "stroke-linecap": "round" }, f);
        E("line", { x1: 272, y1: y - 20, x2: 290, y2: y - 36, stroke: col, "stroke-width": 7, "stroke-linecap": "round" }, f);
        E("line", { x1: 276, y1: y + 4, x2: 302, y2: y + 4, stroke: col, "stroke-width": 7, "stroke-linecap": "round" }, f);
      } else {
        E("path", { d: `M165 ${y - 36} h110 a14 14 0 0 1 14 14 v40 a14 14 0 0 1 -14 14 h-70 l-26 20 v-20 h-14 a14 14 0 0 1 -14 -14 v-40 a14 14 0 0 1 14 -14 Z`, fill: col, stroke: TX, "stroke-width": 6, "stroke-linejoin": "round" }, f);
        for (let d = 0; d < 3; d++) E("circle", { cx: 198 + d * 32, cy: y - 2, r: 8, fill: PANEL }, f);
      }
      const l = E("line", { x1: 340, y1: y + 6, x2: 340, y2: y + 6, stroke: GR, "stroke-width": 14, "stroke-linecap": "round" }, g);
      l._y = y; r.fil.push(l);
      return f;
    });
    r.risa = ys.map((y, i) => {
      const f = E("g", {}, g);
      if (i < 2) {
        E("circle", { cx: 800, cy: y, r: 30, fill: AM, stroke: TX, "stroke-width": 6 }, f);
        E("path", { d: `M786 ${y - 4} q14 22 28 0 z`, fill: TX }, f);
        r.ray.push(rayos(f, 8));
      } else {
        E("path", { d: `M730 ${y - 40} h130 a16 16 0 0 1 16 16 v46 a16 16 0 0 1 -16 16 h-84 l-30 22 v-22 h-16 a16 16 0 0 1 -16 -16 v-46 a16 16 0 0 1 16 -16 Z`, fill: VI, stroke: TX, "stroke-width": 6, "stroke-linejoin": "round" }, f);
        E("polyline", { points: `755,${y} 780,${y - 18} 805,${y + 14} 830,${y - 18} 855,${y + 10}`, fill: "none", stroke: "#FFFFFF", "stroke-width": 9, "stroke-linecap": "round", "stroke-linejoin": "round" }, f);
        r.ray.push([]);
      }
      return f;
    });
  },
  paint(t, dur) {
    const r = this.r, ta = [W(4, "cara"), W(4, "teléfono"), W(4, "chat")], tr = W(4, "risa");
    r.pag.setAttribute("transform", `translate(540 600) rotate(${1.2 * Math.sin(t * 0.7)}) translate(-540 -600)`);
    op(r.pag, rebote(tramo(t, 0.05, 0.6)));
    r.fila.forEach((f, i) => {
      const p = rebote(tramo(t, ta[i] - 0.15, ta[i] + 0.45));
      f.setAttribute("transform", `translate(${(1 - p) * -90} ${3 * Math.sin(t * 2 + i)})`); op(f, p);
      const l = r.fil[i]; l.setAttribute("x2", 340 + 330 * suave(tramo(t, ta[i], ta[i] + 0.7))); op(l, tramo(t, ta[i], ta[i] + 0.1));
      const pr = rebote(tramo(t, tr + i * 0.16, tr + i * 0.16 + 0.5));
      const g = r.risa[i], y = 470 + i * 150;
      g.setAttribute("transform", `translate(800 ${y}) scale(${pr}) translate(-800 ${-y}) translate(0 ${4 * Math.sin(t * 5 + i)})`);
      op(g, pr);
      if (r.ray[i].length) pintaRayos(r.ray[i], 800, y, t, 40, 74, pr);
    });
  },
};

// ======================= ESCENA 5 · dos barras de felicidad casi iguales
S[5] = {
  bloques: [
    { x: 70, y: 1090, w: 940, h: 180, size: 150, al: "center", txt: "Casi igual", en: () => W(5, "igual") - 0.3 },
    { x: 70, y: 1290, w: 940, h: 90, size: 56, al: "center", txt: "risa escrita y de *verdad*", en: () => W(5, "verdad") - 0.5 },
  ],
  build(g) {
    const r = this.r = { ray: null };
    for (const [cx, col] of [[290, CI], [790, ME]]) {
      E("rect", { x: cx - 90, y: 520, width: 180, height: 500, rx: 40, fill: PANEL, stroke: TX, "stroke-width": 7 }, g);
      for (let k = 1; k < 5; k++) E("line", { x1: cx - 90, y1: 520 + k * 100, x2: cx - 40, y2: 520 + k * 100, stroke: GR, "stroke-width": 6, "stroke-linecap": "round" }, g);
    }
    r.ba = E("rect", { x: 220, width: 140, rx: 30, fill: AM, stroke: TX, "stroke-width": 7 }, g);
    r.bb = E("rect", { x: 720, width: 140, rx: 30, fill: AM, stroke: TX, "stroke-width": 7 }, g);
    r.ia = E("g", {}, g);
    E("circle", { cx: 0, cy: 0, r: 36, fill: AM, stroke: TX, "stroke-width": 7 }, r.ia);
    E("path", { d: "M-16 -6 q16 26 32 0 z", fill: TX }, r.ia);
    r.ray = rayos(r.ia, 8);
    r.ib = E("g", {}, g);
    E("path", { d: "M-64 -40 h112 a16 16 0 0 1 16 16 v46 a16 16 0 0 1 -16 16 h-70 l-32 22 v-22 h-10 a16 16 0 0 1 -16 -16 v-46 a16 16 0 0 1 16 -16 Z", fill: VI, stroke: TX, "stroke-width": 7, "stroke-linejoin": "round" }, r.ib);
    E("polyline", { points: "-44,0 -22,-18 0,14 22,-18 44,10", fill: "none", stroke: "#FFFFFF", "stroke-width": 9, "stroke-linecap": "round", "stroke-linejoin": "round" }, r.ib);
    r.ig = E("g", {}, g);
    E("path", { d: "M450 780 q22 -22 44 0 t44 0", fill: "none", stroke: ME, "stroke-width": 16, "stroke-linecap": "round" }, r.ig);
    E("path", { d: "M450 830 q22 -22 44 0 t44 0", fill: "none", stroke: ME, "stroke-width": 16, "stroke-linecap": "round" }, r.ig);
    E("path", { d: "M450 780 q22 -22 44 0 t44 0", fill: "none", stroke: ME, "stroke-width": 16, "stroke-linecap": "round", opacity: 0 }, r.ig);
  },
  paint(t, dur) {
    const r = this.r, t0 = W(5, "risa"), tc = W(5, "casi"), tf2 = tc + 0.6;
    const base = 1000, H = 430;
    const q = suave(tramo(t, t0 - 0.1, tc + 0.3));
    const wob = (1 - tramo(t, tc - 0.4, tc + 0.3));
    const la = q * 0.92 + 0.06 * wob * Math.sin(t * 6) * q, lb = q * 0.88 + 0.06 * wob * Math.sin(t * 6 + 2) * q;
    r.ba.setAttribute("y", base - 20 - H * la); r.ba.setAttribute("height", 20 + H * la);
    r.bb.setAttribute("y", base - 20 - H * lb); r.bb.setAttribute("height", 20 + H * lb);
    const pi = rebote(tramo(t, 0.1, 0.7));
    r.ia.setAttribute("transform", `translate(290 ${base - 20 - H * la - 70}) scale(${pi})`);
    r.ib.setAttribute("transform", `translate(790 ${base - 20 - H * lb - 70}) scale(${pi}) translate(0 ${3 * Math.sin(t * 4)})`);
    pintaRayos(r.ray, 0, 0, t, 52, 86, pi);
    const pe = rebote(tramo(t, tf2 - 0.2, tf2 + 0.5));
    r.ig.setAttribute("transform", `translate(540 805) scale(${pe}) translate(-540 -805) translate(0 ${4 * Math.sin(t * 4)})`);
    op(r.ig, pe);
  },
};

</script></body></html>
