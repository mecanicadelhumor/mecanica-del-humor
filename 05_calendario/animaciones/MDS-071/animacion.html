<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>MDS-071 · animación a medida (C55.2)</title>
<!--
  MDS-071 · escenas [4,5] · brazo A del ciclo B2 (C55.2) · fondo crema #FFF4E0.
  Página autónoma: sin red, sin Math.random ni Date. Todo sale de (n, t); los movimientos se anclan
  a las palabras de la voz con W(), nunca a segundos escritos a mano. Sin caras: formas, objetos, esquemas.
-->
<style>
html,body{margin:0;padding:0;background:#05080f}
body{margin:0}
#lienzo{position:relative;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#FFF4E0;
  font-family:system-ui,"DejaVu Sans",Arial,sans-serif;color:#16213A}
#dib{position:absolute;left:0;top:0;width:1080px;height:1920px}
.bq{position:absolute;font-weight:900;line-height:1.12;letter-spacing:-.01em}
.bq .p{display:inline-block;opacity:0;transform-origin:50% 80%}
</style></head>
<body><div id="lienzo"></div>
<script>
const ESCENAS_LISTA = [4,5];
const BG="#FFF4E0", PUNTO="#FFE6BE", TX="#16213A", HL="#EF476F", GR="#B6AD9A", PANEL="#FFFFFF", STK="#16213A", SUB="#5B4A2A";
const PAL = ["#EF476F","#4CC9F0","#06D6A0","#9B5DE5","#FFB020"];
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const tramo = (t, a, b) => cl((t - a) / (b - a));
const suave = x => x * x * (3 - 2 * x);
const sal = x => 1 - Math.pow(1 - x, 3);
const rebote = x => { x = cl(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const AM = "#FFB020", CI = "#4CC9F0", CO = "#EF476F", ME = "#06D6A0", VI = "#9B5DE5";
function E(tag, at, par) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (par) par.appendChild(e); return e; }
const op = (el, v) => { el.style.opacity = cl(v); };
const tf = (el, s) => el.setAttribute("transform", s);
const pop = (el, x, y, p, rot = 0) => { tf(el, `translate(${x} ${y}) rotate(${rot}) scale(${Math.max(p, 0.001)})`); op(el, p * 3); };

let T = {};
window.cargarTiempos = d => { T = d || {}; };
const norm = s => s.normalize("NFD").replace(/[^\p{L}\p{N}]/gu, "").toLowerCase();
function W(n, pal, vez = 1) {           // instante en que la voz dice `pal` en la escena n
  let k = 0;
  for (const [t, w] of (T[n] || {}).palabras || []) if (norm(w) === norm(pal) && ++k === vez) return t;
  return 0.6;
}
const DUR = n => ((T[n] || {}).dur) || 8;
const S = {};
let FONDO, PART = [], BLQ = {};

function construir() {
  const lienzo = $("lienzo");
  const svg = E("svg", { id: "dib", viewBox: "0 0 1080 1920", width: 1080, height: 1920 }, lienzo);
  const defs = E("defs", {}, svg);
  const pat = E("pattern", { id: "reti", width: 72, height: 72, patternUnits: "userSpaceOnUse" }, defs);
  E("circle", { cx: 18, cy: 18, r: 5, fill: PUNTO }, pat);
  E("circle", { cx: 54, cy: 54, r: 5, fill: PUNTO }, pat);
  FONDO = pat;
  E("rect", { x: 0, y: 0, width: 1080, height: 1920, fill: "url(#reti)" }, svg);
  for (let i = 0; i < 22; i++) {
    const col = PAL[i % PAL.length];
    const c = i % 2 ? E("circle", { r: 7 + (i % 4) * 3, fill: col, opacity: 0.55 }, svg)
                    : E("rect", { x: -9, y: -9, width: 18 + (i % 3) * 4, height: 18 + (i % 3) * 4, rx: 5, fill: col, opacity: 0.55 }, svg);
    c._x = (i * 197) % 1080; c._y = (i * 331) % 1920; c._v = 16 + (i * 7) % 26; c._f = i * 1.3; c._r = i % 2;
    PART.push(c);
  }
  const cam = E("g", { id: "cam" }, svg);
  E("rect", { id: "prog", x: 0, y: 0, width: 0, height: 12, fill: HL }, svg);
  for (const n of ESCENAS_LISTA) {
    const g = E("g", { id: "s" + n }, cam);
    S[n].build(g, defs);
    const cont = document.createElement("div"); cont.id = "tx" + n; lienzo.appendChild(cont);
    BLQ[n] = (S[n].bloques || []).map(b => {
      const d = document.createElement("div"); d.className = "bq";
      d.style.cssText = `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;font-size:${b.size}px;color:${b.col || TX};text-align:${b.al || "left"};font-weight:${b.peso || 900}`;
      let am = false; const sp = [];
      b.txt.split(" ").forEach((tok, i) => {
        let t = tok;
        if (t.startsWith("*")) { am = true; t = t.slice(1); }
        const cierra = t.endsWith("*"); if (cierra) t = t.slice(0, -1);
        const s = document.createElement("span"); s.className = "p"; s.textContent = t;
        if (am) s.style.color = HL, s._am = true;
        if (i) d.appendChild(document.createTextNode(" "));
        d.appendChild(s); sp.push(s);
        if (cierra) am = false;
      });
      cont.appendChild(d);
      return { b, d, sp };
    });
  }
}

window.ESCENAS = ESCENAS_LISTA;
window.pintarEscena = function (n, t) {
  if (!FONDO) construir();
  const dur = DUR(n);
  for (const m of ESCENAS_LISTA) { $("s" + m).style.display = m === n ? "" : "none"; $("tx" + m).style.display = m === n ? "" : "none"; }
  FONDO.setAttribute("patternTransform", `translate(${(t * 16) % 72} ${(t * -11) % 72})`);
  PART.forEach(c => {
    const y = ((c._y - t * c._v) % 1980 + 1980) % 1980 - 30;
    const x = c._x + 22 * Math.sin(t * 0.8 + c._f);
    if (c._r) { c.setAttribute("cx", x); c.setAttribute("cy", y); }
    else c.setAttribute("transform", `translate(${x} ${y}) rotate(${t * 40 + c._f * 50})`);
  });
  const z = 1 + 0.04 * (t / dur);
  tf($("cam"), `translate(${540 + 7 * Math.sin(t * 0.5)} ${960 - 10 * t / dur * 4}) scale(${z}) translate(-540 -960)`);
  $("prog").setAttribute("width", 1080 * cl(t / dur));
  S[n].paint(t, dur);
  for (const { b, sp } of BLQ[n]) {
    const t0 = Math.min(b.en(), dur - 0.6);
    sp.forEach((s, i) => {
      const a = t0 + i * 0.09, p = sal(tramo(t, a, a + 0.28));
      const k = s._am ? lerp(1.35, 1, rebote(tramo(t, a, a + 0.45))) : lerp(0.9, 1, p);
      s.style.opacity = p;
      s.style.transform = `translateY(${(1 - p) * 40}px) scale(${k})`;
    });
  }
};
window.comprobarEscena = function (n, t) {
  window.pintarEscena(n, t);
  const m = [];
  for (const { b, sp } of BLQ[n]) {
    const ancho = Math.max(...sp.map(s => s.offsetLeft + s.offsetWidth));
    const alto = Math.max(...sp.map(s => s.offsetTop + s.offsetHeight));
    if (ancho > b.w + 1) m.push(`${b.txt}: no cabe a lo ancho`);
    if (alto > b.h + 1) m.push(`${b.txt}: no cabe en su caja (${alto} > ${b.h})`);
    if (b.y + Math.max(alto, b.h) > 1650) m.push(`${b.txt}: pasa de la zona segura`);
    if (b.x < 30 || b.x + b.w > 1050) m.push(`${b.txt}: fuera del ancho`);
  }
  return m;
};
window.addEventListener("DOMContentLoaded", () => { if (!FONDO) construir(); });

// figura sin cara: cuerpo redondeado y cabeza lisa
function fig(g, col) {
  const f = E("g", {}, g);
  E("path", { d: "M-44 90 Q-44 0 0 0 Q44 0 44 90 Z", fill: col, stroke: STK, "stroke-width": 7, "stroke-linejoin": "round" }, f);
  E("circle", { cx: 0, cy: -38, r: 34, fill: col, stroke: STK, "stroke-width": 7 }, f);
  return f;
}
// bocadillo con cola abajo-izquierda; devuelve grupo centrado en (0,0)
function boca(g, w, h, fill, dash) {
  const b = E("g", {}, g);
  E("path", { d: `M${-w / 2 + 40} ${h / 2 - 4} L${-w / 2 + 20} ${h / 2 + 42} L${-w / 2 + 84} ${h / 2 - 4} Z`, fill: fill || PANEL, stroke: STK, "stroke-width": 7, "stroke-linejoin": "round", ...(dash ? { "stroke-dasharray": "14 12" } : {}) }, b);
  E("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: 36, fill: fill || PANEL, stroke: STK, "stroke-width": 7, ...(dash ? { "stroke-dasharray": "14 12" } : {}) }, b);
  E("rect", { x: -w / 2 + 34, y: h / 2 - 10, width: 44, height: 12, fill: fill || PANEL }, b);
  return b;
}
function lineas(g, w, h, col, n = 3) {
  const l = E("g", {}, g);
  for (let i = 0; i < n; i++) {
    const ww = (w - 60) * (i === n - 1 ? 0.55 : 1 - i * 0.08);
    E("rect", { x: -w / 2 + 30, y: -h / 2 + 28 + i * ((h - 56) / n), width: ww, height: 14, rx: 7, fill: col }, l);
  }
  return l;
}
function ja(g, size, col) {
  const t = E("text", { x: 0, y: size * 0.34, "text-anchor": "middle", "font-size": size, "font-weight": 900, fill: col, "font-family": "system-ui,'DejaVu Sans',Arial,sans-serif" }, g);
  t.textContent = "ja"; return t;
}
function ondas(g, col, n = 3) {
  const a = [];
  for (let i = 0; i < n; i++) a.push(E("path", { fill: "none", stroke: col, "stroke-width": 9, "stroke-linecap": "round" }, g));
  return a;
}
function pintaOndas(a, cx, cy, t, r0, sep, vis, lado) {
  a.forEach((p, i) => {
    const r = r0 + i * sep + 5 * Math.sin(t * 6 - i * 1.2);
    const x0 = cx + lado * r * Math.cos(0.7), y0 = cy - r * Math.sin(0.7), x1 = cx + lado * r * Math.cos(0.7), y1 = cy + r * Math.sin(0.7);
    p.setAttribute("d", `M${x0} ${y0} A${r} ${r} 0 0 ${lado > 0 ? 1 : 0} ${x1} ${y1}`);
    p.style.opacity = cl(vis * (0.55 + 0.45 * Math.sin(t * 5 - i * 1.4)));
  });
}

// ---- piezas de esta página: perro de perfil, mano, micro, iconos
function perro(g, fill) {
  const r = E("g", {}, g);
  r.cola = E("path", { d: "M-112 -30 Q-175 -62 -168 -128", fill: "none", stroke: STK, "stroke-width": 24, "stroke-linecap": "round" }, r);
  E("path", { d: "M-112 -30 Q-175 -62 -168 -128", fill: "none", stroke: fill, "stroke-width": 11, "stroke-linecap": "round" }, r.cola);
  [-80, 70].forEach(x => E("rect", { x: x - 21, y: 40, width: 42, height: 74, rx: 21, fill, stroke: STK, "stroke-width": 7 }, r));
  r.cuerpo = E("g", {}, r);
  E("ellipse", { cx: 0, cy: 0, rx: 125, ry: 72, fill, stroke: STK, "stroke-width": 7 }, r.cuerpo);
  E("circle", { cx: 128, cy: -56, r: 52, fill, stroke: STK, "stroke-width": 7 }, r.cuerpo);
  E("rect", { x: 140, y: -52, width: 82, height: 46, rx: 23, fill, stroke: STK, "stroke-width": 7 }, r.cuerpo);
  E("circle", { cx: 218, cy: -46, r: 12, fill: STK }, r.cuerpo);
  r.lengua = E("path", { d: "M168 -8 Q172 36 190 34 Q206 34 204 -8 Z", fill: CO, stroke: STK, "stroke-width": 5, "stroke-linejoin": "round" }, r.cuerpo);
  E("path", { d: "M100 -100 Q62 -96 66 -34 Q96 -42 112 -78 Z", fill: AM, stroke: STK, "stroke-width": 6, "stroke-linejoin": "round" }, r.cuerpo);
  E("circle", { cx: 142, cy: -72, r: 8, fill: STK }, r.cuerpo);
  r.ond = ondas(r, ME, 3);
  return r;
}
function mano(g) {
  const m = E("g", {}, g), piel = "#FFCFA8";
  E("rect", { x: -48, y: 0, width: 96, height: 120, rx: 30, fill: piel, stroke: STK, "stroke-width": 7 }, m);
  m.dedos = [-33, -11, 11, 33].map(x => {
    const d = E("rect", { x: -11, y: -78, width: 22, height: 90, rx: 11, fill: piel, stroke: STK, "stroke-width": 6 }, m);
    d._x = x; return d;
  });
  return m;
}
const mueve = (m, x, y, t, vis, rit) => {
  tf(m, `translate(${x} ${y})`); op(m, vis * 4);
  m.dedos.forEach((d, i) => tf(d, `translate(${d._x} 0) rotate(${rit * 26 * Math.sin(t * 15 + i * 1.3)} 0 70)`));
};
function micro(g) {
  const m = E("g", {}, g);
  E("rect", { x: -7, y: 8, width: 14, height: 62, rx: 7, fill: GR, stroke: STK, "stroke-width": 5 }, m);
  E("circle", { cx: 0, cy: 0, r: 26, fill: "#8D99AE", stroke: STK, "stroke-width": 6 }, m);
  E("path", { d: "M-22 -6 L22 -6 M-24 6 L24 6", stroke: STK, "stroke-width": 4 }, m);
  m.ond = ondas(m, AM, 3);
  return m;
}
const jadeo = (r, t, v, f = 16) => {
  r.lengua.style.opacity = v;
  tf(r.lengua, `translate(0 ${v * 8 * Math.abs(Math.sin(t * f))})`);
  tf(r.cuerpo, `translate(0 ${1.5 * Math.sin(t * (2.4 + 6 * v))}) scale(${1 + (0.012 + 0.025 * v) * Math.sin(t * (2.4 + 8 * v))} ${1 + (0.02 + 0.04 * v) * Math.sin(t * (2.4 + 8 * v))})`);
};
const colea = (r, t, v) => tf(r.cola, `rotate(${(10 + 20 * v) * Math.sin(t * (3 + 7 * v))} -112 -30)`);
function cono(g) {
  const c = E("g", {}, g);
  E("rect", { x: -90, y: 66, width: 180, height: 22, rx: 8, fill: AM, stroke: STK, "stroke-width": 6 }, c);
  E("path", { d: "M-24 -86 L24 -86 L70 66 L-70 66 Z", fill: CO, stroke: STK, "stroke-width": 6, "stroke-linejoin": "round" }, c);
  E("path", { d: "M-40 -22 L40 -22 M-56 26 L56 26", stroke: "#FFFFFF", "stroke-width": 14 }, c);
  return c;
}
function pelota(g) {
  const c = E("g", {}, g);
  E("circle", { cx: 0, cy: 0, r: 78, fill: AM, stroke: STK, "stroke-width": 7 }, c);
  E("path", { d: "M-70 -34 Q0 10 70 -34 M-70 34 Q0 -10 70 34", fill: "none", stroke: STK, "stroke-width": 6 }, c);
  return c;
}
function luna(g) {
  const c = E("g", {}, g);
  E("path", { d: "M22 -78 A78 78 0 1 0 74 40 A62 62 0 1 1 22 -78 Z", fill: VI, stroke: STK, "stroke-width": 7, "stroke-linejoin": "round" }, c);
  return c;
}
const corazon = (g, col) => E("path", { d: "M0 26 C-52 -12 -38 -52 0 -28 C38 -52 52 -12 0 26 Z", fill: col, stroke: STK, "stroke-width": 5, "stroke-linejoin": "round" }, g);

// ======================= ESCENA 4 · micrófonos al perro y a la persona, dieciséis perros, tres momentos
S[4] = {
  bloques: [
    { x: 60, y: 680, w: 960, h: 110, size: 92, al: "center", txt: "Micrófono al *perro*", en: () => W(4, "microfonos") - 0.3 },
    { x: 40, y: 810, w: 1000, h: 80, size: 60, peso: 800, al: "center", txt: "Entrenar · jugar · descansar", en: () => W(4, "entrenaban") - 0.5 },
  ],
  build(g) {
    const r = this.r = { pts: [], tar: [] };
    r.d = E("g", {}, g); r.perro = perro(r.d, "#FFFFFF");
    r.mp = E("g", {}, g); r.micP = micro(r.mp);
    r.p = E("g", {}, g); fig(r.p, ME);
    r.mh = E("g", {}, g); r.micH = micro(r.mh);
    for (let i = 0; i < 16; i++) {
      const s = E("circle", { cx: 100 + i * 58.6, cy: 600, r: 17, fill: "none", stroke: GR, "stroke-width": 5, "stroke-dasharray": "6 6" }, g);
      const c = E("circle", { cx: 100 + i * 58.6, cy: 600, r: 17, fill: PAL[i % 5], stroke: STK, "stroke-width": 5 }, g);
      c._s = s; r.pts.push(c);
    }
    [[190, cono, AM], [540, pelota, CO], [890, luna, VI]].forEach(([cx, f, col], i) => {
      const k = { cx, col };
      k.slot = E("rect", { x: cx - 145, y: 1045, width: 290, height: 250, rx: 38, fill: "none", stroke: GR, "stroke-width": 7, "stroke-dasharray": "16 12" }, g);
      k.g = E("g", {}, g);
      E("rect", { x: -145, y: -125, width: 290, height: 250, rx: 38, fill: PANEL, stroke: STK, "stroke-width": 7 }, k.g);
      k.ic = f(k.g); tf(k.ic, "scale(0.95)");
      k.w = E("path", { fill: "none", stroke: col, "stroke-width": 10, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
      k.mic = E("circle", { cx, cy: 1500, r: 0 }, g);
      r.tar.push(k);
    });
  },
  paint(t, dur) {
    const r = this.r, tM = W(4, "microfonos"), tD = W(4, "dieciseis");
    const q1 = rebote(tramo(t, 0.05, 0.6)), q2 = rebote(tramo(t, 0.2, 0.75));
    tf(r.d, `translate(290 ${340 - (1 - q1) * 90 + 3 * Math.sin(t * 2)}) scale(${Math.max(q1, 0.001) * 1.1})`); op(r.d, q1 * 4);
    jadeo(r.perro, t, 0, 1); colea(r.perro, t, 0.3);
    r.perro.ond.forEach(o => op(o, 0));
    tf(r.p, `translate(790 ${340 - (1 - q2) * 90 + 3 * Math.sin(t * 2 + 1)}) scale(${Math.max(q2, 0.001) * 1.5})`); op(r.p, q2 * 4);
    // los micrófonos entran con «micrófonos» y «escuchan»
    const m = rebote(tramo(t, tM - 0.2, tM + 0.4));
    tf(r.mp, `translate(${400 - (1 - m) * 90} ${440 - (1 - m) * 60}) rotate(${-30 + 4 * Math.sin(t * 3)}) scale(${Math.max(m, 0.001)})`); op(r.mp, m * 3);
    tf(r.mh, `translate(${690 + (1 - m) * 90} ${400 - (1 - m) * 60}) rotate(${30 + 4 * Math.sin(t * 3 + 1)}) scale(${Math.max(m, 0.001)})`); op(r.mh, m * 3);
    pintaOndas(r.micP.ond, 0, 0, t, 40, 24, tramo(t, tM + 0.1, tM + 0.4), -1);
    pintaOndas(r.micH.ond, 0, 0, t, 40, 24, tramo(t, tM + 0.1, tM + 0.4), 1);
    // dieciséis perros: dieciséis puntos que se encienden uno tras otro
    r.pts.forEach((c, i) => {
      const a = tD - 0.05 + i * 0.045, p = rebote(tramo(t, a, a + 0.35));
      op(c._s, rebote(tramo(t, 0.1 + i * 0.03, 0.4 + i * 0.03)) * 1);
      tf(c, `translate(0 ${-6 * Math.sin(t * 3 + i)}) translate(${c.getAttribute("cx")} ${c.getAttribute("cy")}) scale(${Math.max(p, 0.001)}) translate(${-c.getAttribute("cx")} ${-c.getAttribute("cy")})`); op(c, p * 3);
    });
    // los tres momentos
    ["entrenaban", "jugaban", "descansaban"].forEach((pal, i) => {
      const k = r.tar[i], a = W(4, pal) - 0.25, p = rebote(tramo(t, a, a + 0.5));
      tf(k.g, `translate(${k.cx} ${1170 + (1 - sal(tramo(t, a, a + 0.5))) * 160 + 6 * Math.sin(t * 2.3 + i)}) rotate(${(1 - p) * 8 + 1.5 * Math.sin(t * 1.9 + i)}) scale(${Math.max(p, 0.001)})`); op(k.g, p * 3);
      tf(k.ic, `translate(0 ${4 * Math.sin(t * 4 + i)}) scale(0.95)`);
      op(k.slot, rebote(tramo(t, 0.2 + i * 0.12, 0.7 + i * 0.12)) * (1 - tramo(t, a, a + 0.3)));
      let d = "";
      for (let x = k.cx - 130; x <= k.cx + 130; x += 3) d += (d ? "L" : "M") + x + " " + (1470 + 28 * Math.sin((x - k.cx) * 0.07 - t * 9 + i)).toFixed(1);
      k.w.setAttribute("d", d); op(k.w, p * 3);
    });
  },
};

// ======================= ESCENA 5 · el jadeo, solo al jugar (y con cosquillas y mimos)
S[5] = {
  bloques: [
    { x: 60, y: 740, w: 960, h: 150, size: 124, al: "center", txt: "Solo al *jugar*", en: () => W(5, "jugar") - 0.25 },
    { x: 40, y: 930, w: 1000, h: 80, size: 58, peso: 700, col: SUB, al: "center", txt: "y con cosquillas y mimos", en: () => W(5, "cosquillas") - 0.5 },
  ],
  build(g) {
    const r = this.r = { bar: [], cor: [] };
    [[215, cono, AM, "entrenar"], [540, pelota, CO, "jugar"], [865, luna, VI, "descansar"]].forEach(([cx, f, col, pal], i) => {
      const b = { cx, col, pal, g: E("g", {}, g) };
      E("rect", { x: cx - 95, y: 200, width: 190, height: 430, rx: 48, fill: PANEL, stroke: STK, "stroke-width": 7 }, b.g);
      b.nivel = E("rect", { x: cx - 83, y: 620, width: 166, height: 0, rx: 36, fill: col }, b.g);
      b.ic = E("g", {}, g); const ii = f(b.ic); tf(ii, "scale(0.5)");
      b.sl = E("path", { d: `M${cx - 62} 612 L${cx + 62} 612`, stroke: GR, "stroke-width": 8, "stroke-linecap": "round" }, g);
      r.bar.push(b);
    });
    r.d = E("g", {}, g); r.perro = perro(r.d, "#FFFFFF");
    r.mano = mano(g);
    for (let i = 0; i < 4; i++) { const h = E("g", {}, g); corazon(h, i % 2 ? CO : AM); r.cor.push(h); }
  },
  paint(t, dur) {
    const r = this.r, tJ = W(5, "jugar"), tK = W(5, "cosquillas"), tM = W(5, "mimos");
    r.bar.forEach((b, i) => {
      const a = Math.min(W(5, b.pal) - 0.3, dur - 1), p = rebote(tramo(t, a, a + 0.5)), q = rebote(tramo(t, 0.1 + i * 0.1, 0.6 + i * 0.1));
      tf(b.ic, `translate(${b.cx} ${150 + 4 * Math.sin(t * 3 + i)}) scale(${Math.max(q, 0.001)})`); op(b.ic, q * 3);
      op(b.g, q * 4); op(b.sl, q * 2);
      let niv;
      if (i === 1) niv = 0.05 + 0.95 * Math.min(1.08, rebote(tramo(t, tJ - 0.2, tJ + 0.7)));
      else niv = 0.05 + 0.05 * Math.abs(Math.sin(t * 8)) * (1 - tramo(t, a + 0.5, a + 0.9));
      const h = 400 * cl(niv, 0, 1.05);
      b.nivel.setAttribute("y", 620 - h); b.nivel.setAttribute("height", Math.max(h, 0.01));
    });
    // el perro de abajo: tranquilo hasta «jugar»; luego jadea; con cosquillas y mimos, también
    const q = rebote(tramo(t, 0.1, 0.6)), v = tramo(t, tJ - 0.1, tJ + 0.3), vk = tramo(t, tK - 0.1, tK + 0.3);
    tf(r.d, `translate(360 ${1370 - (1 - q) * 100 - 14 * Math.abs(Math.sin(t * 6)) * v * (1 - vk)}) scale(${Math.max(q, 0.001) * 1.25})`); op(r.d, q * 4);
    jadeo(r.perro, t, Math.max(v, 0), 16); colea(r.perro, t, Math.max(v, vk));
    pintaOndas(r.perro.ond, 232, -26, t, 36, 26, v, 1);
    const hv = tramo(t, tK - 0.2, tK + 0.2);
    mueve(r.mano, lerp(120, 360, sal(tramo(t, tK - 0.2, tK + 0.35))) + 14 * Math.sin(t * 9) * hv, lerp(1640, 1470, sal(tramo(t, tK - 0.2, tK + 0.35))) + 8 * Math.sin(t * 13) * hv, t, hv, hv);
    r.cor.forEach((h, i) => {
      const a = tM - 0.1 + i * 0.16, p = rebote(tramo(t, a, a + 0.4)), up = Math.max(0, t - a) * 38;
      tf(h, `translate(${420 + i * 74 + 14 * Math.sin(t * 3 + i)} ${1190 - (up % 90)}) rotate(${12 * Math.sin(t * 4 + i)}) scale(${Math.max(p, 0.001)})`); op(h, p * 3);
    });
  },
};
