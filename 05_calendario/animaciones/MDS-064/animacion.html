<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>MDS-064 · animación a medida (C55.2)</title>
<!--
  MDS-064 · escenas [4, 5] · brazo A del ciclo B2 (C55.2) · fondo crema #FFF4E0.
  Página autónoma: sin red, sin Math.random ni Date. Todo sale de (n, t); los movimientos se anclan
  a las palabras de la voz con W(), nunca a segundos escritos a mano. Sin caras: formas, objetos, esquemas.
-->
<style>
html,body{margin:0;padding:0;background:#05080f}
body{margin:0}
#lienzo{position:relative;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#FFF4E0;
  font-family:system-ui,"DejaVu Sans",Arial,sans-serif;color:#16213A}
#dib{position:absolute;left:0;top:0;width:1080px;height:1920px}
.bq{position:absolute;font-weight:900;line-height:1.12;letter-spacing:-.01em}
.bq .p{display:inline-block;opacity:0;transform-origin:50% 80%}
</style></head>
<body><div id="lienzo"></div>
<script>
const ESCENAS_LISTA = [4, 5];
const BG="#FFF4E0", PUNTO="#FFE6BE", TX="#16213A", HL="#EF476F", GR="#B6AD9A", PANEL="#FFFFFF", STK="#16213A";
const PAL = ["#EF476F","#4CC9F0","#06D6A0","#9B5DE5","#FFB020"];
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const tramo = (t, a, b) => cl((t - a) / (b - a));
const suave = x => x * x * (3 - 2 * x);
const sal = x => 1 - Math.pow(1 - x, 3);
const rebote = x => { x = cl(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const AM = "#FFB020", CI = "#4CC9F0", CO = "#EF476F", ME = "#06D6A0", VI = "#9B5DE5";
function E(tag, at, par) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (par) par.appendChild(e); return e; }
const op = (el, v) => { el.style.opacity = cl(v); };
const tf = (el, s) => el.setAttribute("transform", s);
const pop = (el, x, y, p, rot = 0) => { tf(el, `translate(${x} ${y}) rotate(${rot}) scale(${Math.max(p, 0.001)})`); op(el, p * 3); };

let T = {};
window.cargarTiempos = d => { T = d || {}; };
const norm = s => s.normalize("NFD").replace(/[^\p{L}\p{N}]/gu, "").toLowerCase();
function W(n, pal, vez = 1) {           // instante en que la voz dice `pal` en la escena n
  let k = 0;
  for (const [t, w] of (T[n] || {}).palabras || []) if (norm(w) === norm(pal) && ++k === vez) return t;
  return 0.6;
}
const DUR = n => ((T[n] || {}).dur) || 8;
const S = {};
let FONDO, PART = [], BLQ = {};

function construir() {
  const lienzo = $("lienzo");
  const svg = E("svg", { id: "dib", viewBox: "0 0 1080 1920", width: 1080, height: 1920 }, lienzo);
  const defs = E("defs", {}, svg);
  const pat = E("pattern", { id: "reti", width: 72, height: 72, patternUnits: "userSpaceOnUse" }, defs);
  E("circle", { cx: 18, cy: 18, r: 5, fill: PUNTO }, pat);
  E("circle", { cx: 54, cy: 54, r: 5, fill: PUNTO }, pat);
  FONDO = pat;
  E("rect", { x: 0, y: 0, width: 1080, height: 1920, fill: "url(#reti)" }, svg);
  for (let i = 0; i < 22; i++) {
    const col = PAL[i % PAL.length];
    const c = i % 2 ? E("circle", { r: 7 + (i % 4) * 3, fill: col, opacity: 0.55 }, svg)
                    : E("rect", { x: -9, y: -9, width: 18 + (i % 3) * 4, height: 18 + (i % 3) * 4, rx: 5, fill: col, opacity: 0.55 }, svg);
    c._x = (i * 197) % 1080; c._y = (i * 331) % 1920; c._v = 16 + (i * 7) % 26; c._f = i * 1.3; c._r = i % 2;
    PART.push(c);
  }
  const cam = E("g", { id: "cam" }, svg);
  E("rect", { id: "prog", x: 0, y: 0, width: 0, height: 12, fill: HL }, svg);
  for (const n of ESCENAS_LISTA) {
    const g = E("g", { id: "s" + n }, cam);
    S[n].build(g, defs);
    const cont = document.createElement("div"); cont.id = "tx" + n; lienzo.appendChild(cont);
    BLQ[n] = (S[n].bloques || []).map(b => {
      const d = document.createElement("div"); d.className = "bq";
      d.style.cssText = `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;font-size:${b.size}px;color:${b.col || TX};text-align:${b.al || "left"};font-weight:${b.peso || 900}`;
      let am = false; const sp = [];
      b.txt.split(" ").forEach((tok, i) => {
        let t = tok;
        if (t.startsWith("*")) { am = true; t = t.slice(1); }
        const cierra = t.endsWith("*"); if (cierra) t = t.slice(0, -1);
        const s = document.createElement("span"); s.className = "p"; s.textContent = t;
        if (am) s.style.color = HL, s._am = true;
        if (i) d.appendChild(document.createTextNode(" "));
        d.appendChild(s); sp.push(s);
        if (cierra) am = false;
      });
      cont.appendChild(d);
      return { b, d, sp };
    });
  }
}

window.ESCENAS = ESCENAS_LISTA;
window.pintarEscena = function (n, t) {
  if (!FONDO) construir();
  const dur = DUR(n);
  for (const m of ESCENAS_LISTA) { $("s" + m).style.display = m === n ? "" : "none"; $("tx" + m).style.display = m === n ? "" : "none"; }
  FONDO.setAttribute("patternTransform", `translate(${(t * 16) % 72} ${(t * -11) % 72})`);
  PART.forEach(c => {
    const y = ((c._y - t * c._v) % 1980 + 1980) % 1980 - 30;
    const x = c._x + 22 * Math.sin(t * 0.8 + c._f);
    if (c._r) { c.setAttribute("cx", x); c.setAttribute("cy", y); }
    else c.setAttribute("transform", `translate(${x} ${y}) rotate(${t * 40 + c._f * 50})`);
  });
  const z = 1 + 0.04 * (t / dur);
  tf($("cam"), `translate(${540 + 7 * Math.sin(t * 0.5)} ${960 - 10 * t / dur * 4}) scale(${z}) translate(-540 -960)`);
  $("prog").setAttribute("width", 1080 * cl(t / dur));
  S[n].paint(t, dur);
  for (const { b, sp } of BLQ[n]) {
    const t0 = Math.min(b.en(), dur - 0.6);
    sp.forEach((s, i) => {
      const a = t0 + i * 0.09, p = sal(tramo(t, a, a + 0.28));
      const k = s._am ? lerp(1.35, 1, rebote(tramo(t, a, a + 0.45))) : lerp(0.9, 1, p);
      s.style.opacity = p;
      s.style.transform = `translateY(${(1 - p) * 40}px) scale(${k})`;
    });
  }
};
window.comprobarEscena = function (n, t) {
  window.pintarEscena(n, t);
  const m = [];
  for (const { b, sp } of BLQ[n]) {
    const ancho = Math.max(...sp.map(s => s.offsetLeft + s.offsetWidth));
    const alto = Math.max(...sp.map(s => s.offsetTop + s.offsetHeight));
    if (ancho > b.w + 1) m.push(`${b.txt}: no cabe a lo ancho`);
    if (alto > b.h + 1) m.push(`${b.txt}: no cabe en su caja (${alto} > ${b.h})`);
    if (b.y + Math.max(alto, b.h) > 1650) m.push(`${b.txt}: pasa de la zona segura`);
    if (b.x < 30 || b.x + b.w > 1050) m.push(`${b.txt}: fuera del ancho`);
  }
  return m;
};
window.addEventListener("DOMContentLoaded", () => { if (!FONDO) construir(); });

// figura sin cara: cuerpo redondeado y cabeza lisa
function fig(g, col) {
  const f = E("g", {}, g);
  E("path", { d: "M-44 90 Q-44 0 0 0 Q44 0 44 90 Z", fill: col, stroke: STK, "stroke-width": 7, "stroke-linejoin": "round" }, f);
  E("circle", { cx: 0, cy: -38, r: 34, fill: col, stroke: STK, "stroke-width": 7 }, f);
  return f;
}
// bocadillo con cola abajo-izquierda; devuelve grupo centrado en (0,0)
function boca(g, w, h, fill, dash) {
  const b = E("g", {}, g);
  E("path", { d: `M${-w / 2 + 40} ${h / 2 - 4} L${-w / 2 + 20} ${h / 2 + 42} L${-w / 2 + 84} ${h / 2 - 4} Z`, fill: fill || PANEL, stroke: STK, "stroke-width": 7, "stroke-linejoin": "round", ...(dash ? { "stroke-dasharray": "14 12" } : {}) }, b);
  E("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: 36, fill: fill || PANEL, stroke: STK, "stroke-width": 7, ...(dash ? { "stroke-dasharray": "14 12" } : {}) }, b);
  E("rect", { x: -w / 2 + 34, y: h / 2 - 10, width: 44, height: 12, fill: fill || PANEL }, b);
  return b;
}
function lineas(g, w, h, col, n = 3) {
  const l = E("g", {}, g);
  for (let i = 0; i < n; i++) {
    const ww = (w - 60) * (i === n - 1 ? 0.55 : 1 - i * 0.08);
    E("rect", { x: -w / 2 + 30, y: -h / 2 + 28 + i * ((h - 56) / n), width: ww, height: 14, rx: 7, fill: col }, l);
  }
  return l;
}
function ja(g, size, col) {
  const t = E("text", { x: 0, y: size * 0.34, "text-anchor": "middle", "font-size": size, "font-weight": 900, fill: col, "font-family": "system-ui,'DejaVu Sans',Arial,sans-serif" }, g);
  t.textContent = "ja"; return t;
}
function ondas(g, col, n = 3) {
  const a = [];
  for (let i = 0; i < n; i++) a.push(E("path", { fill: "none", stroke: col, "stroke-width": 9, "stroke-linecap": "round" }, g));
  return a;
}
function pintaOndas(a, cx, cy, t, r0, sep, vis, lado) {
  a.forEach((p, i) => {
    const r = r0 + i * sep + 5 * Math.sin(t * 6 - i * 1.2);
    const x0 = cx + lado * r * Math.cos(0.7), y0 = cy - r * Math.sin(0.7), x1 = cx + lado * r * Math.cos(0.7), y1 = cy + r * Math.sin(0.7);
    p.setAttribute("d", `M${x0} ${y0} A${r} ${r} 0 0 ${lado > 0 ? 1 : 0} ${x1} ${y1}`);
    p.style.opacity = cl(vis * (0.55 + 0.45 * Math.sin(t * 5 - i * 1.4)));
  });
}

function ico(g, k) {
  const c = E("g", {}, g);
  if (k === 0) {
    const b = boca(c, 200, 104, "#FFFFFF"); tf(b, "translate(0 -12)");
    const l = lineas(c, 200, 104, VI, 3); tf(l, "translate(0 -12)");
  } else if (k === 1) {
    const f = fig(c, ME); tf(f, "translate(-30 30) scale(0.95)");
    E("circle", { cx: 52, cy: 0, r: 15, fill: CI, stroke: STK, "stroke-width": 5 }, c);
    E("circle", { cx: 84, cy: -36, r: 22, fill: CI, stroke: STK, "stroke-width": 5 }, c);
    E("circle", { cx: 50, cy: -66, r: 12, fill: CI, stroke: STK, "stroke-width": 5 }, c);
  } else {
    E("rect", { x: -120, y: 62, width: 240, height: 12, rx: 6, fill: GR }, c);
    const f = fig(c, CO); tf(f, "translate(-5 12) rotate(112) scale(0.9)");
    E("path", { d: "M-100 -40 Q-60 -70 -20 -50", fill: "none", stroke: AM, "stroke-width": 9, "stroke-linecap": "round" }, c);
    E("circle", { cx: 70, cy: -50, r: 9, fill: AM, stroke: STK, "stroke-width": 4 }, c);
    E("circle", { cx: 98, cy: -20, r: 7, fill: AM, stroke: STK, "stroke-width": 4 }, c);
  }
  return c;
}
// ======================= ESCENA 4 · chistes, eructos y caídas, con risas y sin ellas
S[4] = {
  bloques: [
    { x: 60, y: 322, w: 960, h: 80, size: 58, al: "center", txt: "Con risas", en: () => W(4, "risas") - 0.3 },
    { x: 60, y: 682, w: 960, h: 80, size: 58, al: "center", txt: "Sin risas", en: () => W(4, "sin") - 0.15 },
    { x: 60, y: 860, w: 960, h: 210, size: 84, al: "center", txt: "Chistes, eructos y *caídas*", en: () => W(4, "chistes") - 0.2 },
  ],
  build(g) {
    const r = this.r = { tile: [], ond: [], jas: [], sil: [] };
    [0, 1].forEach(row => [0, 1, 2].forEach(k => {
      const cx = 205 + k * 335, cy = 200 + row * 360;
      const t = { cx, cy, g: E("g", {}, g) };
      t.slot = E("rect", { x: cx - 145, y: cy - 105, width: 290, height: 210, rx: 36, fill: "none", stroke: GR, "stroke-width": 7, "stroke-dasharray": "16 12" }, g);
      E("rect", { x: -145, y: -105, width: 290, height: 210, rx: 36, fill: PANEL, stroke: STK, "stroke-width": 7 }, t.g);
      t.ic = ico(t.g, k);
      r.tile.push(t);
      if (!row) {
        t.ond = [ondas(g, AM, 3), ondas(g, AM, 3)];
        t.ja = E("g", {}, g); ja(t.ja, 74, CO);
      } else {
        t.sil = E("path", { d: `M${cx - 60} ${cy + 140} L${cx + 60} ${cy + 140}`, stroke: GR, "stroke-width": 10, "stroke-linecap": "round" }, g);
      }
    }));
  },
  paint(t, dur) {
    const pal = ["chistes", "eructos", "caidas"], tR = W(4, "risas"), tS = W(4, "sin");
    this.r.tile.forEach((e, i) => {
      const row = i < 3 ? 0 : 1, k = i % 3;
      const a = W(4, pal[k]) - 0.2 + row * 0.12, q = tramo(t, a, a + 0.55), p = rebote(q);
      const ps0 = rebote(tramo(t, 0.1 + i * 0.07, 0.6 + i * 0.07));
      tf(e.slot, `translate(0 ${3 * Math.sin(t * 2.5 + i)})`); op(e.slot, ps0 * (1 - q));
      const y = e.cy + (1 - sal(q)) * -480 + 5 * Math.sin(t * 2.2 + i);
      tf(e.g, `translate(${e.cx} ${y}) rotate(${(1 - q) * -10 + 1.5 * Math.sin(t * 1.7 + i)}) scale(${Math.max(p, 0.001)})`); op(e.g, q * 4);
      tf(e.ic, `translate(0 ${3 * Math.sin(t * 4 + i)})`);
      if (!row) {
        const v = tramo(t, tR + k * 0.14, tR + k * 0.14 + 0.3);
        pintaOndas(e.ond[0], e.cx - 105, e.cy, t, 40, 24, v, -1);
        pintaOndas(e.ond[1], e.cx + 105, e.cy, t, 40, 24, v, 1);
        const jp = rebote(tramo(t, tR + k * 0.14, tR + k * 0.14 + 0.4));
        tf(e.ja, `translate(${e.cx + 100} ${e.cy - 120 + 6 * Math.sin(t * 7 + k)}) rotate(${-12 + 10 * Math.sin(t * 5 + k)}) scale(${Math.max(jp, 0.001)})`);
      } else {
        const v = tramo(t, tS + k * 0.1, tS + k * 0.1 + 0.3);
        e.sil.style.opacity = v;
      }
    });
  },
};

// ======================= ESCENA 5 · más gracioso con risa, y más con risa de verdad
S[5] = {
  bloques: [
    { x: 60, y: 880, w: 960, h: 140, size: 108, al: "center", txt: "Más *gracioso*", en: () => W(5, "gracioso") - 0.4 },
    { x: 60, y: 1050, w: 960, h: 90, size: 62, peso: 700, al: "center", txt: "y más con risa de verdad", en: () => W(5, "verdad") - 1.3 },
  ],
  build(g) {
    const r = this.r = { c: [] };
    [200, 540, 880].forEach((cx, i) => {
      const c = { cx };
      c.tile = E("g", {}, g);
      E("rect", { x: -130, y: -90, width: 260, height: 180, rx: 34, fill: PANEL, stroke: STK, "stroke-width": 7 }, c.tile);
      E("rect", { x: -130, y: -90, width: 260, height: 180, rx: 34, fill: "none" }, c.tile);
      const b = boca(c.tile, 190, 96, "#FFFFFF"); tf(b, "translate(0 -10)");
      const l = lineas(c.tile, 190, 96, i ? VI : GR, 3); tf(l, "translate(0 -10)");
      // el tubo del medidor
      c.tubo = E("g", {}, g);
      E("rect", { x: cx - 45, y: 470, width: 90, height: 340, rx: 45, fill: PANEL, stroke: STK, "stroke-width": 7 }, c.tubo);
      c.nivel = E("rect", { x: cx - 33, y: 480, width: 66, height: 0, rx: 33, fill: [GR, CI, ME][i] }, c.tubo);
      for (let k = 1; k < 5; k++) E("line", { x1: cx + 52, y1: 470 + k * 68, x2: cx + 78, y2: 470 + k * 68, stroke: STK, "stroke-width": 6, "stroke-linecap": "round" }, c.tubo);
      c.bola = E("circle", { cx, cy: 810, r: 0, fill: [GR, CI, ME][i], stroke: STK, "stroke-width": 7 }, c.tubo);
      if (i === 1) {                                   // la risa fingida: pequeña, rígida, encajonada
        c.ja = E("g", {}, g);
        E("rect", { x: -62, y: -40, width: 124, height: 80, rx: 8, fill: "#FFFFFF", stroke: STK, "stroke-width": 7, "stroke-dasharray": "10 8" }, c.ja);
        const j = E("g", {}, c.ja); ja(j, 52, VI);
      } else if (i === 2) {                            // la de verdad: grande y que rebota
        c.ja = E("g", {}, g);
        E("circle", { cx: 0, cy: 0, r: 76, fill: "#FFFFFF", stroke: STK, "stroke-width": 7 }, c.ja);
        c.jaT = E("g", {}, c.ja); ja(c.jaT, 100, CO);
        c.ond = ondas(g, AM, 3); c.ond2 = ondas(g, AM, 3);
      }
      r.c.push(c);
    });
  },
  paint(t, dur) {
    const r = this.r, tC = W(5, "risas"), tV = W(5, "verdad"), tF = W(5, "fingida");
    const niv = [0.16 + 0.015 * Math.sin(t * 2),
      0.16 + 0.36 * suave(tramo(t, tC, tC + 0.8)),
      0.16 + 0.36 * suave(tramo(t, tC, tC + 0.8)) + 0.40 * suave(tramo(t, tV - 0.1, tV + 0.7))];
    r.c.forEach((c, i) => {
      const a = 0.1 + i * 0.12, q = rebote(tramo(t, a, a + 0.5));
      pop(c.tile, c.cx, 215 + 4 * Math.sin(t * 2 + i), q);
      op(c.tubo, tramo(t, a, a + 0.2));
      const h = 320 * cl(niv[i] + (i ? 0.012 * Math.sin(t * 9 + i) : 0));
      c.nivel.setAttribute("y", 800 - h); c.nivel.setAttribute("height", h);
      c.bola.setAttribute("r", 33);
      if (i === 1) {
        const p = rebote(tramo(t, tC, tC + 0.4));
        const sac = Math.max(0, 1 - Math.abs(t - tF) * 3) * 10 * Math.sin(t * 40);     // se sacude, rígida, en «fingida»
        tf(c.ja, `translate(${c.cx + sac} 395) scale(${Math.max(p, 0.001)})`); op(c.ja, p * 3);
      } else if (i === 2) {
        const p = rebote(tramo(t, tC + 0.1, tC + 0.5)), g = 1 + 0.45 * rebote(tramo(t, tV - 0.1, tV + 0.5));
        const sc = Math.max(p, 0.001) * (0.55 * g);
        tf(c.ja, `translate(${c.cx} ${390 - Math.abs(Math.sin(t * 6)) * 18 * tramo(t, tV - 0.1, tV + 0.2)}) rotate(${6 * Math.sin(t * 5)}) scale(${sc})`); op(c.ja, p * 3);
        const v = tramo(t, tV - 0.05, tV + 0.25);
        pintaOndas(c.ond, c.cx - 105, 395, t, 52, 24, v, -1); pintaOndas(c.ond2, c.cx + 105, 395, t, 52, 24, v, 1);
      }
    });
  },
};

</script></body></html>
