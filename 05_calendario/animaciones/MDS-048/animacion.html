<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>MDS-048 · animación a medida (C55.2)</title>
<!--
  MDS-048 · escenas [4, 5] · brazo A del ciclo B1 (C55.2) · fondo ámbar suave #FFE3A3.
  Página autónoma: sin red, sin Math.random ni Date. Todo sale de (n, t); los movimientos se anclan
  a las palabras de la voz con W(), nunca a segundos escritos a mano. Sin caras: formas, objetos, esquemas.
-->
<style>
html,body{margin:0;padding:0;background:#05080f}
body{margin:0}
#lienzo{position:relative;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#FFE3A3;
  font-family:system-ui,"DejaVu Sans",Arial,sans-serif;color:#16213A}
#dib{position:absolute;left:0;top:0;width:1080px;height:1920px}
.bq{position:absolute;font-weight:900;line-height:1.12;letter-spacing:-.01em}
.bq .p{display:inline-block;opacity:0;transform-origin:50% 80%}
</style></head>
<body><div id="lienzo"></div>
<script>
const ESCENAS_LISTA = [4, 5];
const BG = "#FFE3A3", PUNTO = "#F8CF74", TX = "#16213A", HL = "#EF476F", SUB = "#5B4A2A", GR = "#9C8A5E", PANEL = "#FFF4E0";
const PAL = ["#EF476F","#4CC9F0","#06D6A0","#9B5DE5","#16213A"];
// ---------------------------------------------------------------- núcleo común
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const tramo = (t, a, b) => cl((t - a) / (b - a));
const suave = x => x * x * (3 - 2 * x);
const sal = x => 1 - Math.pow(1 - x, 3);
const rebote = x => { x = cl(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const AM = "#FFB020", CI = "#4CC9F0", CO = "#EF476F", ME = "#06D6A0", VI = "#9B5DE5";
function E(tag, at, par) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (par) par.appendChild(e); return e; }
function hex(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }
function mezcla(a, b, p) { const A = hex(a), B = hex(b); return "#" + A.map((v, i) => Math.round(lerp(v, B[i], cl(p))).toString(16).padStart(2, "0")).join(""); }
const op = (el, v) => { el.style.opacity = cl(v); };
const tf = (el, s) => el.setAttribute("transform", s);

// tiempos de la voz (los pone el render antes de pintar)
let T = {};
window.cargarTiempos = d => { T = d || {}; };
const norm = s => s.normalize("NFD").replace(/[^\p{L}\p{N}]/gu, "").toLowerCase();
function W(n, pal, vez = 1) {           // instante en que la voz dice `pal` en la escena n
  let k = 0;
  for (const [t, w] of (T[n] || {}).palabras || []) if (norm(w) === norm(pal) && ++k === vez) return t;
  return 0.6;
}
const DUR = n => ((T[n] || {}).dur) || 8;
const S = {};

// ---------------------------------------------------------------- construcción
let FONDO, PART = [], BLQ = {};
function construir() {
  const lienzo = $("lienzo");
  const svg = E("svg", { id: "dib", viewBox: "0 0 1080 1920", width: 1080, height: 1920 }, lienzo);
  const defs = E("defs", {}, svg);
  const pat = E("pattern", { id: "reti", width: 72, height: 72, patternUnits: "userSpaceOnUse" }, defs);
  E("circle", { cx: 18, cy: 18, r: 5, fill: PUNTO }, pat);
  E("circle", { cx: 54, cy: 54, r: 5, fill: PUNTO }, pat);
  FONDO = pat;
  E("rect", { x: 0, y: 0, width: 1080, height: 1920, fill: "url(#reti)" }, svg);
  for (let i = 0; i < 22; i++) {
    const col = PAL[i % PAL.length];
    const c = i % 2 ? E("circle", { r: 7 + (i % 4) * 3, fill: col, opacity: 0.55 }, svg)
                    : E("rect", { x: -9, y: -9, width: 18 + (i % 3) * 4, height: 18 + (i % 3) * 4, rx: 5, fill: col, opacity: 0.55 }, svg);
    c._x = (i * 197) % 1080; c._y = (i * 331) % 1920; c._v = 16 + (i * 7) % 26; c._f = i * 1.3; c._r = i % 2;
    PART.push(c);
  }
  const cam = E("g", { id: "cam" }, svg);
  E("rect", { id: "prog", x: 0, y: 0, width: 0, height: 12, fill: HL }, svg);
  for (const n of ESCENAS_LISTA) {
    const g = E("g", { id: "s" + n }, cam);
    S[n].build(g, defs);
    const cont = document.createElement("div"); cont.id = "tx" + n; lienzo.appendChild(cont);
    BLQ[n] = (S[n].bloques || []).map(b => {
      const d = document.createElement("div"); d.className = "bq";
      d.style.cssText = `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;font-size:${b.size}px;color:${b.col || TX};text-align:${b.al || "left"}`;
      let am = false; const sp = [];
      b.txt.split(" ").forEach((tok, i) => {
        let t = tok;
        if (t.startsWith("*")) { am = true; t = t.slice(1); }
        const cierra = t.endsWith("*"); if (cierra) t = t.slice(0, -1);
        const s = document.createElement("span"); s.className = "p"; s.textContent = t;
        if (am) s.style.color = HL, s._am = true;
        if (i) d.appendChild(document.createTextNode(" "));
        d.appendChild(s); sp.push(s);
        if (cierra) am = false;
      });
      cont.appendChild(d);
      return { b, d, sp };
    });
  }
}

// ---------------------------------------------------------------- pintar
window.ESCENAS = ESCENAS_LISTA;
window.pintarEscena = function (n, t) {
  if (!FONDO) construir();
  const dur = DUR(n);
  for (const m of ESCENAS_LISTA) { $("s" + m).style.display = m === n ? "" : "none"; $("tx" + m).style.display = m === n ? "" : "none"; }
  FONDO.setAttribute("patternTransform", `translate(${(t * 16) % 72} ${(t * -11) % 72})`);
  PART.forEach(c => {
    const y = ((c._y - t * c._v) % 1980 + 1980) % 1980 - 30;
    const x = c._x + 22 * Math.sin(t * 0.8 + c._f);
    if (c._r) { c.setAttribute("cx", x); c.setAttribute("cy", y); }
    else c.setAttribute("transform", `translate(${x} ${y}) rotate(${t * 40 + c._f * 50})`);
  });
  const z = 1 + 0.04 * (t / dur);
  tf($("cam"), `translate(${540 + 7 * Math.sin(t * 0.5)} ${960 - 10 * t / dur * 4}) scale(${z}) translate(-540 -960)`);
  $("prog").setAttribute("width", 1080 * cl(t / dur));
  S[n].paint(t, dur);
  for (const { b, sp } of BLQ[n]) {
    const t0 = Math.min(b.en(), dur - 0.6);
    sp.forEach((s, i) => {
      const a = t0 + i * 0.09, p = sal(tramo(t, a, a + 0.28));
      const k = s._am ? lerp(1.35, 1, rebote(tramo(t, a, a + 0.45))) : lerp(0.9, 1, p);
      s.style.opacity = p;
      s.style.transform = `translateY(${(1 - p) * 40}px) scale(${k})`;
    });
  }
};
window.comprobarEscena = function (n, t) {
  window.pintarEscena(n, t);
  const m = [];
  for (const { b, sp } of BLQ[n]) {             // se mide sin transformaciones (offset*), no con la animación de entrada
    const ancho = Math.max(...sp.map(s => s.offsetLeft + s.offsetWidth));
    const alto = Math.max(...sp.map(s => s.offsetTop + s.offsetHeight));
    if (ancho > b.w + 1) m.push(`${b.txt}: no cabe a lo ancho`);
    if (alto > b.h + 1) m.push(`${b.txt}: no cabe en su caja (${alto} > ${b.h})`);
    if (b.y + Math.max(alto, b.h) > 1650) m.push(`${b.txt}: pasa de la zona segura`);
    if (b.x < 30 || b.x + b.w > 1050) m.push(`${b.txt}: fuera del ancho`);
  }
  return m;
};
window.addEventListener("DOMContentLoaded", () => { if (!FONDO) construir(); });

// ======================= ESCENA 4 · leído / oído: las mismas palabras
const LIN = [0.92, 0.64, 0.84, 0.5, 0.96, 0.7, 0.42];
S[4] = {
  bloques: [
    { x: 70, y: 920, w: 440, h: 100, size: 84, txt: "Leído", en: () => W(4, "leer") - 0.2 },
    { x: 70, y: 1030, w: 440, h: 100, size: 40, col: SUB, txt: "las mismas palabras", en: () => W(4, "mismas") - 0.1 },
    { x: 570, y: 920, w: 440, h: 100, size: 84, txt: "Oído", en: () => W(4, "escuchar") - 0.2 },
    { x: 570, y: 1030, w: 440, h: 100, size: 40, col: SUB, txt: "con su *voz*", en: () => W(4, "mismas") + 0.5 },
  ],
  build(g) {
    const r = this.r = { l: [], b: [] };
    r.bq = E("g", {}, g);
    E("path", { d: "M70 480 H500 a30 30 0 0 1 30 30 V740 a30 30 0 0 1 -30 30 H190 L120 840 L130 770 H100 a30 30 0 0 1 -30 -30 V510 a30 30 0 0 1 30 -30 Z", fill: PANEL, stroke: TX, "stroke-width": 7, "stroke-linejoin": "round" }, r.bq);
    LIN.forEach((w, i) => {
      const l = E("line", { x1: 110, y1: 540 + i * 30, x2: 110 + 380 * w, y2: 540 + i * 30, stroke: GR, "stroke-width": 14, "stroke-linecap": "round" }, r.bq);
      l._w = w; r.l.push(l);
    });
    r.cur = E("rect", { x: 0, y: 0, width: 12, height: 30, rx: 4, fill: HL }, r.bq);
    r.ig = E("g", {}, g);
    E("rect", { x: 560, y: 480, width: 450, height: 290, rx: 30, fill: PANEL, stroke: TX, "stroke-width": 7 }, r.ig);
    for (let i = 0; i < 15; i++) r.b.push(E("rect", { x: 592 + i * 27, width: 17, rx: 8, fill: GR }, r.ig));
    r.ig2 = E("g", {}, g);
    E("rect", { x: 520, y: 590, width: 40, height: 12, rx: 6, fill: TX }, r.ig2);
    E("rect", { x: 520, y: 640, width: 40, height: 12, rx: 6, fill: TX }, r.ig2);
  },
  paint(t, dur) {
    const r = this.r;
    const tl = W(4, "leer"), te = W(4, "escuchar"), tmi = W(4, "mismas");
    const pb = rebote(tramo(t, 0.05, 0.6));
    r.bq.setAttribute("transform", `translate(0 ${(1 - pb) * 60 + 5 * Math.sin(t * 1.5)})`);
    op(r.bq, pb);
    r.l.forEach((l, i) => {
      const a = tl - 0.25 + i * 0.12, p = suave(tramo(t, a, a + 0.5));
      l.setAttribute("x2", 110 + 380 * l._w * p);
    });
    const ic = Math.min(6, Math.max(0, Math.floor((t - (tl - 0.25)) / 0.12)));
    r.cur.setAttribute("x", 110 + 380 * LIN[ic] * suave(tramo(t, tl - 0.25 + ic * 0.12, tl + 0.25 + ic * 0.12)) + 8);
    r.cur.setAttribute("y", 525 + ic * 30);
    op(r.cur, tramo(t, tl - 0.2, tl) * (1 - tramo(t, tl + 0.9, tl + 1.1)) * (Math.sin(t * 12) > -0.3 ? 1 : 0.3));
    const pg = rebote(tramo(t, 0.15, 0.7));
    r.ig.setAttribute("transform", `translate(0 ${(1 - pg) * 60 + 5 * Math.sin(t * 1.5 + 1)})`); op(r.ig, pg);
    const v = suave(tramo(t, te - 0.1, te + 0.5));
    r.b.forEach((b, i) => {
      const a = (0.5 + 0.5 * Math.sin(t * 9 + i * 0.8)) * 0.6 + 0.4 * (0.5 + 0.5 * Math.sin(t * 5.3 - i * 1.7));
      const h = lerp(26, 40 + 170 * LIN[i % 7] * a, v);
      b.setAttribute("height", h); b.setAttribute("y", 625 - h / 2);
      b.setAttribute("fill", mezcla(GR, i % 2 ? VI : CO, v));
    });
    const pi = rebote(tramo(t, tmi - 0.1, tmi + 0.5));
    r.ig2.setAttribute("transform", `translate(0 ${5 * Math.sin(t * 6)}) translate(540 620) scale(${pi}) translate(-540 -620)`);
    op(r.ig2, pi);
  },
};

// ======================= ESCENA 5 · dos oyentes: uno se ilumina, el otro lee
function arcoV(cx, cy, r, a0, a1) {
  const p = a => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0} ${y0} A${r} ${r} 0 0 0 ${x1} ${y1}`;
}
const cuerpo = cx => `M${cx - 120} 900 Q${cx - 120} 700 ${cx} 700 Q${cx + 120} 700 ${cx + 120} 900 Z`;
S[5] = {
  bloques: [
    { x: 70, y: 980, w: 940, h: 80, size: 64, al: "center", txt: "si lo *oyes*", en: () => W(5, "oír") },
    { x: 70, y: 1075, w: 940, h: 120, size: 100, al: "center", txt: "Más sensato", en: () => W(5, "sensato") - 0.3 },
  ],
  build(g) {
    const r = this.r = { arc: [], ray: [], line: [] };
    r.f1 = E("g", {}, g);
    E("path", { d: cuerpo(290), fill: CI, stroke: TX, "stroke-width": 7, "stroke-linejoin": "round" }, r.f1);
    r.halo = E("circle", { cx: 290, cy: 570, fill: "none", stroke: VI, "stroke-width": 10 }, r.f1);
    r.h1 = E("circle", { cx: 290, cy: 570, r: 78, fill: GR, stroke: TX, "stroke-width": 7 }, r.f1);
    for (let k = 0; k < 8; k++) r.ray.push(E("line", { stroke: VI, "stroke-width": 11, "stroke-linecap": "round" }, r.f1));
    for (let k = 0; k < 3; k++) r.arc.push(E("path", { fill: "none", stroke: VI, "stroke-width": 12, "stroke-linecap": "round" }, g));
    r.f2 = E("g", {}, g);
    r.c2 = E("path", { d: cuerpo(790), fill: "none", stroke: GR, "stroke-width": 8, "stroke-dasharray": "18 14", "stroke-linejoin": "round" }, r.f2);
    r.h2 = E("circle", { cx: 790, cy: 570, r: 78, fill: "none", stroke: GR, "stroke-width": 8, "stroke-dasharray": "18 14" }, r.f2);
    r.pag = E("g", {}, g);
    E("rect", { x: 725, y: 745, width: 130, height: 150, rx: 16, fill: PANEL, stroke: TX, "stroke-width": 7 }, r.pag);
    for (let k = 0; k < 4; k++) r.line.push(E("line", { x1: 748, y1: 780 + k * 28, x2: 748 + (k % 2 ? 60 : 84), y2: 780 + k * 28, stroke: GR, "stroke-width": 10, "stroke-linecap": "round" }, r.pag));
  },
  paint(t, dur) {
    const r = this.r;
    const to = W(5, "oír"), ts = W(5, "sensato"), tle = W(5, "leyendo");
    const pf = rebote(tramo(t, 0.05, 0.7));
    r.f1.setAttribute("transform", `translate(0 ${(1 - pf) * 70 + 5 * Math.sin(t * 2)})`); op(r.f1, pf);
    r.arc.forEach((a, k) => {
      const ph = ((t * 0.9 - k / 3) % 1 + 1) % 1, p = tramo(t, to - 0.1, to + 0.4);
      a.setAttribute("d", arcoV(290, 570, 120 + k * 34, 150, 210));
      a.setAttribute("transform", `translate(${-ph * 30} 0)`);
      a.style.opacity = p * Math.sin(Math.PI * ph);
    });
    const lit = suave(tramo(t, ts - 0.1, ts + 0.5));
    r.h1.setAttribute("fill", mezcla(GR, VI, lit));
    r.h1.setAttribute("r", 78 * (1 + 0.12 * rebote(tramo(t, ts - 0.1, ts + 0.5)) - 0.12));
    const hp = ((t - ts) * 0.9 % 1 + 1) % 1;
    r.halo.setAttribute("r", 80 + 70 * hp); r.halo.style.opacity = lit * (1 - hp);
    r.ray.forEach((l, k) => {
      const a = (k * 45 + t * 25) * Math.PI / 180, r0 = 105 + 8 * Math.sin(t * 5 + k), r1 = r0 + 40 * lit;
      l.setAttribute("x1", 290 + r0 * Math.cos(a)); l.setAttribute("y1", 570 + r0 * Math.sin(a));
      l.setAttribute("x2", 290 + r1 * Math.cos(a)); l.setAttribute("y2", 570 + r1 * Math.sin(a));
      l.style.opacity = lit;
    });
    const p2 = rebote(tramo(t, 0.2, 0.8));
    r.f2.setAttribute("transform", `translate(0 ${(1 - p2) * 70 + 5 * Math.sin(t * 2 + 2)})`); op(r.f2, p2);
    r.c2.style.strokeDashoffset = -t * 30; r.h2.style.strokeDashoffset = -t * 30;
    const pl = rebote(tramo(t, tle - 0.1, tle + 0.5));
    r.pag.setAttribute("transform", `translate(790 820) scale(${pl}) translate(-790 -820) translate(0 ${5 * Math.sin(t * 2 + 2)})`);
    op(r.pag, pl);
    r.line.forEach((l, k) => l.setAttribute("x2", 748 + (k % 2 ? 60 : 84) * suave(tramo(t, tle + k * 0.12, tle + 0.5 + k * 0.12))));
  },
};

</script></body></html>
