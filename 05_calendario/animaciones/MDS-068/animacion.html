<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>MDS-068 · animación a medida (C55.2)</title>
<!--
  MDS-068 · escenas [4,5] · brazo A del ciclo B2 (C55.2) · fondo ámbar suave #FFE3A3.
  Página autónoma: sin red, sin Math.random ni Date. Todo sale de (n, t); los movimientos se anclan
  a las palabras de la voz con W(), nunca a segundos escritos a mano. Sin caras: formas, objetos, esquemas.
-->
<style>
html,body{margin:0;padding:0;background:#05080f}
body{margin:0}
#lienzo{position:relative;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#FFE3A3;
  font-family:system-ui,"DejaVu Sans",Arial,sans-serif;color:#16213A}
#dib{position:absolute;left:0;top:0;width:1080px;height:1920px}
.bq{position:absolute;font-weight:900;line-height:1.12;letter-spacing:-.01em}
.bq .p{display:inline-block;opacity:0;transform-origin:50% 80%}
</style></head>
<body><div id="lienzo"></div>
<script>
const ESCENAS_LISTA = [4,5];
const BG="#FFE3A3", PUNTO="#FFD27A", TX="#16213A", HL="#EF476F", GR="#B39A62", PANEL="#FFF9EA", STK="#16213A", SUB="#6B4A12";
const PAL = ["#EF476F","#4CC9F0","#06D6A0","#9B5DE5","#FFB020"];
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const tramo = (t, a, b) => cl((t - a) / (b - a));
const suave = x => x * x * (3 - 2 * x);
const sal = x => 1 - Math.pow(1 - x, 3);
const rebote = x => { x = cl(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const AM = "#FFB020", CI = "#4CC9F0", CO = "#EF476F", ME = "#06D6A0", VI = "#9B5DE5";
function E(tag, at, par) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (par) par.appendChild(e); return e; }
const op = (el, v) => { el.style.opacity = cl(v); };
const tf = (el, s) => el.setAttribute("transform", s);
const pop = (el, x, y, p, rot = 0) => { tf(el, `translate(${x} ${y}) rotate(${rot}) scale(${Math.max(p, 0.001)})`); op(el, p * 3); };

let T = {};
window.cargarTiempos = d => { T = d || {}; };
const norm = s => s.normalize("NFD").replace(/[^\p{L}\p{N}]/gu, "").toLowerCase();
function W(n, pal, vez = 1) {           // instante en que la voz dice `pal` en la escena n
  let k = 0;
  for (const [t, w] of (T[n] || {}).palabras || []) if (norm(w) === norm(pal) && ++k === vez) return t;
  return 0.6;
}
const DUR = n => ((T[n] || {}).dur) || 8;
const S = {};
let FONDO, PART = [], BLQ = {};

function construir() {
  const lienzo = $("lienzo");
  const svg = E("svg", { id: "dib", viewBox: "0 0 1080 1920", width: 1080, height: 1920 }, lienzo);
  const defs = E("defs", {}, svg);
  const pat = E("pattern", { id: "reti", width: 72, height: 72, patternUnits: "userSpaceOnUse" }, defs);
  E("circle", { cx: 18, cy: 18, r: 5, fill: PUNTO }, pat);
  E("circle", { cx: 54, cy: 54, r: 5, fill: PUNTO }, pat);
  FONDO = pat;
  E("rect", { x: 0, y: 0, width: 1080, height: 1920, fill: "url(#reti)" }, svg);
  for (let i = 0; i < 22; i++) {
    const col = PAL[i % PAL.length];
    const c = i % 2 ? E("circle", { r: 7 + (i % 4) * 3, fill: col, opacity: 0.55 }, svg)
                    : E("rect", { x: -9, y: -9, width: 18 + (i % 3) * 4, height: 18 + (i % 3) * 4, rx: 5, fill: col, opacity: 0.55 }, svg);
    c._x = (i * 197) % 1080; c._y = (i * 331) % 1920; c._v = 16 + (i * 7) % 26; c._f = i * 1.3; c._r = i % 2;
    PART.push(c);
  }
  const cam = E("g", { id: "cam" }, svg);
  E("rect", { id: "prog", x: 0, y: 0, width: 0, height: 12, fill: HL }, svg);
  for (const n of ESCENAS_LISTA) {
    const g = E("g", { id: "s" + n }, cam);
    S[n].build(g, defs);
    const cont = document.createElement("div"); cont.id = "tx" + n; lienzo.appendChild(cont);
    BLQ[n] = (S[n].bloques || []).map(b => {
      const d = document.createElement("div"); d.className = "bq";
      d.style.cssText = `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;font-size:${b.size}px;color:${b.col || TX};text-align:${b.al || "left"};font-weight:${b.peso || 900}`;
      let am = false; const sp = [];
      b.txt.split(" ").forEach((tok, i) => {
        let t = tok;
        if (t.startsWith("*")) { am = true; t = t.slice(1); }
        const cierra = t.endsWith("*"); if (cierra) t = t.slice(0, -1);
        const s = document.createElement("span"); s.className = "p"; s.textContent = t;
        if (am) s.style.color = HL, s._am = true;
        if (i) d.appendChild(document.createTextNode(" "));
        d.appendChild(s); sp.push(s);
        if (cierra) am = false;
      });
      cont.appendChild(d);
      return { b, d, sp };
    });
  }
}

window.ESCENAS = ESCENAS_LISTA;
window.pintarEscena = function (n, t) {
  if (!FONDO) construir();
  const dur = DUR(n);
  for (const m of ESCENAS_LISTA) { $("s" + m).style.display = m === n ? "" : "none"; $("tx" + m).style.display = m === n ? "" : "none"; }
  FONDO.setAttribute("patternTransform", `translate(${(t * 16) % 72} ${(t * -11) % 72})`);
  PART.forEach(c => {
    const y = ((c._y - t * c._v) % 1980 + 1980) % 1980 - 30;
    const x = c._x + 22 * Math.sin(t * 0.8 + c._f);
    if (c._r) { c.setAttribute("cx", x); c.setAttribute("cy", y); }
    else c.setAttribute("transform", `translate(${x} ${y}) rotate(${t * 40 + c._f * 50})`);
  });
  const z = 1 + 0.04 * (t / dur);
  tf($("cam"), `translate(${540 + 7 * Math.sin(t * 0.5)} ${960 - 10 * t / dur * 4}) scale(${z}) translate(-540 -960)`);
  $("prog").setAttribute("width", 1080 * cl(t / dur));
  S[n].paint(t, dur);
  for (const { b, sp } of BLQ[n]) {
    const t0 = Math.min(b.en(), dur - 0.6);
    sp.forEach((s, i) => {
      const a = t0 + i * 0.09, p = sal(tramo(t, a, a + 0.28));
      const k = s._am ? lerp(1.35, 1, rebote(tramo(t, a, a + 0.45))) : lerp(0.9, 1, p);
      s.style.opacity = p;
      s.style.transform = `translateY(${(1 - p) * 40}px) scale(${k})`;
    });
  }
};
window.comprobarEscena = function (n, t) {
  window.pintarEscena(n, t);
  const m = [];
  for (const { b, sp } of BLQ[n]) {
    const ancho = Math.max(...sp.map(s => s.offsetLeft + s.offsetWidth));
    const alto = Math.max(...sp.map(s => s.offsetTop + s.offsetHeight));
    if (ancho > b.w + 1) m.push(`${b.txt}: no cabe a lo ancho`);
    if (alto > b.h + 1) m.push(`${b.txt}: no cabe en su caja (${alto} > ${b.h})`);
    if (b.y + Math.max(alto, b.h) > 1650) m.push(`${b.txt}: pasa de la zona segura`);
    if (b.x < 30 || b.x + b.w > 1050) m.push(`${b.txt}: fuera del ancho`);
  }
  return m;
};
window.addEventListener("DOMContentLoaded", () => { if (!FONDO) construir(); });

// figura sin cara: cuerpo redondeado y cabeza lisa
function fig(g, col) {
  const f = E("g", {}, g);
  E("path", { d: "M-44 90 Q-44 0 0 0 Q44 0 44 90 Z", fill: col, stroke: STK, "stroke-width": 7, "stroke-linejoin": "round" }, f);
  E("circle", { cx: 0, cy: -38, r: 34, fill: col, stroke: STK, "stroke-width": 7 }, f);
  return f;
}
// bocadillo con cola abajo-izquierda; devuelve grupo centrado en (0,0)
function boca(g, w, h, fill, dash) {
  const b = E("g", {}, g);
  E("path", { d: `M${-w / 2 + 40} ${h / 2 - 4} L${-w / 2 + 20} ${h / 2 + 42} L${-w / 2 + 84} ${h / 2 - 4} Z`, fill: fill || PANEL, stroke: STK, "stroke-width": 7, "stroke-linejoin": "round", ...(dash ? { "stroke-dasharray": "14 12" } : {}) }, b);
  E("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: 36, fill: fill || PANEL, stroke: STK, "stroke-width": 7, ...(dash ? { "stroke-dasharray": "14 12" } : {}) }, b);
  E("rect", { x: -w / 2 + 34, y: h / 2 - 10, width: 44, height: 12, fill: fill || PANEL }, b);
  return b;
}
function lineas(g, w, h, col, n = 3) {
  const l = E("g", {}, g);
  for (let i = 0; i < n; i++) {
    const ww = (w - 60) * (i === n - 1 ? 0.55 : 1 - i * 0.08);
    E("rect", { x: -w / 2 + 30, y: -h / 2 + 28 + i * ((h - 56) / n), width: ww, height: 14, rx: 7, fill: col }, l);
  }
  return l;
}
function ja(g, size, col) {
  const t = E("text", { x: 0, y: size * 0.34, "text-anchor": "middle", "font-size": size, "font-weight": 900, fill: col, "font-family": "system-ui,'DejaVu Sans',Arial,sans-serif" }, g);
  t.textContent = "ja"; return t;
}
function ondas(g, col, n = 3) {
  const a = [];
  for (let i = 0; i < n; i++) a.push(E("path", { fill: "none", stroke: col, "stroke-width": 9, "stroke-linecap": "round" }, g));
  return a;
}
function pintaOndas(a, cx, cy, t, r0, sep, vis, lado) {
  a.forEach((p, i) => {
    const r = r0 + i * sep + 5 * Math.sin(t * 6 - i * 1.2);
    const x0 = cx + lado * r * Math.cos(0.7), y0 = cy - r * Math.sin(0.7), x1 = cx + lado * r * Math.cos(0.7), y1 = cy + r * Math.sin(0.7);
    p.setAttribute("d", `M${x0} ${y0} A${r} ${r} 0 0 ${lado > 0 ? 1 : 0} ${x1} ${y1}`);
    p.style.opacity = cl(vis * (0.55 + 0.45 * Math.sin(t * 5 - i * 1.4)));
  });
}

// ---- piezas de esta página: rata de perfil (sin cara humana) y mano
function rata(g, fill) {
  const r = E("g", {}, g);
  r.cola = E("path", { d: "M-125 22 Q-215 44 -235 -28 Q-245 -84 -190 -92", fill: "none", stroke: STK, "stroke-width": 10, "stroke-linecap": "round" }, r);
  [-72, 66].forEach(x => E("rect", { x: x - 19, y: 40, width: 38, height: 58, rx: 19, fill, stroke: STK, "stroke-width": 7 }, r));
  r.cuerpo = E("g", {}, r);
  E("ellipse", { cx: 0, cy: 0, rx: 135, ry: 82, fill, stroke: STK, "stroke-width": 7 }, r.cuerpo);
  E("ellipse", { cx: 105, cy: -22, rx: 62, ry: 50, fill, stroke: STK, "stroke-width": 7 }, r.cuerpo);
  E("path", { d: "M140 -52 L214 -12 L140 16 Z", fill, stroke: STK, "stroke-width": 7, "stroke-linejoin": "round" }, r.cuerpo);
  E("circle", { cx: 88, cy: -70, r: 27, fill: "#FFC2D1", stroke: STK, "stroke-width": 6 }, r.cuerpo);
  E("circle", { cx: 214, cy: -12, r: 11, fill: CO, stroke: STK, "stroke-width": 4 }, r.cuerpo);
  E("circle", { cx: 132, cy: -34, r: 7, fill: STK }, r.cuerpo);
  E("path", { d: "M200 -8 L255 -26 M200 -4 L258 -2", stroke: STK, "stroke-width": 4, "stroke-linecap": "round" }, r.cuerpo);
  r.boca = E("ellipse", { cx: 170, cy: 14, rx: 9, ry: 1, fill: STK }, r.cuerpo);
  r.ond = ondas(r, AM, 3);
  return r;
}
function mano(g) {
  const m = E("g", {}, g), piel = "#FFCFA8";
  E("rect", { x: -48, y: 0, width: 96, height: 120, rx: 30, fill: piel, stroke: STK, "stroke-width": 7 }, m);
  m.dedos = [-33, -11, 11, 33].map((x, i) => {
    const d = E("rect", { x: -11, y: -78, width: 22, height: 90, rx: 11, fill: piel, stroke: STK, "stroke-width": 6 }, m);
    d._x = x; return d;
  });
  return m;
}
const mueve = (m, x, y, t, vis, rit) => {
  tf(m, `translate(${x} ${y})`); op(m, vis * 4);
  m.dedos.forEach((d, i) => tf(d, `translate(${d._x} 0) rotate(${rit * 26 * Math.sin(t * 15 + i * 1.3)} 0 70)`));
};
const respira = (r, t, k = 0) => {
  tf(r.cuerpo, `translate(0 ${1.5 * Math.sin(t * 2.4 + k)}) scale(${1 + 0.012 * Math.sin(t * 2.4 + k)} ${1 + 0.02 * Math.sin(t * 2.4 + k)})`);
  tf(r.cola, `rotate(${10 * Math.sin(t * 3 + k)} -125 22)`);
};

// ======================= ESCENA 4 · una rata con cosquillas, dos ratas jugando: los chillidos en el detector
S[4] = {
  bloques: [
    { x: 60, y: 720, w: 960, h: 120, size: 96, al: "center", txt: "Con *cosquillas*", en: () => W(4, "cosquillas") - 0.25 },
    { x: 60, y: 860, w: 960, h: 110, size: 84, al: "center", txt: "Jugando entre ellas", en: () => W(4, "jugar") - 0.3 },
  ],
  build(g, defs) {
    const r = this.r = {};
    const cp = E("clipPath", { id: "clipP" }, defs);
    E("rect", { x: 70, y: 1110, width: 940, height: 390, rx: 40 }, cp);
    r.r1 = E("g", {}, g); r.rata1 = rata(r.r1, "#E8DFFA");
    r.r2 = E("g", {}, g); r.rata2 = rata(r.r2, "#CFF5E8");
    r.mano = mano(g);
    E("rect", { x: 70, y: 1110, width: 940, height: 390, rx: 40, fill: PANEL, stroke: STK, "stroke-width": 7 }, g);
    r.pan = E("g", { "clip-path": "url(#clipP)" }, g);
    for (let k = 0; k < 4; k++) E("line", { x1: 90, x2: 990, y1: 1170 + k * 90, y2: 1170 + k * 90, stroke: GR, "stroke-width": 3, "stroke-dasharray": "4 14", opacity: 0.6 }, r.pan);
    r.scan = E("rect", { x: 0, y: 1112, width: 10, height: 386, rx: 5, fill: AM, opacity: 0.55 }, r.pan);
    r.tk = [];
    for (let q = 0; q < 2; q++) for (let i = 0; i < 70; i++) {
      const e = E("path", { d: "M0 0 Q8 -4 18 -30", fill: "none", stroke: q ? VI : CO, "stroke-width": 10, "stroke-linecap": "round" }, r.pan);
      e._q = q; e._i = i; e._y = 1190 + ((i * 53 + q * 29) % 8) * 38; r.tk.push(e);
    }
  },
  paint(t, dur) {
    const r = this.r, tC = W(4, "cosquillas"), tJ = W(4, "jugar");
    // rata 1
    const q1 = rebote(tramo(t, 0.05, 0.6));
    tf(r.r1, `translate(320 ${450 - (1 - q1) * 120 + 4 * Math.sin(t * 2)}) scale(${Math.max(q1, 0.001) * 1.1})`); op(r.r1, q1 * 4);
    respira(r.rata1, t);
    const ch1 = tramo(t, tC, tC + 0.25);
    r.rata1.boca.setAttribute("ry", 1 + ch1 * (4 + 6 * Math.abs(Math.sin(t * 16))));
    pintaOndas(r.rata1.ond, 222, -12, t, 36, 26, ch1, 1);
    // mano que roza la barriga
    const hv = tramo(t, tC - 0.15, tC + 0.25), hx = lerp(120, 320, sal(tramo(t, tC - 0.15, tC + 0.35)));
    mueve(r.mano, hx + 14 * Math.sin(t * 9) * hv, lerp(640, 585, sal(tramo(t, tC - 0.15, tC + 0.35))) + 8 * Math.sin(t * 13) * hv, t, hv, hv);
    // rata 2 entra al «jugar»
    const q2 = sal(tramo(t, tJ - 0.2, tJ + 0.55));
    tf(r.r2, `translate(${lerp(1350, 800, q2)} ${450 + 5 * Math.sin(t * 2.6 + 1)}) scale(-0.9 0.9)`); op(r.r2, q2 * 4);
    respira(r.rata2, t, 1.7);
    const ch2 = tramo(t, tJ + 0.25, tJ + 0.5);
    r.rata2.boca.setAttribute("ry", 1 + ch2 * (4 + 6 * Math.abs(Math.sin(t * 17 + 1))));
    pintaOndas(r.rata2.ond, 222, -12, t, 36, 26, ch2, 1);
    r.scan.setAttribute("x", 80 + (t * 260) % 920);
    // el detector: cada chillido es una marca que corre hacia la izquierda; con la segunda rata se duplican
    r.tk.forEach(e => {
      const t0 = (e._q ? tJ + 0.3 : tC + 0.1) + e._i * (e._q ? 0.17 : 0.2) + 0.04 * Math.sin(e._i * 3.1);
      const x = 985 - (t - t0) * 190;
      const v = t >= t0 && x > 92 ? 1 : 0;
      e.style.opacity = v;
      if (v) tf(e, `translate(${x} ${e._y}) rotate(${(e._q ? -6 : 4)})`);
    });
  },
};

// ======================= ESCENA 5 · del chillido a la risa
S[5] = {
  bloques: [
    { x: 60, y: 720, w: 960, h: 250, size: 112, al: "center", txt: "La risa de las *ratas*", en: () => W(5, "risa") - 0.3 },
    { x: 60, y: 1000, w: 960, h: 80, size: 58, peso: 700, col: SUB, al: "center", txt: "eso proponen", en: () => W(5, "ratas") - 0.1 },
  ],
  build(g) {
    const r = this.r = { conf: [], jas: [] };
    r.lin = E("line", { x1: 70, x2: 1010, y1: 470, y2: 470, stroke: GR, "stroke-width": 4, "stroke-dasharray": "4 14" }, g);
    r.wc = E("path", { fill: "none", stroke: VI, "stroke-width": 9, "stroke-linejoin": "round", "stroke-linecap": "round" }, g);
    r.wl = E("path", { fill: "none", stroke: ME, "stroke-width": 12, "stroke-linejoin": "round", "stroke-linecap": "round" }, g);
    r.fr = E("circle", { r: 14, fill: AM, stroke: STK, "stroke-width": 5 }, g);
    for (let i = 0; i < 3; i++) {
      const j = E("g", {}, g); ja(j, 78, CO); j._x = 250 + i * 290; r.jas.push(j);
    }
    for (let i = 0; i < 9; i++) {
      const c = i % 2 ? E("circle", { r: 14, fill: PAL[i % 5], stroke: STK, "stroke-width": 4 }, g)
                      : E("rect", { x: -13, y: -13, width: 26, height: 26, rx: 6, fill: PAL[i % 5], stroke: STK, "stroke-width": 4 }, g);
      c._x = 110 + i * 108; c._y = 250 + (i * 71) % 3 * 150; r.conf.push(c);
    }
    r.r = E("g", {}, g); r.rata = rata(r.r, "#E8DFFA");
  },
  paint(t, dur) {
    const r = this.r, tR = W(5, "risa"), tA = W(5, "alegria"), tCh = W(5, "chillidos");
    const xe = 70 + 940 * sal(tramo(t, 0.1, 1.0));
    const xm = 70 + 940 * suave(tramo(t, tR - 0.15, tR + 1.15));
    const N = 2;
    const chirp = x => 470 + 20 * Math.sin(x * 0.9 - t * 22) * (0.55 + 0.45 * Math.sin(x * 0.05 + t));
    const risa = x => 470 + 86 * (0.45 + 0.55 * Math.sin(x * 0.021 - t * 4.4)) * Math.sin(x * 0.075 - t * 13);
    let d1 = "", d2 = "";
    for (let x = 70; x <= xe; x += N) if (x >= xm) d1 += (d1 ? "L" : "M") + x + " " + chirp(x).toFixed(1);
    for (let x = 70; x <= Math.min(xm, xe); x += N) d2 += (d2 ? "L" : "M") + x + " " + risa(x).toFixed(1);
    r.wc.setAttribute("d", d1 || "M0 0"); r.wl.setAttribute("d", d2 || "M0 0");
    const fx = Math.min(xm, xe);
    const fv = tramo(t, tR - 0.2, tR - 0.05) * (1 - tramo(t, tR + 1.2, tR + 1.5));
    r.fr.setAttribute("cx", fx); r.fr.setAttribute("cy", (xm > xe ? chirp(xe) : risa(xm)) + 0); op(r.fr, fv);
    r.jas.forEach((j, i) => {
      const p = rebote(tramo(t, tR + 0.25 + i * 0.3, tR + 0.7 + i * 0.3));
      tf(j, `translate(${j._x} ${295 - Math.abs(Math.sin(t * 5 + i)) * 14 * p}) rotate(${-10 + 8 * Math.sin(t * 4 + i)}) scale(${Math.max(p, 0.001)})`); op(j, p * 3);
    });
    r.conf.forEach((c, i) => {
      const p = rebote(tramo(t, tA - 0.1 + (i % 5) * 0.09, tA + 0.4 + (i % 5) * 0.09));
      tf(c, `translate(${c._x + 16 * Math.sin(t * 1.7 + i)} ${c._y - 30 * Math.max(0, t - tA) / 2 % 70 - 10 * Math.sin(t * 2 + i)}) rotate(${t * 90 + i * 40}) scale(${Math.max(p, 0.001)})`); op(c, p * 3);
    });
    // la rata de abajo: chilla desde el principio y, en «alegría», salta
    const q = rebote(tramo(t, 0.1, 0.6)), hop = tramo(t, tA - 0.1, tA + 0.3);
    tf(r.r, `translate(470 ${1370 - (1 - q) * 100 - Math.abs(Math.sin(t * 6.5)) * 46 * hop}) rotate(${-5 * hop * Math.sin(t * 6.5)}) scale(${Math.max(q, 0.001) * 1.15})`); op(r.r, q * 4);
    respira(r.rata, t, 0.6);
    const ch = tramo(t, 0.3, 0.5);
    r.rata.boca.setAttribute("ry", 1 + ch * (4 + 6 * Math.abs(Math.sin(t * 16))));
    pintaOndas(r.rata.ond, 222, -12, t, 36, 26, ch, 1);
  },
};

</script></body></html>
