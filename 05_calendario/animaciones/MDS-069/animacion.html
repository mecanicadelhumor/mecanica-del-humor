<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>MDS-069 · animación a medida (C55.2)</title>
<!--
  MDS-069 · escenas [3,4] · brazo A del ciclo B2 (C55.2) · fondo azul noche #16213A.
  Página autónoma: sin red, sin Math.random ni Date. Todo sale de (n, t); los movimientos se anclan
  a las palabras de la voz con W(), nunca a segundos escritos a mano. Sin caras: formas, objetos, esquemas.
-->
<style>
html,body{margin:0;padding:0;background:#05080f}
body{margin:0}
#lienzo{position:relative;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#16213A;
  font-family:system-ui,"DejaVu Sans",Arial,sans-serif;color:#16213A}
#dib{position:absolute;left:0;top:0;width:1080px;height:1920px}
.bq{position:absolute;font-weight:900;line-height:1.12;letter-spacing:-.01em}
.bq .p{display:inline-block;opacity:0;transform-origin:50% 80%}
</style></head>
<body><div id="lienzo"></div>
<script>
const ESCENAS_LISTA = [3,4];
const BG="#16213A", PUNTO="#1D2B4E", TX="#F2F4F8", HL="#FFB020", GR="#6C7A99", PANEL="#243462", STK="#0B1222", SUB="#B9C3DB";
const PAL = ["#EF476F","#4CC9F0","#06D6A0","#9B5DE5","#FFB020"];
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const tramo = (t, a, b) => cl((t - a) / (b - a));
const suave = x => x * x * (3 - 2 * x);
const sal = x => 1 - Math.pow(1 - x, 3);
const rebote = x => { x = cl(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const AM = "#FFB020", CI = "#4CC9F0", CO = "#EF476F", ME = "#06D6A0", VI = "#9B5DE5";
function E(tag, at, par) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (par) par.appendChild(e); return e; }
const op = (el, v) => { el.style.opacity = cl(v); };
const tf = (el, s) => el.setAttribute("transform", s);
const pop = (el, x, y, p, rot = 0) => { tf(el, `translate(${x} ${y}) rotate(${rot}) scale(${Math.max(p, 0.001)})`); op(el, p * 3); };

let T = {};
window.cargarTiempos = d => { T = d || {}; };
const norm = s => s.normalize("NFD").replace(/[^\p{L}\p{N}]/gu, "").toLowerCase();
function W(n, pal, vez = 1) {           // instante en que la voz dice `pal` en la escena n
  let k = 0;
  for (const [t, w] of (T[n] || {}).palabras || []) if (norm(w) === norm(pal) && ++k === vez) return t;
  return 0.6;
}
const DUR = n => ((T[n] || {}).dur) || 8;
const S = {};
let FONDO, PART = [], BLQ = {};

function construir() {
  const lienzo = $("lienzo");
  const svg = E("svg", { id: "dib", viewBox: "0 0 1080 1920", width: 1080, height: 1920 }, lienzo);
  const defs = E("defs", {}, svg);
  const pat = E("pattern", { id: "reti", width: 72, height: 72, patternUnits: "userSpaceOnUse" }, defs);
  E("circle", { cx: 18, cy: 18, r: 5, fill: PUNTO }, pat);
  E("circle", { cx: 54, cy: 54, r: 5, fill: PUNTO }, pat);
  FONDO = pat;
  E("rect", { x: 0, y: 0, width: 1080, height: 1920, fill: "url(#reti)" }, svg);
  for (let i = 0; i < 22; i++) {
    const col = PAL[i % PAL.length];
    const c = i % 2 ? E("circle", { r: 7 + (i % 4) * 3, fill: col, opacity: 0.55 }, svg)
                    : E("rect", { x: -9, y: -9, width: 18 + (i % 3) * 4, height: 18 + (i % 3) * 4, rx: 5, fill: col, opacity: 0.55 }, svg);
    c._x = (i * 197) % 1080; c._y = (i * 331) % 1920; c._v = 16 + (i * 7) % 26; c._f = i * 1.3; c._r = i % 2;
    PART.push(c);
  }
  const cam = E("g", { id: "cam" }, svg);
  E("rect", { id: "prog", x: 0, y: 0, width: 0, height: 12, fill: HL }, svg);
  for (const n of ESCENAS_LISTA) {
    const g = E("g", { id: "s" + n }, cam);
    S[n].build(g, defs);
    const cont = document.createElement("div"); cont.id = "tx" + n; lienzo.appendChild(cont);
    BLQ[n] = (S[n].bloques || []).map(b => {
      const d = document.createElement("div"); d.className = "bq";
      d.style.cssText = `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;font-size:${b.size}px;color:${b.col || TX};text-align:${b.al || "left"};font-weight:${b.peso || 900}`;
      let am = false; const sp = [];
      b.txt.split(" ").forEach((tok, i) => {
        let t = tok;
        if (t.startsWith("*")) { am = true; t = t.slice(1); }
        const cierra = t.endsWith("*"); if (cierra) t = t.slice(0, -1);
        const s = document.createElement("span"); s.className = "p"; s.textContent = t;
        if (am) s.style.color = HL, s._am = true;
        if (i) d.appendChild(document.createTextNode(" "));
        d.appendChild(s); sp.push(s);
        if (cierra) am = false;
      });
      cont.appendChild(d);
      return { b, d, sp };
    });
  }
}

window.ESCENAS = ESCENAS_LISTA;
window.pintarEscena = function (n, t) {
  if (!FONDO) construir();
  const dur = DUR(n);
  for (const m of ESCENAS_LISTA) { $("s" + m).style.display = m === n ? "" : "none"; $("tx" + m).style.display = m === n ? "" : "none"; }
  FONDO.setAttribute("patternTransform", `translate(${(t * 16) % 72} ${(t * -11) % 72})`);
  PART.forEach(c => {
    const y = ((c._y - t * c._v) % 1980 + 1980) % 1980 - 30;
    const x = c._x + 22 * Math.sin(t * 0.8 + c._f);
    if (c._r) { c.setAttribute("cx", x); c.setAttribute("cy", y); }
    else c.setAttribute("transform", `translate(${x} ${y}) rotate(${t * 40 + c._f * 50})`);
  });
  const z = 1 + 0.04 * (t / dur);
  tf($("cam"), `translate(${540 + 7 * Math.sin(t * 0.5)} ${960 - 10 * t / dur * 4}) scale(${z}) translate(-540 -960)`);
  $("prog").setAttribute("width", 1080 * cl(t / dur));
  S[n].paint(t, dur);
  for (const { b, sp } of BLQ[n]) {
    const t0 = Math.min(b.en(), dur - 0.6);
    sp.forEach((s, i) => {
      const a = t0 + i * 0.09, p = sal(tramo(t, a, a + 0.28));
      const k = s._am ? lerp(1.35, 1, rebote(tramo(t, a, a + 0.45))) : lerp(0.9, 1, p);
      s.style.opacity = p;
      s.style.transform = `translateY(${(1 - p) * 40}px) scale(${k})`;
    });
  }
};
window.comprobarEscena = function (n, t) {
  window.pintarEscena(n, t);
  const m = [];
  for (const { b, sp } of BLQ[n]) {
    const ancho = Math.max(...sp.map(s => s.offsetLeft + s.offsetWidth));
    const alto = Math.max(...sp.map(s => s.offsetTop + s.offsetHeight));
    if (ancho > b.w + 1) m.push(`${b.txt}: no cabe a lo ancho`);
    if (alto > b.h + 1) m.push(`${b.txt}: no cabe en su caja (${alto} > ${b.h})`);
    if (b.y + Math.max(alto, b.h) > 1650) m.push(`${b.txt}: pasa de la zona segura`);
    if (b.x < 30 || b.x + b.w > 1050) m.push(`${b.txt}: fuera del ancho`);
  }
  return m;
};
window.addEventListener("DOMContentLoaded", () => { if (!FONDO) construir(); });

// figura sin cara: cuerpo redondeado y cabeza lisa
function fig(g, col) {
  const f = E("g", {}, g);
  E("path", { d: "M-44 90 Q-44 0 0 0 Q44 0 44 90 Z", fill: col, stroke: STK, "stroke-width": 7, "stroke-linejoin": "round" }, f);
  E("circle", { cx: 0, cy: -38, r: 34, fill: col, stroke: STK, "stroke-width": 7 }, f);
  return f;
}
// bocadillo con cola abajo-izquierda; devuelve grupo centrado en (0,0)
function boca(g, w, h, fill, dash) {
  const b = E("g", {}, g);
  E("path", { d: `M${-w / 2 + 40} ${h / 2 - 4} L${-w / 2 + 20} ${h / 2 + 42} L${-w / 2 + 84} ${h / 2 - 4} Z`, fill: fill || PANEL, stroke: STK, "stroke-width": 7, "stroke-linejoin": "round", ...(dash ? { "stroke-dasharray": "14 12" } : {}) }, b);
  E("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: 36, fill: fill || PANEL, stroke: STK, "stroke-width": 7, ...(dash ? { "stroke-dasharray": "14 12" } : {}) }, b);
  E("rect", { x: -w / 2 + 34, y: h / 2 - 10, width: 44, height: 12, fill: fill || PANEL }, b);
  return b;
}
function lineas(g, w, h, col, n = 3) {
  const l = E("g", {}, g);
  for (let i = 0; i < n; i++) {
    const ww = (w - 60) * (i === n - 1 ? 0.55 : 1 - i * 0.08);
    E("rect", { x: -w / 2 + 30, y: -h / 2 + 28 + i * ((h - 56) / n), width: ww, height: 14, rx: 7, fill: col }, l);
  }
  return l;
}
function ja(g, size, col) {
  const t = E("text", { x: 0, y: size * 0.34, "text-anchor": "middle", "font-size": size, "font-weight": 900, fill: col, "font-family": "system-ui,'DejaVu Sans',Arial,sans-serif" }, g);
  t.textContent = "ja"; return t;
}
function ondas(g, col, n = 3) {
  const a = [];
  for (let i = 0; i < n; i++) a.push(E("path", { fill: "none", stroke: col, "stroke-width": 9, "stroke-linecap": "round" }, g));
  return a;
}
function pintaOndas(a, cx, cy, t, r0, sep, vis, lado) {
  a.forEach((p, i) => {
    const r = r0 + i * sep + 5 * Math.sin(t * 6 - i * 1.2);
    const x0 = cx + lado * r * Math.cos(0.7), y0 = cy - r * Math.sin(0.7), x1 = cx + lado * r * Math.cos(0.7), y1 = cy + r * Math.sin(0.7);
    p.setAttribute("d", `M${x0} ${y0} A${r} ${r} 0 0 ${lado > 0 ? 1 : 0} ${x1} ${y1}`);
    p.style.opacity = cl(vis * (0.55 + 0.45 * Math.sin(t * 5 - i * 1.4)));
  });
}

// ---- piezas de esta página: la sonrisa (solo la boca, sin cara), figuras, medidores
function sonrisa(g, w, col) {
  const s = E("g", {}, g);
  s.curva = E("path", { fill: "none", stroke: col, "stroke-width": 34, "stroke-linecap": "round" }, s);
  s.h1 = E("circle", { r: 16, fill: col, opacity: 0.5 }, s);
  s.h2 = E("circle", { r: 16, fill: col, opacity: 0.5 }, s);
  s.w = w; return s;
}
function pintaSonrisa(s, k) {
  const w = s.w, c = -60 * k, m = 40 * k;
  s.curva.setAttribute("d", `M${-w / 2} ${c} Q0 ${2 * m - c} ${w / 2} ${c}`);
  [[s.h1, -1], [s.h2, 1]].forEach(([h, l]) => { h.setAttribute("cx", l * (w / 2 + 38)); h.setAttribute("cy", c - 14); op(h, 0.6 * k * 2); h.setAttribute("r", 8 + 12 * k); });
}
function pista(g, x, y, w, h, fill) {
  E("rect", { x, y, width: w, height: h, rx: h / 2, fill: PANEL, stroke: STK, "stroke-width": 7 }, g);
  const n = E("rect", { x: x + 6, y: y + 6, width: 0, height: h - 12, rx: (h - 12) / 2, fill }, g);
  n._x = x + 6; n._w = w - 12; return n;
}

// ======================= ESCENA 3 · casi cuatro mil personas, una sonrisa a propósito, una pregunta
S[3] = {
  bloques: [
    { x: 60, y: 520, w: 960, h: 190, size: 80, al: "center", txt: "Casi cuatro mil *personas*", en: () => W(3, "casi") - 0.2 },
    { x: 60, y: 740, w: 960, h: 100, size: 80, al: "center", txt: "Sonrisa a propósito", en: () => W(3, "sonrieran") - 0.4 },
    { x: 60, y: 870, w: 960, h: 100, size: 80, al: "center", txt: "¿Cómo te sientes?", en: () => W(3, "como") - 0.3 },
  ],
  build(g) {
    const r = this.r = { fig: [] };
    for (let i = 0; i < 30; i++) {
      const f = fig(g, PAL[i % 5]); f._x = 100 + (i % 10) * 98 + (Math.floor(i / 10) % 2) * 20; f._y = 190 + Math.floor(i / 10) * 125; f._i = i;
      r.fig.push(f);
    }
    r.s = sonrisa(g, 440, CO);
    r.cheque = E("g", {}, g);
    r.sl = E("rect", { x: 160, y: 1440, width: 760, height: 22, rx: 11, fill: GR }, r.cheque);
    r.kn = E("circle", { r: 30, fill: AM, stroke: STK, "stroke-width": 7 }, r.cheque);
    r.bub = E("g", {}, g); boca(r.bub, 150, 100, PANEL);
    for (let i = 0; i < 3; i++) E("circle", { cx: -36 + i * 36, cy: 0, r: 9, fill: STK }, r.bub);
  },
  paint(t, dur) {
    const r = this.r, tS = W(3, "sonrieran"), tP = W(3, "mil"), tQ = W(3, "como");
    r.fig.forEach(f => {
      const a = (f._i < 12 ? 0.15 + f._i * 0.12 : Math.max(0.15, W(3, "casi") - 0.2) + (f._i - 12) * 0.045), p = rebote(tramo(t, a, a + 0.4));
      tf(f, `translate(${f._x} ${f._y + 5 * Math.sin(t * 2.6 + f._i)}) scale(${Math.max(p, 0.001) * 0.52})`); op(f, p * 3);
    });
    // la boca: seria y, al llegar a «sonrieran», sube las comisuras poco a poco
    const q = rebote(tramo(t, 0.15, 0.7));
    const k = 0.04 * Math.sin(t * 2) + 0.96 * suave(tramo(t, tS, tS + 1.9));
    pintaSonrisa(r.s, k);
    tf(r.s, `translate(540 ${1170 + 6 * Math.sin(t * 2.2) - (1 - q) * 80}) scale(${Math.max(q, 0.001)})`); op(r.s, q * 4);
    // cómo se sentían: burbuja y un deslizador que busca
    const v = rebote(tramo(t, tQ - 0.2, tQ + 0.4));
    op(r.cheque, v * 3);
    tf(r.bub, `translate(540 ${1340 - (1 - v) * 50}) scale(${Math.max(v, 0.001)})`); op(r.bub, v * 3);
    r.kn.setAttribute("cx", 540 + 270 * Math.sin(t * 1.9) * Math.min(1, v)); r.kn.setAttribute("cy", 1451);
  },
};

// ======================= ESCENA 4 · más contentos, aunque empezaran sin alegría
S[4] = {
  bloques: [
    { x: 60, y: 620, w: 960, h: 250, size: 108, al: "center", txt: "Algo más *contentos*", en: () => W(4, "contentas") - 0.3 },
    { x: 60, y: 900, w: 960, h: 80, size: 58, peso: 700, col: SUB, al: "center", txt: "aunque empezaran sin alegría", en: () => W(4, "ninguna") - 0.5 },
  ],
  build(g) {
    const r = this.r = { chis: [] };
    r.s = sonrisa(g, 420, CO);
    for (let i = 0; i < 8; i++) {
      const c = i % 2 ? E("circle", { r: 14, fill: PAL[i % 5], stroke: STK, "stroke-width": 4 }, g)
                      : E("rect", { x: -13, y: -13, width: 26, height: 26, rx: 6, fill: PAL[i % 5], stroke: STK, "stroke-width": 4 }, g);
      c._a = i / 8 * 2 * Math.PI; r.chis.push(c);
    }
    r.f1 = fig(g, ME); r.f2 = fig(g, GR); r.f2b = fig(g, CI);
    r.n1 = pista(g, 260, 1180, 700, 62, ME);
    r.n2 = pista(g, 260, 1400, 700, 62, CI);
    r.m0 = E("line", { x1: 266, x2: 266, y1: 1166, y2: 1256, stroke: AM, "stroke-width": 8, "stroke-linecap": "round" }, g);
    r.m1 = E("line", { x1: 266, x2: 266, y1: 1386, y2: 1476, stroke: AM, "stroke-width": 8, "stroke-linecap": "round" }, g);
    r.fl = E("path", { d: "M0 0 L40 0 L40 -30 L68 14 L40 58 L40 28 L0 28 Z", fill: AM, stroke: STK, "stroke-width": 5, "stroke-linejoin": "round", transform: "rotate(-90)" }, g);
    r.fl2 = E("path", { d: "M0 0 L40 0 L40 -30 L68 14 L40 58 L40 28 L0 28 Z", fill: AM, stroke: STK, "stroke-width": 5, "stroke-linejoin": "round" }, g);
  },
  paint(t, dur) {
    const r = this.r, tC = W(4, "contentas"), tI = W(4, "incluso"), tN = W(4, "ninguna");
    const q = rebote(tramo(t, 0.1, 0.6));
    pintaSonrisa(r.s, 0.96 + 0.04 * Math.sin(t * 4) + 0.12 * rebote(tramo(t, tC - 0.1, tC + 0.5)) * Math.sin(t * 8));
    tf(r.s, `translate(540 ${330 + 8 * Math.sin(t * 2.4)}) scale(${Math.max(q, 0.001) * (1 + 0.1 * rebote(tramo(t, tC - 0.1, tC + 0.4)))})`); op(r.s, q * 4);
    r.chis.forEach((c, i) => {
      const p = rebote(tramo(t, tC - 0.05 + i * 0.05, tC + 0.45 + i * 0.05)), R = 270 + 14 * Math.sin(t * 3 + i);
      tf(c, `translate(${540 + R * 1.15 * Math.cos(c._a + t * 0.4)} ${330 + R * 0.62 * Math.sin(c._a + t * 0.4)}) rotate(${t * 80 + i * 45}) scale(${Math.max(p, 0.001)})`); op(c, p * 3);
    });
    // fila 1: empieza a media altura y sube «un poco» en «contentas»
    const v1 = rebote(tramo(t, 0.2, 0.7));
    const l1 = 0.40 + 0.22 * suave(tramo(t, tC, tC + 0.9)) + 0.008 * Math.sin(t * 6);
    tf(r.f1, `translate(150 ${1206 + 3 * Math.sin(t * 3)}) scale(${Math.max(v1, 0.001) * 0.78})`); op(r.f1, v1 * 3);
    r.n1.setAttribute("width", r.n1._w * l1); op(r.n1, v1 * 3);
    // fila 2: llega con «incluso», parte de cero y, en «ninguna alegría», sube también
    const v2 = rebote(tramo(t, tI - 0.1, tI + 0.5));
    const up = suave(tramo(t, tN + 0.1, tN + 1.1));
    const l2 = 0.003 + 0.2 * up + 0.006 * Math.sin(t * 6) * up;
    tf(r.f2, `translate(150 ${1426 + 3 * Math.sin(t * 3 + 1)}) scale(${Math.max(v2, 0.001) * 0.78})`); op(r.f2, v2 * 3 * (1 - up));
    tf(r.f2b, `translate(150 ${1426 + 3 * Math.sin(t * 3 + 1)}) scale(${Math.max(v2, 0.001) * 0.78})`); op(r.f2b, v2 * 3 * up);
    r.n2.setAttribute("width", Math.max(0.01, r.n2._w * l2)); op(r.n2, v2 * 3);
    op(r.m0, v1 * 3 * 0); op(r.m1, v2 * 3 * (1 - up * 0.6));
    r.m1.setAttribute("stroke-width", 8 + 3 * Math.sin(t * 9) * (1 - up));
    // flechas que suben
    const f = tramo(t, tC + 0.2, tC + 0.9), f2 = up;
    tf(r.fl, `translate(${264 + r.n1._w * l1} 1146) scale(0.6)`); op(r.fl, Math.min(1, f * 3) * v1 * (0.8 + 0.2 * Math.sin(t * 9)));
    tf(r.fl2, `translate(0 0)`); op(r.fl2, 0);
  },
};

</script></body></html>
