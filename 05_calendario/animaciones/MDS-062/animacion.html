<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>MDS-062 · animación a medida (C55.2)</title>
<!--
  MDS-062 · escenas [4, 5] · brazo A del ciclo B2 (C55.2) · fondo azul noche #16213A.
  Página autónoma: sin red, sin Math.random ni Date. Todo sale de (n, t); los movimientos se anclan
  a las palabras de la voz con W(), nunca a segundos escritos a mano. Sin caras: formas, objetos, esquemas.
-->
<style>
html,body{margin:0;padding:0;background:#05080f}
body{margin:0}
#lienzo{position:relative;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#16213A;
  font-family:system-ui,"DejaVu Sans",Arial,sans-serif;color:#F2F4F8}
#dib{position:absolute;left:0;top:0;width:1080px;height:1920px}
.bq{position:absolute;font-weight:900;line-height:1.12;letter-spacing:-.01em}
.bq .p{display:inline-block;opacity:0;transform-origin:50% 80%}
</style></head>
<body><div id="lienzo"></div>
<script>
const ESCENAS_LISTA = [4, 5];
const BG="#16213A", PUNTO="#1D2B4E", TX="#F2F4F8", HL="#FFB020", GR="#6C7A99", PANEL="#243462", STK="#0B1222";
const PAL = ["#FFB020","#4CC9F0","#EF476F","#06D6A0","#9B5DE5"];
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const tramo = (t, a, b) => cl((t - a) / (b - a));
const suave = x => x * x * (3 - 2 * x);
const sal = x => 1 - Math.pow(1 - x, 3);
const rebote = x => { x = cl(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const AM = "#FFB020", CI = "#4CC9F0", CO = "#EF476F", ME = "#06D6A0", VI = "#9B5DE5";
function E(tag, at, par) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (par) par.appendChild(e); return e; }
const op = (el, v) => { el.style.opacity = cl(v); };
const tf = (el, s) => el.setAttribute("transform", s);
const pop = (el, x, y, p, rot = 0) => { tf(el, `translate(${x} ${y}) rotate(${rot}) scale(${Math.max(p, 0.001)})`); op(el, p * 3); };

let T = {};
window.cargarTiempos = d => { T = d || {}; };
const norm = s => s.normalize("NFD").replace(/[^\p{L}\p{N}]/gu, "").toLowerCase();
function W(n, pal, vez = 1) {           // instante en que la voz dice `pal` en la escena n
  let k = 0;
  for (const [t, w] of (T[n] || {}).palabras || []) if (norm(w) === norm(pal) && ++k === vez) return t;
  return 0.6;
}
const DUR = n => ((T[n] || {}).dur) || 8;
const S = {};
let FONDO, PART = [], BLQ = {};

function construir() {
  const lienzo = $("lienzo");
  const svg = E("svg", { id: "dib", viewBox: "0 0 1080 1920", width: 1080, height: 1920 }, lienzo);
  const defs = E("defs", {}, svg);
  const pat = E("pattern", { id: "reti", width: 72, height: 72, patternUnits: "userSpaceOnUse" }, defs);
  E("circle", { cx: 18, cy: 18, r: 5, fill: PUNTO }, pat);
  E("circle", { cx: 54, cy: 54, r: 5, fill: PUNTO }, pat);
  FONDO = pat;
  E("rect", { x: 0, y: 0, width: 1080, height: 1920, fill: "url(#reti)" }, svg);
  for (let i = 0; i < 22; i++) {
    const col = PAL[i % PAL.length];
    const c = i % 2 ? E("circle", { r: 7 + (i % 4) * 3, fill: col, opacity: 0.55 }, svg)
                    : E("rect", { x: -9, y: -9, width: 18 + (i % 3) * 4, height: 18 + (i % 3) * 4, rx: 5, fill: col, opacity: 0.55 }, svg);
    c._x = (i * 197) % 1080; c._y = (i * 331) % 1920; c._v = 16 + (i * 7) % 26; c._f = i * 1.3; c._r = i % 2;
    PART.push(c);
  }
  const cam = E("g", { id: "cam" }, svg);
  E("rect", { id: "prog", x: 0, y: 0, width: 0, height: 12, fill: HL }, svg);
  for (const n of ESCENAS_LISTA) {
    const g = E("g", { id: "s" + n }, cam);
    S[n].build(g, defs);
    const cont = document.createElement("div"); cont.id = "tx" + n; lienzo.appendChild(cont);
    BLQ[n] = (S[n].bloques || []).map(b => {
      const d = document.createElement("div"); d.className = "bq";
      d.style.cssText = `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;font-size:${b.size}px;color:${b.col || TX};text-align:${b.al || "left"};font-weight:${b.peso || 900}`;
      let am = false; const sp = [];
      b.txt.split(" ").forEach((tok, i) => {
        let t = tok;
        if (t.startsWith("*")) { am = true; t = t.slice(1); }
        const cierra = t.endsWith("*"); if (cierra) t = t.slice(0, -1);
        const s = document.createElement("span"); s.className = "p"; s.textContent = t;
        if (am) s.style.color = HL, s._am = true;
        if (i) d.appendChild(document.createTextNode(" "));
        d.appendChild(s); sp.push(s);
        if (cierra) am = false;
      });
      cont.appendChild(d);
      return { b, d, sp };
    });
  }
}

window.ESCENAS = ESCENAS_LISTA;
window.pintarEscena = function (n, t) {
  if (!FONDO) construir();
  const dur = DUR(n);
  for (const m of ESCENAS_LISTA) { $("s" + m).style.display = m === n ? "" : "none"; $("tx" + m).style.display = m === n ? "" : "none"; }
  FONDO.setAttribute("patternTransform", `translate(${(t * 16) % 72} ${(t * -11) % 72})`);
  PART.forEach(c => {
    const y = ((c._y - t * c._v) % 1980 + 1980) % 1980 - 30;
    const x = c._x + 22 * Math.sin(t * 0.8 + c._f);
    if (c._r) { c.setAttribute("cx", x); c.setAttribute("cy", y); }
    else c.setAttribute("transform", `translate(${x} ${y}) rotate(${t * 40 + c._f * 50})`);
  });
  const z = 1 + 0.04 * (t / dur);
  tf($("cam"), `translate(${540 + 7 * Math.sin(t * 0.5)} ${960 - 10 * t / dur * 4}) scale(${z}) translate(-540 -960)`);
  $("prog").setAttribute("width", 1080 * cl(t / dur));
  S[n].paint(t, dur);
  for (const { b, sp } of BLQ[n]) {
    const t0 = Math.min(b.en(), dur - 0.6);
    sp.forEach((s, i) => {
      const a = t0 + i * 0.09, p = sal(tramo(t, a, a + 0.28));
      const k = s._am ? lerp(1.35, 1, rebote(tramo(t, a, a + 0.45))) : lerp(0.9, 1, p);
      s.style.opacity = p;
      s.style.transform = `translateY(${(1 - p) * 40}px) scale(${k})`;
    });
  }
};
window.comprobarEscena = function (n, t) {
  window.pintarEscena(n, t);
  const m = [];
  for (const { b, sp } of BLQ[n]) {
    const ancho = Math.max(...sp.map(s => s.offsetLeft + s.offsetWidth));
    const alto = Math.max(...sp.map(s => s.offsetTop + s.offsetHeight));
    if (ancho > b.w + 1) m.push(`${b.txt}: no cabe a lo ancho`);
    if (alto > b.h + 1) m.push(`${b.txt}: no cabe en su caja (${alto} > ${b.h})`);
    if (b.y + Math.max(alto, b.h) > 1650) m.push(`${b.txt}: pasa de la zona segura`);
    if (b.x < 30 || b.x + b.w > 1050) m.push(`${b.txt}: fuera del ancho`);
  }
  return m;
};
window.addEventListener("DOMContentLoaded", () => { if (!FONDO) construir(); });

// figura sin cara: cuerpo redondeado y cabeza lisa
function fig(g, col) {
  const f = E("g", {}, g);
  E("path", { d: "M-44 90 Q-44 0 0 0 Q44 0 44 90 Z", fill: col, stroke: STK, "stroke-width": 7, "stroke-linejoin": "round" }, f);
  E("circle", { cx: 0, cy: -38, r: 34, fill: col, stroke: STK, "stroke-width": 7 }, f);
  return f;
}
// bocadillo con cola abajo-izquierda; devuelve grupo centrado en (0,0)
function boca(g, w, h, fill, dash) {
  const b = E("g", {}, g);
  E("path", { d: `M${-w / 2 + 40} ${h / 2 - 4} L${-w / 2 + 20} ${h / 2 + 42} L${-w / 2 + 84} ${h / 2 - 4} Z`, fill: fill || PANEL, stroke: STK, "stroke-width": 7, "stroke-linejoin": "round", ...(dash ? { "stroke-dasharray": "14 12" } : {}) }, b);
  E("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: 36, fill: fill || PANEL, stroke: STK, "stroke-width": 7, ...(dash ? { "stroke-dasharray": "14 12" } : {}) }, b);
  E("rect", { x: -w / 2 + 34, y: h / 2 - 10, width: 44, height: 12, fill: fill || PANEL }, b);
  return b;
}
function lineas(g, w, h, col, n = 3) {
  const l = E("g", {}, g);
  for (let i = 0; i < n; i++) {
    const ww = (w - 60) * (i === n - 1 ? 0.55 : 1 - i * 0.08);
    E("rect", { x: -w / 2 + 30, y: -h / 2 + 28 + i * ((h - 56) / n), width: ww, height: 14, rx: 7, fill: col }, l);
  }
  return l;
}
function ja(g, size, col) {
  const t = E("text", { x: 0, y: size * 0.34, "text-anchor": "middle", "font-size": size, "font-weight": 900, fill: col, "font-family": "system-ui,'DejaVu Sans',Arial,sans-serif" }, g);
  t.textContent = "ja"; return t;
}
function ondas(g, col, n = 3) {
  const a = [];
  for (let i = 0; i < n; i++) a.push(E("path", { fill: "none", stroke: col, "stroke-width": 9, "stroke-linecap": "round" }, g));
  return a;
}
function pintaOndas(a, cx, cy, t, r0, sep, vis, lado) {
  a.forEach((p, i) => {
    const r = r0 + i * sep + 5 * Math.sin(t * 6 - i * 1.2);
    const x0 = cx + lado * r * Math.cos(0.7), y0 = cy - r * Math.sin(0.7), x1 = cx + lado * r * Math.cos(0.7), y1 = cy + r * Math.sin(0.7);
    p.setAttribute("d", `M${x0} ${y0} A${r} ${r} 0 0 ${lado > 0 ? 1 : 0} ${x1} ${y1}`);
    p.style.opacity = cl(vis * (0.55 + 0.45 * Math.sin(t * 5 - i * 1.4)));
  });
}

// ======================= ESCENA 4 · la libreta de una semana: rayitas de risa, casi todas donde hay dos charlando
S[4] = {
  bloques: [
    { x: 60, y: 1050, w: 960, h: 240, size: 104, al: "center", txt: "Una semana, una *libreta*", en: () => W(4, "libreta") - 0.45 },
  ],
  build(g) {
    const r = this.r = {};
    r.nb = E("g", {}, g);
    E("rect", { x: -480, y: -350, width: 960, height: 700, rx: 50, fill: CO, stroke: STK, "stroke-width": 9 }, r.nb);
    E("rect", { x: -462, y: -332, width: 924, height: 664, rx: 38, fill: "#FF7C98", opacity: 0.35 }, r.nb);
    // espiral
    for (let i = 0; i < 11; i++) E("rect", { x: -440 + i * 88, y: -378, width: 30, height: 56, rx: 15, fill: "#E9EDF5", stroke: STK, "stroke-width": 6 }, r.nb);
    // los siete días
    r.dias = [];
    for (let j = 0; j < 7; j++) r.dias.push(E("circle", { cx: -390 + j * 130, cy: -285, r: 22, fill: GR, stroke: STK, "stroke-width": 6 }, r.nb));
    // las tres páginas
    r.pag = [-300, 0, 300].map((cx, i) => {
      const p = { cx, g: E("g", {}, r.nb) };
      E("rect", { x: cx - 140, y: -225, width: 280, height: 525, rx: 28, fill: PANEL, stroke: STK, "stroke-width": 7 }, p.g);
      for (let k = 0; k < 6; k++) E("rect", { x: cx - 105, y: 118 + k * 30 * 0 + 0, width: 0, height: 0 }, p.g);
      E("rect", { x: cx - 115, y: 100, width: 230, height: 6, rx: 3, fill: GR, opacity: 0.6 }, p.g);
      p.fg = [];
      if (i < 2) {
        p.fg.push(fig(p.g, i ? CI : ME), fig(p.g, i ? ME : VI));
        p.bub = E("g", {}, p.g);
        const b = boca(p.bub, 210, 96, "#FFFFFF"); p.ja = E("g", {}, p.bub); ja(p.ja, 62, CO);
      } else {
        p.fg.push(fig(p.g, CI));
      }
      return p;
    });
    // las rayitas
    this.seq = [];
    const cnt = [11, 9, 1], k = [0, 0, 0]; let c = 0;
    for (let n = 0; n < 21; n++) {
      let pi = n === 8 ? 2 : (c++ % 2);
      if (pi < 2 && k[pi] >= cnt[pi]) pi = 1 - pi;
      const q = k[pi]++;
      this.seq.push({ pi, x: this.r.pag[pi].cx - 92 + (q % 5) * 46, y: 150 + Math.floor(q / 5) * 50, el: E("rect", { x: -6, y: -20, width: 12, height: 40, rx: 6, fill: AM, stroke: STK, "stroke-width": 4 }, r.nb) });
    }
    r.lap = E("g", {}, r.nb);
    E("rect", { x: -9, y: -150, width: 18, height: 120, rx: 6, fill: ME, stroke: STK, "stroke-width": 5 }, r.lap);
    E("path", { d: "M-9 -30 L0 6 L9 -30 Z", fill: "#FFE3A3", stroke: STK, "stroke-width": 5, "stroke-linejoin": "round" }, r.lap);
  },
  paint(t, dur) {
    const r = this.r, tN = 0.1, tL = W(4, "libreta"), tS = W(4, "semana");
    pop(r.nb, 540, 600, rebote(tramo(t, tN, tN + 0.55)), 2 * Math.sin(t * 0.7));
    r.pag.forEach((p, i) => {
      const a = tL - 0.3 + i * 0.12, q = rebote(tramo(t, a, a + 0.5));
      tf(p.g, `translate(${p.cx} 0) scale(${Math.max(q, 0.001)} 1) translate(${-p.cx} 0)`);
      const pos = i < 2 ? [[-62, 0], [62, 0]] : [[0, 0]];
      p.fg.forEach((f, k) => tf(f, `translate(${p.cx + pos[k][0]} ${-35 + 5 * Math.sin(t * 3 + i + k * 2)}) rotate(${4 * Math.sin(t * 2.4 + k * 1.7 + i)}) scale(1.05)`));
      if (p.bub) {
        const rec = this.seq.reduce((m, s, n) => s.pi === i ? Math.max(m, this.ts(n, t)) : m, 0);
        tf(p.bub, `translate(${p.cx} ${-135 + 4 * Math.sin(t * 2 + i)})`);
        tf(p.ja, `scale(${1 + 0.25 * Math.max(0, 1 - (t - rec) * 4) * (rec > 0 ? 1 : 0) + 0.04 * Math.sin(t * 8)})`);
      }
    });
    r.dias.forEach((d, j) => {
      const a = tS - 0.1 + j * 0.17, q = rebote(tramo(t, a, a + 0.35));
      d.setAttribute("fill", q > 0.05 ? PAL[j % 4] : GR);
      d.setAttribute("r", 22 + 8 * Math.sin(Math.PI * tramo(t, a, a + 0.35)) + (q > 0.05 ? 1.5 * Math.sin(t * 4 + j) : 0));
    });
    this.seq.forEach((s, n) => {
      const q = tramo(t, this.t0() + n * this.step(), this.t0() + n * this.step() + 0.3);
      const e = rebote(q);
      tf(s.el, `translate(${s.x} ${s.y - (1 - e) * 130}) rotate(${(1 - q) * 25})`);
      op(s.el, q * 4);
    });
    // el lápiz sigue a la última rayita
    let ult = -1; this.seq.forEach((s, n) => { if (t >= this.t0() + n * this.step()) ult = n; });
    const s = this.seq[Math.max(ult, 0)];
    const lq = tramo(t, this.t0() - 0.3, this.t0());
    tf(r.lap, `translate(${s.x + 40 + 6 * Math.sin(t * 16)} ${s.y + 30 - (1 - lq) * 80}) rotate(35)`); op(r.lap, lq * 3);
  },
  t0() { return W(4, "cada") - 0.05; },
  step() { return Math.max(0.07, (W(4, "reian") + 0.9 - this.t0()) / this.seq.length); },
  ts(n, t) { const a = this.t0() + n * this.step(); return t >= a ? a : 0; },
};

// ======================= ESCENA 5 · reírse funciona como hablar: las risas salen dentro de la charla
S[5] = {
  bloques: [
    { x: 60, y: 1010, w: 960, h: 150, size: 120, al: "center", txt: "Como *hablar*", en: () => W(5, "hablar") - 0.3 },
    { x: 60, y: 1190, w: 960, h: 90, size: 62, peso: 700, al: "center", txt: "sale con alguien delante", en: () => W(5, "alguien") - 0.8 },
  ],
  build(g) {
    const r = this.r = {};
    r.suelo = E("rect", { x: 70, y: 840, width: 940, height: 14, rx: 7, fill: GR, opacity: 0.7 }, g);
    r.fl = fig(g, CI); r.fr = fig(g, VI); r.fs = fig(g, ME);
    r.bl = E("g", {}, g); boca(r.bl, 300, 170, "#FFFFFF");
    r.bll = lineas(r.bl, 300, 170, GR, 3); r.blj = E("g", {}, r.bl); ja(r.blj, 110, CO);
    r.br = E("g", {}, g); boca(r.br, 300, 170, "#FFFFFF");
    r.brl = lineas(r.br, 300, 170, GR, 3); r.brj = E("g", {}, r.br); ja(r.brj, 110, CO);
    r.bs = E("g", {}, g); boca(r.bs, 230, 140, PANEL, true);
    r.ond = ondas(g, AM, 3); r.ond2 = ondas(g, AM, 3);
  },
  paint(t, dur) {
    const r = this.r, tRe = W(5, "reirse"), tHa = W(5, "hablar"), tCa = W(5, "casi"), tMi = W(5, "mitad"), tCh = W(5, "charla"), tAl = W(5, "alguien");
    pop(r.fl, 250, 660, rebote(tramo(t, 0.1, 0.6)) * 2, 3 * Math.sin(t * 2.1));
    pop(r.fr, 590, 660, rebote(tramo(t, 0.25, 0.75)) * 2, -3 * Math.sin(t * 2.3));
    const ps = rebote(tramo(t, tCa - 0.1, tCa + 0.5));
    pop(r.fs, 900, 720, ps * 1.5, 2 * Math.sin(t * 1.6));
    // bocadillos: la risa va dentro de la charla, como una palabra más
    const bL = rebote(tramo(t, tRe - 0.1, tRe + 0.4)), bR = rebote(tramo(t, tHa - 0.1, tHa + 0.4)), bS = rebote(tramo(t, tCa + 0.1, tCa + 0.6));
    pop(r.bl, 290, 330 + 6 * Math.sin(t * 2), bL);
    pop(r.br, 620, 330 + 6 * Math.sin(t * 2 + 1.5), bR);
    pop(r.bs, 880, 500 + 5 * Math.sin(t * 1.8), bS);
    const jaL = (t >= tRe - 0.1 && t < tHa) || t >= tCh, jaR = t >= tMi && t < tCh;
    op(r.blj, jaL ? 1 : 0); op(r.bll, jaL ? 0 : 1);
    op(r.brj, jaR ? 1 : 0); op(r.brl, jaR ? 0 : 1);
    const sac = x => 1 + 0.12 * Math.sin(t * 9) + 0.3 * Math.max(0, 1 - (t - x) * 3.5) * (t >= x ? 1 : 0);
    tf(r.blj, `scale(${sac(t >= tCh ? tCh : tRe)})`); tf(r.brj, `scale(${sac(tMi)})`);
    pintaOndas(r.ond, 250, 640, t, 140, 28, tramo(t, tCh, tCh + 0.3) * jaL, -1);
    pintaOndas(r.ond2, 590, 640, t, 140, 28, tramo(t, tMi, tMi + 0.3) * jaR, 1);
  },
};

</script></body></html>
