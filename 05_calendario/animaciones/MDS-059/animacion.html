<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>MDS-059 · animación a medida (C55.2)</title>
<!--
  MDS-059 · escenas [4, 5] · brazo A del ciclo B1 (C55.2) · fondo ámbar suave #FFE3A3.
  Página autónoma: sin red, sin Math.random ni Date. Todo sale de (n, t); los movimientos se anclan
  a las palabras de la voz con W(), nunca a segundos escritos a mano. Sin caras: formas, objetos, esquemas.
-->
<style>
html,body{margin:0;padding:0;background:#05080f}
body{margin:0}
#lienzo{position:relative;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#FFE3A3;
  font-family:system-ui,"DejaVu Sans",Arial,sans-serif;color:#16213A}
#dib{position:absolute;left:0;top:0;width:1080px;height:1920px}
.bq{position:absolute;font-weight:900;line-height:1.12;letter-spacing:-.01em}
.bq .p{display:inline-block;opacity:0;transform-origin:50% 80%}
</style></head>
<body><div id="lienzo"></div>
<script>
const ESCENAS_LISTA = [4, 5];
const BG = "#FFE3A3", PUNTO = "#FFD27A", TX = "#16213A", HL = "#EF476F", SUB = "#6B4A12", GR = "#B39A62", PANEL = "#FFF9EA";
const PAL = ["#EF476F","#4CC9F0","#06D6A0","#9B5DE5","#16213A"];
// ---------------------------------------------------------------- núcleo común
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const tramo = (t, a, b) => cl((t - a) / (b - a));
const suave = x => x * x * (3 - 2 * x);
const sal = x => 1 - Math.pow(1 - x, 3);
const rebote = x => { x = cl(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const AM = "#FFB020", CI = "#4CC9F0", CO = "#EF476F", ME = "#06D6A0", VI = "#9B5DE5";
function E(tag, at, par) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (par) par.appendChild(e); return e; }
function hex(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }
function mezcla(a, b, p) { const A = hex(a), B = hex(b); return "#" + A.map((v, i) => Math.round(lerp(v, B[i], cl(p))).toString(16).padStart(2, "0")).join(""); }
const op = (el, v) => { el.style.opacity = cl(v); };
const tf = (el, s) => el.setAttribute("transform", s);

// tiempos de la voz (los pone el render antes de pintar)
let T = {};
window.cargarTiempos = d => { T = d || {}; };
const norm = s => s.normalize("NFD").replace(/[^\p{L}\p{N}]/gu, "").toLowerCase();
function W(n, pal, vez = 1) {           // instante en que la voz dice `pal` en la escena n
  let k = 0;
  for (const [t, w] of (T[n] || {}).palabras || []) if (norm(w) === norm(pal) && ++k === vez) return t;
  return 0.6;
}
const DUR = n => ((T[n] || {}).dur) || 8;
const S = {};

// ---------------------------------------------------------------- construcción
let FONDO, PART = [], BLQ = {};
function construir() {
  const lienzo = $("lienzo");
  const svg = E("svg", { id: "dib", viewBox: "0 0 1080 1920", width: 1080, height: 1920 }, lienzo);
  const defs = E("defs", {}, svg);
  const pat = E("pattern", { id: "reti", width: 72, height: 72, patternUnits: "userSpaceOnUse" }, defs);
  E("circle", { cx: 18, cy: 18, r: 5, fill: PUNTO }, pat);
  E("circle", { cx: 54, cy: 54, r: 5, fill: PUNTO }, pat);
  FONDO = pat;
  E("rect", { x: 0, y: 0, width: 1080, height: 1920, fill: "url(#reti)" }, svg);
  for (let i = 0; i < 22; i++) {
    const col = PAL[i % PAL.length];
    const c = i % 2 ? E("circle", { r: 7 + (i % 4) * 3, fill: col, opacity: 0.55 }, svg)
                    : E("rect", { x: -9, y: -9, width: 18 + (i % 3) * 4, height: 18 + (i % 3) * 4, rx: 5, fill: col, opacity: 0.55 }, svg);
    c._x = (i * 197) % 1080; c._y = (i * 331) % 1920; c._v = 16 + (i * 7) % 26; c._f = i * 1.3; c._r = i % 2;
    PART.push(c);
  }
  const cam = E("g", { id: "cam" }, svg);
  E("rect", { id: "prog", x: 0, y: 0, width: 0, height: 12, fill: HL }, svg);
  for (const n of ESCENAS_LISTA) {
    const g = E("g", { id: "s" + n }, cam);
    S[n].build(g, defs);
    const cont = document.createElement("div"); cont.id = "tx" + n; lienzo.appendChild(cont);
    BLQ[n] = (S[n].bloques || []).map(b => {
      const d = document.createElement("div"); d.className = "bq";
      d.style.cssText = `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;font-size:${b.size}px;color:${b.col || TX};text-align:${b.al || "left"}`;
      let am = false; const sp = [];
      b.txt.split(" ").forEach((tok, i) => {
        let t = tok;
        if (t.startsWith("*")) { am = true; t = t.slice(1); }
        const cierra = t.endsWith("*"); if (cierra) t = t.slice(0, -1);
        const s = document.createElement("span"); s.className = "p"; s.textContent = t;
        if (am) s.style.color = HL, s._am = true;
        if (i) d.appendChild(document.createTextNode(" "));
        d.appendChild(s); sp.push(s);
        if (cierra) am = false;
      });
      cont.appendChild(d);
      return { b, d, sp };
    });
  }
}

// ---------------------------------------------------------------- pintar
window.ESCENAS = ESCENAS_LISTA;
window.pintarEscena = function (n, t) {
  if (!FONDO) construir();
  const dur = DUR(n);
  for (const m of ESCENAS_LISTA) { $("s" + m).style.display = m === n ? "" : "none"; $("tx" + m).style.display = m === n ? "" : "none"; }
  FONDO.setAttribute("patternTransform", `translate(${(t * 16) % 72} ${(t * -11) % 72})`);
  PART.forEach(c => {
    const y = ((c._y - t * c._v) % 1980 + 1980) % 1980 - 30;
    const x = c._x + 22 * Math.sin(t * 0.8 + c._f);
    if (c._r) { c.setAttribute("cx", x); c.setAttribute("cy", y); }
    else c.setAttribute("transform", `translate(${x} ${y}) rotate(${t * 40 + c._f * 50})`);
  });
  const z = 1 + 0.04 * (t / dur);
  tf($("cam"), `translate(${540 + 7 * Math.sin(t * 0.5)} ${960 - 10 * t / dur * 4}) scale(${z}) translate(-540 -960)`);
  $("prog").setAttribute("width", 1080 * cl(t / dur));
  S[n].paint(t, dur);
  for (const { b, sp } of BLQ[n]) {
    const t0 = Math.min(b.en(), dur - 0.6);
    sp.forEach((s, i) => {
      const a = t0 + i * 0.09, p = sal(tramo(t, a, a + 0.28));
      const k = s._am ? lerp(1.35, 1, rebote(tramo(t, a, a + 0.45))) : lerp(0.9, 1, p);
      s.style.opacity = p;
      s.style.transform = `translateY(${(1 - p) * 40}px) scale(${k})`;
    });
  }
};
window.comprobarEscena = function (n, t) {
  window.pintarEscena(n, t);
  const m = [];
  for (const { b, sp } of BLQ[n]) {             // se mide sin transformaciones (offset*), no con la animación de entrada
    const ancho = Math.max(...sp.map(s => s.offsetLeft + s.offsetWidth));
    const alto = Math.max(...sp.map(s => s.offsetTop + s.offsetHeight));
    if (ancho > b.w + 1) m.push(`${b.txt}: no cabe a lo ancho`);
    if (alto > b.h + 1) m.push(`${b.txt}: no cabe en su caja (${alto} > ${b.h})`);
    if (b.y + Math.max(alto, b.h) > 1650) m.push(`${b.txt}: pasa de la zona segura`);
    if (b.x < 30 || b.x + b.w > 1050) m.push(`${b.txt}: fuera del ancho`);
  }
  return m;
};
window.addEventListener("DOMContentLoaded", () => { if (!FONDO) construir(); });


function rayos(g, n) { const a = []; for (let k = 0; k < n; k++) a.push(E("line", { stroke: CO, "stroke-width": 12, "stroke-linecap": "round" }, g)); return a; }
function pintaRayos(ls, cx, cy, t, r0, r1, vis) {
  ls.forEach((l, k) => {
    const a = (k * 360 / ls.length + t * 30) * Math.PI / 180, b = r0, c = r0 + (r1 - r0) * (0.6 + 0.4 * Math.sin(t * 7 + k)) * vis;
    l.setAttribute("x1", cx + b * Math.cos(a)); l.setAttribute("y1", cy + b * Math.sin(a));
    l.setAttribute("x2", cx + c * Math.cos(a)); l.setAttribute("y2", cy + c * Math.sin(a));
  });
}
const cuerpo = cx => `M${cx - 120} 900 Q${cx - 120} 700 ${cx} 700 Q${cx + 120} 700 ${cx + 120} 900 Z`;

function mano(g) {
  const m = E("g", {}, g), dedos = [];
  E("rect", { x: -22, y: -520, width: 44, height: 480, rx: 20, fill: AM, stroke: TX, "stroke-width": 7 }, m);
  E("rect", { x: -40, y: -50, width: 80, height: 22, rx: 11, fill: CO, stroke: TX, "stroke-width": 7 }, m);
  E("rect", { x: -40, y: -30, width: 80, height: 70, rx: 28, fill: AM, stroke: TX, "stroke-width": 7 }, m);
  for (let i = 0; i < 4; i++) { const d = E("rect", { x: -38 + i * 20, y: 20, width: 15, height: 56, rx: 7, fill: AM, stroke: TX, "stroke-width": 6 }, m); d._x = -30 + i * 20; dedos.push(d); }
  m._d = dedos; return m;
}
function brazo(g) {
  const m = E("g", {}, g), cer = [];
  E("rect", { x: -16, y: -520, width: 32, height: 330, rx: 14, fill: VI, stroke: TX, "stroke-width": 7 }, m);
  E("circle", { cx: 0, cy: -190, r: 30, fill: ME, stroke: TX, "stroke-width": 7 }, m);
  E("rect", { x: -14, y: -190, width: 28, height: 190, rx: 12, fill: VI, stroke: TX, "stroke-width": 7 }, m);
  E("rect", { x: -26, y: -14, width: 52, height: 30, rx: 12, fill: ME, stroke: TX, "stroke-width": 7 }, m);
  for (let i = 0; i < 5; i++) { const c = E("line", { x1: -20 + i * 10, y1: 14, x2: -20 + i * 10, y2: 56, stroke: TX, "stroke-width": 6, "stroke-linecap": "round" }, m); c._x = -20 + i * 10; cer.push(c); }
  m._c = cer; return m;
}
function agita(m, t) {
  (m._d || []).forEach((d, i) => d.setAttribute("transform", `rotate(${14 * Math.sin(t * 14 + i * 1.5)} ${d._x + 7} 20)`));
  (m._c || []).forEach((c, i) => { c.setAttribute("x2", c._x + 12 * Math.sin(t * 14 + i * 1.5)); });
}


function arco(cx, cy, r, a0, a1) {
  const p = a => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0} ${y0} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`;
}
function fig(g, cx, col) {
  const f = E("g", {}, g);
  E("path", { d: `M${cx - 62} 860 Q${cx - 62} 745 ${cx} 745 Q${cx + 62} 745 ${cx + 62} 860 Z`, fill: col, stroke: TX, "stroke-width": 7, "stroke-linejoin": "round" }, f);
  E("circle", { cx, cy: 690, r: 46, fill: col, stroke: TX, "stroke-width": 7 }, f);
  return f;
}

// ======================= ESCENA 4 · dos salas: la del vídeo gracioso y la del vídeo sin gracia
S[4] = {
  bloques: [
    { x: 50, y: 960, w: 480, h: 180, size: 72, al: "center", txt: "Vídeo *gracioso*", en: () => W(4, "graciosos") - 0.4 },
    { x: 550, y: 960, w: 480, h: 180, size: 72, al: "center", txt: "Sin gracia", en: () => W(4, "sin") - 0.2 },
  ],
  build(g) {
    this.r = [0, 1].map(i => {
      const x0 = 50 + i * 500, cx = x0 + 240, o = { x0, cx };
      o.g = E("g", {}, g);
      o.sala = E("rect", { x: x0, y: 330, width: 480, height: 580, rx: 44, fill: PANEL, stroke: TX, "stroke-width": 8 }, o.g);
      E("rect", { x: x0 + 14, y: 840, width: 452, height: 56, rx: 24, fill: i ? GR : "#FFD27A", opacity: 0.8 }, o.g);
      // contador de calorías en la pared
      o.cont = E("g", {}, o.g);
      E("circle", { cx: x0 + 120, cy: 470, r: 82, fill: "#FFFFFF", stroke: TX, "stroke-width": 7 }, o.cont);
      E("path", { d: arco(x0 + 120, 470, 60, 190, 350), fill: "none", stroke: GR, "stroke-width": 12, "stroke-linecap": "round" }, o.cont);
      E("path", { d: arco(x0 + 120, 470, 60, 190, 235), fill: "none", stroke: ME, "stroke-width": 12, "stroke-linecap": "round" }, o.cont);
      E("path", { d: arco(x0 + 120, 470, 60, 305, 350), fill: "none", stroke: CO, "stroke-width": 12, "stroke-linecap": "round" }, o.cont);
      o.agu = E("line", { x1: x0 + 120, y1: 470, x2: x0 + 120, y2: 410, stroke: TX, "stroke-width": 9, "stroke-linecap": "round" }, o.cont);
      E("circle", { cx: x0 + 120, cy: 470, r: 13, fill: VI, stroke: TX, "stroke-width": 5 }, o.cont);
      // pantalla del vídeo
      o.pant = E("g", {}, o.g);
      E("rect", { x: x0 + 250, y: 400, width: 190, height: 130, rx: 20, fill: "#2B3552", stroke: TX, "stroke-width": 7 }, o.pant);
      o.sol = E("g", {}, o.pant);
      if (!i) {
        E("circle", { cx: x0 + 345, cy: 465, r: 36, fill: AM, stroke: TX, "stroke-width": 6 }, o.sol);
        o.ray = [];
        for (let k = 0; k < 8; k++) o.ray.push(E("line", { stroke: CO, "stroke-width": 8, "stroke-linecap": "round" }, o.sol));
      } else {
        o.lin = E("path", { fill: "none", stroke: GR, "stroke-width": 8, "stroke-linecap": "round" }, o.sol);
      }
      o.fig = [cx - 100, cx + 100].map((c, k) => fig(o.g, c, i ? CI : (k ? VI : ME)));
      o.rr = [];
      if (!i) o.fig.forEach((f, k) => { const a = []; for (let j = 0; j < 4; j++) a.push(E("path", { stroke: CO, "stroke-width": 8, "stroke-linecap": "round", fill: "none" }, f)); o.rr.push(a); });
      return o;
    });
  },
  paint(t, dur) {
    const tI = W(4, "investigadores"), tP = W(4, "parejas"), tS = W(4, "sala"), tC = W(4, "calorías"), tG = W(4, "graciosos"), tN = W(4, "sin");
    this.r.forEach((o, i) => {
      const pr = rebote(tramo(t, Math.min(tI, 1.2) - 0.5 + i * 0.12, Math.min(tI, 1.2) + 0.3 + i * 0.12));
      o.g.setAttribute("transform", `translate(${o.cx} 620) scale(${lerp(0.75, 1, pr)}) translate(${-o.cx} -620)`); op(o.g, pr);
      const fl = tramo(t, tS - 0.1, tS + 0.5);
      o.sala.setAttribute("stroke", mezcla(TX, HL, fl > 0 && fl < 1 ? Math.sin(Math.PI * fl) : 0));
      o.fig.forEach((f, k) => {
        const p = rebote(tramo(t, tP + k * 0.2 - 0.1, tP + k * 0.2 + 0.4));
        const ri = i ? 0 : tramo(t, tG, tG + 0.3);
        const sal = ri * Math.abs(Math.sin(t * 8 + k * 1.7)) * 26;
        const cab = i ? tramo(t, tN + 0.3, tN + 0.8) * 10 * Math.sin(t * 0.9 + k) : 0;
        f.setAttribute("transform", `translate(${cab} ${(1 - p) * 90 - sal})`); op(f, p);
        if (!i) o.rr[k].forEach((l, j) => {
          const a = (-150 + j * 40) * Math.PI / 180, cxx = o.cx + (k ? 100 : -100), r0 = 70, r1 = 70 + 26 * (0.6 + 0.4 * Math.sin(t * 12 + j + k));
          l.setAttribute("d", `M${cxx + r0 * Math.cos(a)} ${690 + r0 * Math.sin(a)} L${cxx + r1 * Math.cos(a)} ${690 + r1 * Math.sin(a)}`);
          l.style.opacity = ri;
        });
      });
      // contador: gira más deprisa con el vídeo gracioso, casi se para con el otro
      const tv = i ? tN : tG, v0 = 1.1, v1 = i ? 0.25 : 11;
      const fase = v0 * t + (v1 - v0) * Math.max(0, t - tv) * suave(tramo(t, tv, tv + 0.4));
      const pc = rebote(tramo(t, tC - 0.5, tC + 0.2));
      o.cont.setAttribute("transform", `translate(${o.x0 + 120} 470) scale(${pc}) translate(${-o.x0 - 120} -470)`); op(o.cont, pc);
      o.agu.setAttribute("transform", `rotate(${-90 + 0 + 65 * Math.sin(fase)} ${o.x0 + 120} 470) rotate(0)`);
      // pantalla
      const ps = tramo(t, i ? tN - 0.2 : tG - 0.3, i ? tN + 0.3 : tG + 0.2);
      o.sol.style.opacity = ps;
      if (!i) {
        o.sol.setAttribute("transform", `translate(${o.x0 + 345} 465) scale(${lerp(0.4, 1, rebote(ps)) * (1 + 0.08 * Math.sin(t * 16))}) translate(${-o.x0 - 345} -465)`);
        o.ray.forEach((l, k) => { const a = (k * 45 + t * 60) * Math.PI / 180; l.setAttribute("x1", o.x0 + 345 + 46 * Math.cos(a)); l.setAttribute("y1", 465 + 46 * Math.sin(a)); l.setAttribute("x2", o.x0 + 345 + 62 * Math.cos(a)); l.setAttribute("y2", 465 + 62 * Math.sin(a)); });
      } else {
        let d = ""; for (let k = 0; k <= 12; k++) d += (k ? "L" : "M") + (o.x0 + 275 + k * 12.5) + " " + (465 + 3 * Math.sin(t * 1.5 + k * 0.5));
        o.lin.setAttribute("d", d);
      }
    });
  },
};

// ======================= ESCENA 5 · el contador sube poquito; la balanza se inclina hacia la croqueta
S[5] = {
  bloques: [
    { x: 70, y: 1010, w: 940, h: 230, size: 200, al: "center", txt: "2-10", en: () => W(5, "entre") - 0.3 },
    { x: 70, y: 1250, w: 940, h: 170, size: 140, al: "center", txt: "*calorías*", en: () => W(5, "calorías") - 0.3 },
    { x: 70, y: 1440, w: 940, h: 80, size: 54, al: "center", col: SUB, txt: "con 10-15 minutos al día", en: () => W(5, "minutos") - 0.2 },
  ],
  build(g) {
    const r = this.r = {};
    const cx = 300, cy = 720;
    r.gau = E("g", {}, g);
    E("path", { d: arco(cx, cy, 190, 180, 360), fill: "none", stroke: TX, "stroke-width": 62, "stroke-linecap": "round" }, r.gau);
    E("path", { d: arco(cx, cy, 190, 180, 360), fill: "none", stroke: "#FFF9EA", "stroke-width": 46, "stroke-linecap": "round" }, r.gau);
    E("path", { d: arco(cx, cy, 190, 180, 252), fill: "none", stroke: ME, "stroke-width": 46, "stroke-linecap": "round" }, r.gau);
    r.zona = E("path", { d: arco(cx, cy, 190, 205, 245), fill: "none", stroke: CO, "stroke-width": 46, "stroke-linecap": "round" }, r.gau);
    r.marca = E("line", { x1: cx - 215, x2: cx - 150, stroke: TX, "stroke-width": 7, "stroke-dasharray": "14 12", "stroke-linecap": "round" }, r.gau);
    r.agu = E("line", { x1: cx, y1: cy, x2: cx - 165, y2: cy, stroke: TX, "stroke-width": 14, "stroke-linecap": "round" }, r.gau);
    E("circle", { cx, cy, r: 26, fill: VI, stroke: TX, "stroke-width": 7 }, r.gau);
    E("rect", { x: cx - 120, y: cy + 50, width: 240, height: 70, rx: 30, fill: PANEL, stroke: TX, "stroke-width": 7 }, r.gau);
    r.ldg = E("g", {}, r.gau);
    for (let k = 0; k < 5; k++) E("circle", { cx: cx - 80 + k * 40, cy: cy + 85, r: 11, fill: k < 3 ? CO : GR }, r.ldg).setAttribute("data-k", k);
    r.leds = [...r.ldg.children];
    // balanza
    const bx = 790, by = 740;
    r.bal = E("g", {}, g);
    E("path", { d: `M${bx - 60} 880 L${bx} ${by + 20} L${bx + 60} 880 Z`, fill: VI, stroke: TX, "stroke-width": 7, "stroke-linejoin": "round" }, r.bal);
    E("rect", { x: bx - 100, y: 870, width: 200, height: 30, rx: 14, fill: VI, stroke: TX, "stroke-width": 7 }, r.bal);
    r.viga = E("rect", { x: bx - 190, y: by - 12, width: 380, height: 24, rx: 12, fill: AM, stroke: TX, "stroke-width": 7 }, r.bal);
    r.pl = [0, 1].map(i => {
      const p = E("g", {}, r.bal);
      E("line", { x1: -60, y1: 0, x2: 0, y2: 0, stroke: TX, "stroke-width": 0 }, p);
      E("path", { d: "M-70 0 L0 -70 L70 0", fill: "none", stroke: TX, "stroke-width": 6, "stroke-linejoin": "round" }, p);
      E("rect", { x: -80, y: 0, width: 160, height: 18, rx: 9, fill: ME, stroke: TX, "stroke-width": 7 }, p);
      if (!i) { // una gota de caloría, diminuta
        E("path", { d: "M0 -50 Q-22 -22 0 -4 Q22 -22 0 -50 Z", fill: CO, stroke: TX, "stroke-width": 6, "stroke-linejoin": "round" }, p);
      } else { // la croqueta
        E("rect", { x: -48, y: -62, width: 96, height: 62, rx: 30, fill: "#E8943A", stroke: TX, "stroke-width": 7 }, p);
        E("path", { d: "M-28 -40 q10 -12 22 -4 M4 -24 q12 -10 22 -2", fill: "none", stroke: "#FFD27A", "stroke-width": 7, "stroke-linecap": "round" }, p);
      }
      return p;
    });
  },
  paint(t, dur) {
    const r = this.r, cx = 300, cy = 720;
    const tR = W(5, "gastaba"), tM = W(5, "más"), tQ = W(5, "que"), tPe = W(5, "Pero"), tE = W(5, "entre"), tD = W(5, "dos"), tC = W(5, "calorías");
    const pg = rebote(tramo(t, 0.05, 0.6));
    r.gau.setAttribute("transform", `translate(${cx} ${cy}) scale(${pg}) translate(${-cx} ${-cy})`); op(r.gau, pg);
    // la aguja sube un poco de "gastaba", un poco más en "más", y se queda ahí
    const nivel = 0.05 * Math.sin(t * 1.2) + 0.12 * suave(tramo(t, tR, tR + 0.6)) + 0.14 * suave(tramo(t, tM - 0.1, tM + 0.5)) + 0.1 * suave(tramo(t, tPe, tC)) + 0.02 * Math.sin(t * 7) * tramo(t, tR, tR + 0.5);
    const ang = 180 + 180 * (0.04 + nivel);
    r.agu.setAttribute("x2", cx + 165 * Math.cos(ang * Math.PI / 180)); r.agu.setAttribute("y2", cy + 165 * Math.sin(ang * Math.PI / 180));
    // línea de puntos: lo que marca "no reírse"
    const ym = cy - 215 * 0 ; const lv = 180 + 180 * 0.17;
    r.marca.setAttribute("y1", cy + 190 * Math.sin(lv * Math.PI / 180)); r.marca.setAttribute("y2", cy + 150 * Math.sin(lv * Math.PI / 180));
    r.marca.setAttribute("x1", cx + 215 * Math.cos(lv * Math.PI / 180)); r.marca.setAttribute("x2", cx + 140 * Math.cos(lv * Math.PI / 180));
    r.marca.style.opacity = tramo(t, tQ, tQ + 0.3);
    // la zona de "entre dos y diez" se enciende
    const pz = tramo(t, tE, tE + 0.3);
    r.zona.style.opacity = pz * (0.75 + 0.25 * Math.sin(t * 8));
    r.leds.forEach((l, k) => l.setAttribute("r", 11 + 4 * Math.sin(t * 5 + k) * pz));
    // balanza
    const pb = rebote(tramo(t, tPe - 0.4, tPe + 0.3));
    r.bal.setAttribute("transform", `translate(790 880) scale(${pb}) translate(-790 -880)`); op(r.bal, pb);
    const inc = rebote(tramo(t, tC - 0.1, tC + 0.6));
    const th = (14 * inc + 1.2 * Math.sin(t * 2.2) * (1 - inc)) * Math.PI / 180;
    r.viga.setAttribute("transform", `rotate(${th * 180 / Math.PI} 790 740)`);
    r.pl.forEach((p, i) => {
      const s = i ? 1 : -1, ex = 790 + s * 190 * Math.cos(th), ey = 740 + s * 190 * Math.sin(th);
      const it = rebote(tramo(t, (i ? W(5, "diez", 2) : tD) - 0.2, (i ? W(5, "diez", 2) : tD) + 0.4));
      p.setAttribute("transform", `translate(${ex} ${ey + 72})`);
      p.style.opacity = it;
      p.lastChild.setAttribute("transform", "scale(1)");
      for (const c of p.children) if (c.tagName === "path" && c.getAttribute("fill") !== "none" || c.tagName === "rect" && c.getAttribute("rx") === "30") c.setAttribute("transform", `translate(0 ${(1 - it) * -40}) scale(${lerp(0.5, 1, it)})`);
    });
  },
};
