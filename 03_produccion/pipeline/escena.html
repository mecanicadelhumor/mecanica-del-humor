<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mecánica del Humor — motor de escenas</title>
<style>
  /* ============ SISTEMA DE DISEÑO — Mecánica del Humor ============ */
  :root{
    --fondo:#0B1220; --reticula:#16213A; --tinta:#F2F4F8; --tenue:#8A97AE;
    --ambar:#FFB020; --cian:#4CC9F0; --coral:#EF476F;
    --W:1920px; --H:1080px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--fondo)}
  body{
    font-family:"Archivo Black","Inter","DejaVu Sans",sans-serif;
    color:var(--tinta);
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"JetBrains Mono","IBM Plex Mono","DejaVu Sans Mono",monospace}

  /* retícula de plano técnico */
  #reticula{
    position:absolute;inset:0;
    background-image:
      linear-gradient(var(--reticula) 1px,transparent 1px),
      linear-gradient(90deg,var(--reticula) 1px,transparent 1px);
    background-size:80px 80px;
    opacity:.55;
  }
  #vineta{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(0,0,0,.55) 100%);
  }
  #marco{
    position:absolute;inset:56px;border:1px solid rgba(242,244,248,.10);
    pointer-events:none;
  }
  #marco::before,#marco::after{
    content:"";position:absolute;width:22px;height:22px;
    border:2px solid rgba(255,176,32,.45);
  }
  #marco::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
  #marco::after{bottom:-1px;right:-1px;border-left:0;border-top:0}

  #escena{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:150px 180px}
  .caja{width:100%;max-width:1500px}

  /* --- marca de agua / firma --- */
  #firma{
    position:absolute;left:70px;bottom:52px;
    font-size:20px;letter-spacing:.22em;color:var(--tenue);text-transform:uppercase;
  }
  #ref{
    position:absolute;right:70px;bottom:52px;
    font-size:20px;color:var(--tenue);
  }

  /* --- unidades animables --- */
  .u{opacity:0;transform:translateY(26px);will-change:opacity,transform}

  /* --- tipos de escena --- */
  h1{font-size:118px;line-height:1.02;letter-spacing:-.02em}
  h2{font-size:78px;line-height:1.08;letter-spacing:-.015em}
  .sub{font-size:40px;line-height:1.35;color:var(--tenue);font-family:"Inter","DejaVu Sans",sans-serif;font-weight:400;margin-top:34px}
  .amb{color:var(--ambar)}
  .cia{color:var(--cian)}
  .cor{color:var(--coral)}

  .cifra{font-size:280px;line-height:.9;letter-spacing:-.04em;color:var(--ambar)}
  .cifra-pie{font-size:44px;color:var(--tinta);margin-top:28px;font-family:"Inter","DejaVu Sans",sans-serif;font-weight:400;line-height:1.3}

  .enunciado{font-size:72px;line-height:1.22;font-family:"Inter","DejaVu Sans",sans-serif;font-weight:800;letter-spacing:-.015em}

  /* V2 — variantes de composición para «enunciado».
     Es la mitad de las escenas de cada episodio y siempre se veía igual: un
     bloque de texto centrado. Lo que rota no es el texto: es dónde se apoya.
     La variante la fija el número de escena (d.n), no el azar — mismo guion,
     mismo encuadre, mismo píxel. Coste de render cero: sigue habiendo una
     sola unidad animable, así que render.py captura exactamente lo mismo.

     La tercera variante ancla ARRIBA, no abajo. El backlog proponía «a pie de
     pantalla», pero la banda inferior está reservada: los subtítulos quemados
     van en alineación 1 (abajo-izquierda) con MarginV 96 y cuerpo 58, o sea
     de ~900px hacia abajo. Un enunciado apoyado en el suelo se les montaría
     encima en cuanto los subtítulos vuelvan. Despejar la mitad inferior rompe
     la monotonía igual de bien y además les deja el sitio libre. */
  .caja.enun-1{max-width:1120px;margin-right:auto}      /* a la izquierda, aire a la derecha */
  .caja.enun-2{align-self:flex-start;max-width:1400px}  /* alta, mitad inferior despejada */

  ul.lista{list-style:none;font-family:"Inter","DejaVu Sans",sans-serif}
  ul.lista li{
    font-size:56px;line-height:1.25;margin:0 0 42px;padding-left:96px;position:relative;font-weight:600;
  }
  ul.lista li .n{
    position:absolute;left:0;top:6px;width:60px;height:60px;border:2px solid var(--ambar);
    color:var(--ambar);font-size:28px;display:flex;align-items:center;justify-content:center;
    font-family:"JetBrains Mono","DejaVu Sans Mono",monospace;
  }

  blockquote{font-size:64px;line-height:1.28;font-family:"Inter","DejaVu Sans",sans-serif;font-style:italic;font-weight:500}
  /* Las comillas de la cita las pone el CSS, así que tienen que cambiar con el
     idioma del guion: angulares en español, inglesas en el canal inglés. El
     idioma lo fija cargar() sobre <html lang>, igual que la firma de marca.
     Sin esto, «Humor Mechanics» sacaba citas con comillas españolas. */
  blockquote::before{content:"«";color:var(--ambar);margin-right:8px}
  blockquote::after{content:"»";color:var(--ambar);margin-left:8px}
  html[lang="en"] blockquote::before{content:"\201C"}
  html[lang="en"] blockquote::after{content:"\201D"}
  .autor{font-size:34px;color:var(--tenue);margin-top:40px;font-family:"JetBrains Mono","DejaVu Sans Mono",monospace}

  .dos{display:grid;grid-template-columns:1fr 120px 1fr;align-items:center;gap:0}
  .panel{border:2px solid rgba(242,244,248,.14);padding:56px 48px;min-height:420px;display:flex;flex-direction:column;justify-content:center}
  .panel .et{font-size:26px;letter-spacing:.2em;text-transform:uppercase;color:var(--tenue);margin-bottom:26px;font-family:"JetBrains Mono","DejaVu Sans Mono",monospace}
  .panel .tx{font-size:46px;line-height:1.25;font-family:"Inter","DejaVu Sans",sans-serif;font-weight:600}
  .panel.ok{border-color:rgba(255,176,32,.55)}
  .panel.ko{border-color:rgba(239,71,111,.45)}
  .vs{font-size:34px;color:var(--tenue);text-align:center;font-family:"JetBrains Mono","DejaVu Sans Mono",monospace}

  .fig{width:100%;display:block;margin:0 auto;max-height:660px;object-fit:contain}
  .pie{font-size:30px;color:var(--tenue);text-align:center;margin-top:34px;font-family:"Inter","DejaVu Sans",sans-serif}

  .etiqueta{
    display:inline-block;font-size:24px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--ambar);border:1px solid rgba(255,176,32,.5);padding:10px 20px;margin-bottom:40px;
    font-family:"JetBrains Mono","DejaVu Sans Mono",monospace;
  }

  /* motivo de marca: engranaje técnico en la esquina, fijo y discreto en
     TODAS las escenas — refuerza "mecánica" sin depender del contenido de
     cada guion y sin animarse (nada que capturar de más en render.py). */
  #engranaje{position:absolute;right:64px;bottom:132px;opacity:.15;pointer-events:none}
</style>
</head>
<body>
<div id="reticula"></div>
<div id="vineta"></div>
<div id="escena"></div>
<div id="marco"></div>
<svg id="engranaje" viewBox="0 0 120 120" width="104" height="104">
  <g fill="none" stroke="#FFB020" stroke-width="4">
    <circle cx="60" cy="60" r="34"/>
    <circle cx="60" cy="60" r="13"/>
    <g id="dientes" stroke-width="9"></g>
  </g>
</svg>
<div id="firma">Mecánica del Humor</div>
<div id="ref" class="mono"></div>

<script>
// ===================================================================
// Motor de escenas. Playwright llama a cargar(datos) y luego a
// pintar(t) para cada fotograma. Nada es aleatorio: mismo t, mismo
// resultado, siempre.
// ===================================================================
let UNIDADES = [];
let DUR = 5;

function esc(s){ return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// permite resaltar con *asterisco* -> ámbar y _guion bajo_ -> cian
function rico(s){
  return esc(s)
    .replace(/\*([^*]+)\*/g,'<span class="amb">$1</span>')
    .replace(/_([^_]+)_/g,'<span class="cia">$1</span>');
}

const PLANTILLAS = {
  titulo(d){
    return `<div class="caja">
      ${d.etiqueta?`<div class="u etiqueta">${esc(d.etiqueta)}</div>`:""}
      <h1 class="u">${rico(d.titulo)}</h1>
      ${d.subtitulo?`<div class="u sub">${rico(d.subtitulo)}</div>`:""}
    </div>`;
  },
  dato(d){
    return `<div class="caja" style="text-align:center">
      <div class="u cifra" data-cuenta="${esc(d.cifra)}">${rico(d.cifra)}</div>
      <div class="u cifra-pie">${rico(d.pie)}</div>
    </div>`;
  },
  enunciado(d){
    // La composición rota con el número de escena. Sin d.n (llamadas sueltas
    // desde una consola) cae en la variante centrada de siempre.
    const v = ((Number(d.n) || 0) % 3 + 3) % 3;
    return `<div class="caja enun-${v}"><div class="u enunciado">${rico(d.texto)}</div></div>`;
  },
  lista(d){
    const li = d.puntos.map((p,i)=>
      `<li class="u"><span class="n">${String(i+1).padStart(2,"0")}</span>${rico(p)}</li>`).join("");
    return `<div class="caja">
      ${d.titulo?`<h2 class="u" style="margin-bottom:64px">${rico(d.titulo)}</h2>`:""}
      <ul class="lista">${li}</ul></div>`;
  },
  cita(d){
    return `<div class="caja">
      <blockquote class="u">${rico(d.texto)}</blockquote>
      <div class="u autor">— ${esc(d.autor)}</div></div>`;
  },
  comparacion(d){
    return `<div class="caja">
      ${d.titulo?`<h2 class="u" style="margin-bottom:60px;text-align:center">${rico(d.titulo)}</h2>`:""}
      <div class="dos">
        <div class="u panel ko"><div class="et">${rico(d.et_a||"Sin esto")}</div><div class="tx">${rico(d.a)}</div></div>
        <div class="u vs">VS</div>
        <div class="u panel ok"><div class="et">${rico(d.et_b||"Con esto")}</div><div class="tx">${rico(d.b)}</div></div>
      </div></div>`;
  },
  figura(d){
    // El titular va como en «lista» y «comparacion»: una gráfica sin enunciado
    // obliga al espectador a deducir qué está mirando.
    return `<div class="caja" style="text-align:center">
      ${d.titulo?`<h2 class="u" style="margin-bottom:36px">${rico(d.titulo)}</h2>`:""}
      <img class="u fig" src="${esc(d.imagen)}">
      ${d.pie?`<div class="u pie">${rico(d.pie)}</div>`:""}</div>`;
  },
  diagrama(d){
    // mecanismo del chiste: cajas encadenadas por flechas
    const cajas = d.pasos.map((p,i)=>{
      const x = 40 + i*(1840/d.pasos.length);
      const w = (1840/d.pasos.length) - 80;
      return `<g class="u">
        <rect x="${x}" y="140" width="${w}" height="260" fill="none"
              stroke="${i===d.pasos.length-1?'#FFB020':'#4CC9F0'}" stroke-width="3"/>
        <text x="${x+w/2}" y="252" text-anchor="middle" fill="#F2F4F8"
              font-size="46" font-family="Inter,sans-serif" font-weight="700">${esc(p.titulo)}</text>
        <text x="${x+w/2}" y="312" text-anchor="middle" fill="#8A97AE"
              font-size="32" font-family="Inter,sans-serif">${esc(p.pie||"")}</text>
      </g>` + (i<d.pasos.length-1 ? `<g class="u">
        <line x1="${x+w+10}" y1="270" x2="${x+w+66}" y2="270" stroke="#8A97AE" stroke-width="4"/>
        <polygon points="${x+w+72},270 ${x+w+56},260 ${x+w+56},280" fill="#8A97AE"/></g>`:"");
    }).join("");
    return `<div class="caja">
      ${d.titulo?`<h2 class="u" style="margin-bottom:40px">${rico(d.titulo)}</h2>`:""}
      <svg viewBox="0 0 1920 480" width="100%" style="margin-left:-40px;width:calc(100% + 80px)">${cajas}</svg></div>`;
  },
  cierre(d){
    return `<div class="caja" style="text-align:center">
      <h2 class="u">${rico(d.titulo)}</h2>
      ${d.subtitulo?`<div class="u sub">${rico(d.subtitulo)}</div>`:""}
    </div>`;
  }
};

function cargar(d){
  DUR = d.duracion_s || 5;
  const f = PLANTILLAS[d.tipo] || PLANTILLAS.enunciado;
  document.getElementById("escena").innerHTML = f(d);
  document.getElementById("ref").textContent = d.ref || "";
  // La marca la manda render.py según el idioma del guion (Mecánica del Humor
  // / Humor Mechanics), así el mismo motor sirve para los dos canales.
  if (d.marca) document.getElementById("firma").textContent = d.marca;
  if (d.idioma) document.documentElement.lang = d.idioma;
  UNIDADES = Array.from(document.querySelectorAll(".u"));
  pintar(0);
  return UNIDADES.length;
}

// suavizado (ease-out cúbico)
function suave(x){ x = Math.max(0,Math.min(1,x)); return 1-Math.pow(1-x,3); }

// Cuenta desde 0 hasta el número con el que empieza el texto, con "p" (0-1,
// ya suavizado con la misma curva de entrada que el resto de la escena) como
// fracción de avance. "50 años" -> cuenta 0..50 y deja " años" fijo detrás.
// Si el texto no empieza por un número, se devuelve tal cual, sin animar.
function contar(texto, p){
  const m = String(texto).match(/^(\d+(?:[.,]\d+)?)(.*)$/);
  if (!m) return rico(texto);
  const objetivo = parseFloat(m[1].replace(",", "."));
  const decimales = (m[1].split(/[.,]/)[1] || "").length;
  const actual = objetivo * p;
  const numTxt = decimales ? actual.toFixed(decimales) : String(Math.round(actual));
  return rico(numTxt + m[2]);
}

function pintar(t){
  const escalonado = 0.16;              // desfase entre unidades, en segundos
  const entrada    = 0.55;              // lo que tarda cada unidad en entrar
  const salida_ini = Math.max(DUR-0.45, entrada);
  UNIDADES.forEach((el,i)=>{
    const t0 = i*escalonado;
    let p = suave((t - t0) / entrada);
    let fuera = t > salida_ini ? suave((t - salida_ini)/0.45) : 0;
    const op = Math.max(0, p * (1 - fuera));
    const dy = (1-p)*26 - fuera*14;
    el.style.opacity = op.toFixed(4);
    el.style.transform = `translateY(${dy.toFixed(2)}px)`;
    if (el.dataset.cuenta) el.innerHTML = contar(el.dataset.cuenta, p);
  });
  // La retícula ya NO deriva: el barrido arriba/derecha/abajo/izquierda mareaba
  // (feedback del 18/08). El plano vivo lo aporta ahora solo la respiración de
  // zoom que aplica montaje.py sobre el vídeo ya renderizado, más los
  // subtítulos quemados palabra a palabra durante el tramo estático.
  // Nota de diseño: el tramo central de cada escena es deliberadamente estático.
  // Así el render captura ~2.000 fotogramas en vez de 13.000.
}

// Dibuja los dientes del engranaje de marca una sola vez (elemento estático,
// no forma parte de UNIDADES ni de pintar(t): cero coste de captura extra).
(function dibujarEngranaje(){
  const cont = document.getElementById("dientes");
  const N = 10, cx = 60, cy = 60, r1 = 30, r2 = 45;
  for (let i = 0; i < N; i++){
    const ang = (i / N) * 2 * Math.PI;
    const linea = document.createElementNS("http://www.w3.org/2000/svg", "line");
    linea.setAttribute("x1", (cx + r1 * Math.cos(ang)).toFixed(2));
    linea.setAttribute("y1", (cy + r1 * Math.sin(ang)).toFixed(2));
    linea.setAttribute("x2", (cx + r2 * Math.cos(ang)).toFixed(2));
    linea.setAttribute("y2", (cy + r2 * Math.sin(ang)).toFixed(2));
    cont.appendChild(linea);
  }
})();

window.cargar = cargar;
window.pintar = pintar;
</script>
</body>
</html>
