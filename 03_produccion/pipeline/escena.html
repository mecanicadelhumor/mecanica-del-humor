<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mecánica del Humor — motor de escenas</title>
<style>
  /* ============ SISTEMA DE DISEÑO — Mecánica del Humor ============ */
  :root{
    --fondo:#0B1220; --reticula:#16213A; --tinta:#F2F4F8; --tenue:#8A97AE;
    --ambar:#FFB020; --cian:#4CC9F0; --coral:#EF476F;
    --W:1920px; --H:1080px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:var(--W);height:var(--H);overflow:hidden;background:var(--fondo)}
  body{
    font-family:"Archivo Black","Inter","DejaVu Sans",sans-serif;
    color:var(--tinta);
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"JetBrains Mono","IBM Plex Mono","DejaVu Sans Mono",monospace}

  /* retícula de plano técnico */
  #reticula{
    position:absolute;inset:0;
    background-image:
      linear-gradient(var(--reticula) 1px,transparent 1px),
      linear-gradient(90deg,var(--reticula) 1px,transparent 1px);
    background-size:80px 80px;
    opacity:.55;
  }
  #vineta{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(0,0,0,.55) 100%);
  }
  /* En vertical la elipse de la viñeta se estira sobre 1920 px de alto y deja
     los extremos casi negros. Se abre el centro y se baja la intensidad. */
  html[data-fmt="v"] #vineta{
    background:radial-gradient(ellipse 90% 55% at 50% 42%,transparent 55%,rgba(0,0,0,.5) 100%);
  }
  #marco{
    position:absolute;inset:56px;border:1px solid rgba(242,244,248,.10);
    pointer-events:none;
  }
  #marco::before,#marco::after{
    content:"";position:absolute;width:22px;height:22px;
    border:2px solid rgba(255,176,32,.45);
  }
  #marco::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
  #marco::after{bottom:-1px;right:-1px;border-left:0;border-top:0}

  #escena{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:150px 180px}
  .caja{width:100%;max-width:1500px}

  /* --- marca de agua / firma --- */
  #firma{
    position:absolute;left:70px;bottom:52px;
    font-size:20px;letter-spacing:.22em;color:var(--tenue);text-transform:uppercase;
  }
  #ref{
    position:absolute;right:70px;bottom:52px;
    font-size:20px;color:var(--tenue);
  }

  /* --- unidades animables --- */
  .u{opacity:0;transform:translateY(26px);will-change:opacity,transform}

  /* --- tipos de escena --- */
  h1{font-size:118px;line-height:1.02;letter-spacing:-.02em}
  h2{font-size:78px;line-height:1.08;letter-spacing:-.015em}
  .sub{font-size:40px;line-height:1.35;color:var(--tenue);font-family:"Inter","DejaVu Sans",sans-serif;font-weight:400;margin-top:34px}
  .amb{color:var(--ambar)}
  .cia{color:var(--cian)}
  .cor{color:var(--coral)}

  .cifra{font-size:280px;line-height:.9;letter-spacing:-.04em;color:var(--ambar)}
  .cifra-pie{font-size:44px;color:var(--tinta);margin-top:28px;font-family:"Inter","DejaVu Sans",sans-serif;font-weight:400;line-height:1.3}

  .enunciado{font-size:72px;line-height:1.22;font-family:"Inter","DejaVu Sans",sans-serif;font-weight:800;letter-spacing:-.015em}

  /* --- C19+C16 · el icono, 07/09 -------------------------------------
     El campo «icono» (esquema_guion.json) admite cualquiera de los ocho
     dibujos de 02_marca/iconos.svg (definidos más abajo, embebidos igual
     que el personaje: sin red, sin dependencia externa). Se dibuja SOLO
     con stroke-dasharray/dashoffset — ver dibujarIcono() — reusando la
     misma «p» de entrada que ya calcula pintar() para cada unidad, así
     que el trazo termina de dibujarse a los ~0,55-0,6s de entrar la
     escena, determinista y sin capturas de más (misma unidad, mismo
     escalonado que el resto). Pensado sobre todo para que la escena 1 de
     un Short deje de ser una tarjeta de texto: icono + poca letra + el
     personaje entrando después. */
  .icono{display:block;width:230px;height:230px;margin:0 auto 44px}
  html[data-fmt="v"] body.txt-xs .icono,
  html[data-fmt="v"] body.txt-s  .icono{width:260px;height:260px;margin:0 auto 52px}

  /* Los mismos estilos de trazo que 02_marca/iconos.svg — copiados, no
     enlazados (ver la nota en iconoHTML() sobre por qué es una copia y no
     un <use>). */
  .icono .ic{fill:none;stroke:var(--tinta);stroke-width:3.2;
      stroke-linecap:round;stroke-linejoin:round}
  .icono .ic-am{stroke:var(--ambar)}
  .icono .ic-ci{stroke:var(--cian)}
  .icono .ic-co{stroke:var(--coral)}
  .icono .ic-te{stroke:var(--tenue);stroke-width:1.8}
  .icono .ic-f{fill:var(--ambar);stroke:none;opacity:0}
  .icono .ic-guia{stroke:var(--tenue);stroke-width:1.4}

  /* V2 — variantes de composición para «enunciado».
     Es la mitad de las escenas de cada episodio y siempre se veía igual: un
     bloque de texto centrado. Lo que rota no es el texto: es dónde se apoya.
     La variante la fija el número de escena (d.n), no el azar — mismo guion,
     mismo encuadre, mismo píxel. Coste de render cero: sigue habiendo una
     sola unidad animable, así que render.py captura exactamente lo mismo.

     La tercera variante ancla ARRIBA, no abajo. El backlog proponía «a pie de
     pantalla», pero la banda inferior está reservada: los subtítulos quemados
     van en alineación 1 (abajo-izquierda) con MarginV 96 y cuerpo 58, o sea
     de ~900px hacia abajo. Un enunciado apoyado en el suelo se les montaría
     encima en cuanto los subtítulos vuelvan. Despejar la mitad inferior rompe
     la monotonía igual de bien y además les deja el sitio libre. */
  .caja.enun-1{max-width:1120px;margin-right:auto}      /* a la izquierda, aire a la derecha */
  .caja.enun-2{align-self:flex-start;max-width:1400px}  /* alta, mitad inferior despejada */

  ul.lista{list-style:none;font-family:"Inter","DejaVu Sans",sans-serif}
  ul.lista li{
    font-size:56px;line-height:1.25;margin:0 0 42px;padding-left:96px;position:relative;font-weight:600;
  }
  ul.lista li .n{
    position:absolute;left:0;top:6px;width:60px;height:60px;border:2px solid var(--ambar);
    color:var(--ambar);font-size:28px;display:flex;align-items:center;justify-content:center;
    font-family:"JetBrains Mono","DejaVu Sans Mono",monospace;
  }

  blockquote{font-size:64px;line-height:1.28;font-family:"Inter","DejaVu Sans",sans-serif;font-style:italic;font-weight:500}
  /* Las comillas de la cita las pone el CSS, así que tienen que cambiar con el
     idioma del guion: angulares en español, inglesas en el canal inglés. El
     idioma lo fija cargar() sobre <html lang>, igual que la firma de marca.
     Sin esto, «Humor Mechanics» sacaba citas con comillas españolas. */
  blockquote::before{content:"«";color:var(--ambar);margin-right:8px}
  blockquote::after{content:"»";color:var(--ambar);margin-left:8px}
  html[lang="en"] blockquote::before{content:"\201C"}
  html[lang="en"] blockquote::after{content:"\201D"}
  .autor{font-size:34px;color:var(--tenue);margin-top:40px;font-family:"JetBrains Mono","DejaVu Sans Mono",monospace}

  .dos{display:grid;grid-template-columns:1fr 120px 1fr;align-items:center;gap:0}
  .panel{border:2px solid rgba(242,244,248,.14);padding:56px 48px;min-height:420px;display:flex;flex-direction:column;justify-content:center}
  .panel .et{font-size:26px;letter-spacing:.2em;text-transform:uppercase;color:var(--tenue);margin-bottom:26px;font-family:"JetBrains Mono","DejaVu Sans Mono",monospace}
  .panel .tx{font-size:46px;line-height:1.25;font-family:"Inter","DejaVu Sans",sans-serif;font-weight:600}
  .panel.ok{border-color:rgba(255,176,32,.55)}
  .panel.ko{border-color:rgba(239,71,111,.45)}
  .vs{font-size:34px;color:var(--tenue);text-align:center;font-family:"JetBrains Mono","DejaVu Sans Mono",monospace}

  .fig{width:100%;display:block;margin:0 auto;max-height:660px;object-fit:contain}
  .pie{font-size:30px;color:var(--tenue);text-align:center;margin-top:34px;font-family:"Inter","DejaVu Sans",sans-serif}

  /* P6 · «tres tamaños, no uno» (09/09). «etiqueta» y «pie» ya eran campos
     admisibles en CUALQUIER escena desde esquema_guion.json (no son nuevos),
     pero hasta hoy solo se dibujaban en algunas plantillas: «etiqueta»
     únicamente en «titulo»/«enunciado», «pie» únicamente en «dato» (como
     .cifra-pie) y «figura» (como .pie). Sin ellos, la mayoría de escenas —
     sobre todo «enunciado», el 72% de un Short— eran un solo bloque de un
     tamaño, no la jerarquía antetítulo-pequeño/palabra-enorme/pie-pequeño
     que pide el encargo. Hoy se cablea el mismo par de clases (ya
     existentes, sin tocar su CSS salvo el tamaño en vertical de abajo) en
     «dato», «enunciado», «cita» y «cierre»: si el guion no rellena el
     campo, no se añade nada al DOM y el coste de render sigue siendo cero. */
  .etiqueta{
    display:inline-block;font-size:24px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--ambar);border:1px solid rgba(255,176,32,.5);padding:10px 20px;margin-bottom:40px;
    font-family:"JetBrains Mono","DejaVu Sans Mono",monospace;
  }


  /* ================= FORMATO VERTICAL — Shorts 1080x1920 =================
     No es el diseño horizontal reescalado: es otra escala tipográfica. En
     horizontal el titular ocupa el 6 % del ancho; en vertical necesita el
     11 % o no se lee en un móvil a un palmo de la cara.

     Zonas seguras de YouTube Shorts, medidas sobre la interfaz real:
       · arriba  ~150 px  (título del Short al desplegarse)
       · abajo   ~400 px  (nombre de canal, descripción, sonido)
       · derecha ~190 px  (me gusta, comentarios, compartir, remezclar)
     Todo el contenido vive dentro de ese hueco. Lo comprueba validar_guion.py
     midiendo el alto de la caja, no confiando en el ojo. */
  html[data-fmt="v"]{--W:1080px; --H:1920px}
  html[data-fmt="v"] #reticula{background-size:64px 64px}
  html[data-fmt="v"] #marco{inset:44px}
  /* El contenido NO se centra en el alto: se apoya en el tercio superior. En
     un móvil el pulgar y la interfaz viven abajo, y el personaje ocupa la
     banda inferior. Centrarlo dejaba un vacío arriba y otro abajo. */
  html[data-fmt="v"] #escena{padding:300px 76px 700px;align-items:flex-start}
  html[data-fmt="v"] .caja{max-width:100%}
  /* Las tres variantes de composición de «enunciado» son horizontales: mueven
     el bloque a izquierda o arriba dentro de un lienzo ancho. En vertical no
     hay hueco lateral que aprovechar y el anclaje ya lo fija #escena, así que
     se neutralizan: el Short siempre apoya arriba. */
  html[data-fmt="v"] .caja.enun-1,
  html[data-fmt="v"] .caja.enun-2{max-width:100%;margin-right:0;align-self:auto}
  html[data-fmt="v"] h1{font-size:132px;line-height:1.0}
  html[data-fmt="v"] h2{font-size:88px}
  html[data-fmt="v"] .sub{font-size:44px;margin-top:30px}
  html[data-fmt="v"] .enunciado{font-size:100px;line-height:1.14}
  html[data-fmt="v"] .cifra{font-size:300px}
  html[data-fmt="v"] .cifra-pie{font-size:52px}
  html[data-fmt="v"] ul.lista li{font-size:72px;margin-bottom:56px;padding-left:112px}
  html[data-fmt="v"] ul.lista li .n{width:72px;height:72px;font-size:32px}
  html[data-fmt="v"] blockquote{font-size:70px}
  html[data-fmt="v"] .autor{font-size:38px}
  html[data-fmt="v"] .etiqueta{font-size:28px;margin-bottom:44px}
  html[data-fmt="v"] .fig{max-height:900px}
  /* P6 · «.pie» solo tenía tamaño pensado para el episodio largo (usada
     hasta hoy solo en «figura», tipo casi exclusivo de MDH-###): 30px se lee
     bien a 1920px de ancho pero queda enano junto al resto de pies de
     Short (.cifra-pie 52px, .autor 38px, .sub 44px). Mismo criterio de
     bulto que esos tres. */
  html[data-fmt="v"] .pie{font-size:40px;margin-top:30px}
  /* diagrama apilado (solo vertical) */
  .pila{display:flex;flex-direction:column;align-items:stretch}
  .pila .paso{border:2px solid rgba(76,201,240,.55);padding:30px 34px}
  .pila .paso.fin{border-color:rgba(255,176,32,.75)}
  .pila .pt{font-size:60px;line-height:1.14;font-weight:800;
            font-family:"Inter","DejaVu Sans",sans-serif}
  .pila .pp{font-size:36px;line-height:1.3;color:var(--tenue);margin-top:12px;
            font-family:"Inter","DejaVu Sans",sans-serif}
  .pila .flecha{font-size:46px;color:var(--tenue);text-align:center;
                line-height:1;margin:16px 0}
  /* la comparación se apila: dos paneles uno encima de otro, no lado a lado */
  html[data-fmt="v"] .dos{grid-template-columns:1fr;grid-template-rows:auto 90px auto;gap:0}
  html[data-fmt="v"] .panel{min-height:0;padding:44px 40px}
  html[data-fmt="v"] .panel .tx{font-size:54px}
  html[data-fmt="v"] .panel .et{font-size:28px}
  html[data-fmt="v"] .vs{font-size:38px;line-height:90px}
  html[data-fmt="v"] #firma{left:56px;bottom:auto;top:64px;font-size:24px}
  html[data-fmt="v"] #ref{right:56px;bottom:auto;top:64px;font-size:24px}
  html[data-fmt="v"] #engranaje{right:52px;bottom:470px}
  html[data-fmt="v"] #personaje{right:auto;left:50%;transform:translateX(-50%);
                                bottom:470px;width:300px;height:300px}


  /* ================= C15 · EL SHORT SE MUEVE =========================
     Hasta el 28/08 el tramo central de cada escena era UN fotograma
     estirado: el 85 % de un Short era una imagen congelada. El comentario
     de voz.py ya lo decía —«un vídeo sin subtítulos quemados se percibe
     como un pase de diapositivas»— y los subtítulos se retiraron el 20/08
     sin poner nada en su lugar. Esto es lo que va en su lugar.

     Nada de esto usa Math.random ni la hora: todo sale de pintar(t), así
     que mismo guion y mismo t siguen dando el mismo píxel (regla 11.5). */

  /* Barra de avance del Short. Ocupa el ancho entero, 8 px, y se llena a lo
     largo del vídeo COMPLETO, no de la escena: render.py pasa t_inicio y
     total_s. Es lo único que se mueve el 100 % del tiempo y cuesta cero. */
  #avance{position:absolute;left:0;top:0;height:10px;width:100%;
          background:rgba(242,244,248,.07);display:none}
  #avance i{display:block;height:100%;width:0;background:var(--ambar);
            box-shadow:0 0 18px rgba(255,176,32,.55)}
  html[data-fmt="v"] #avance{display:block}

  /* La palabra: unidad de revelado. El texto ya no aparece de golpe, llega
     a la velocidad a la que se lee. */
  .p{display:inline-block;will-change:opacity,transform}

  /* ---- Composicion vertical rehecha ----
     El hueco muerto de abajo era de 700 px de padding + un personaje de
     172 px flotando en medio de la nada. Zona segura real de Shorts:
     arriba 150 px, abajo 400 px, derecha 190 px. El contenido ahora ocupa
     de verdad la banda que queda, y el personaje se apoya en la esquina
     inferior izquierda —fuera de la columna de botones— con tamaño de
     personaje, no de marca de agua. */
  html[data-fmt="v"] #escena{padding:270px 76px 430px;align-items:center;
                             transform-origin:50% 46%;will-change:transform}
  /* Una frase de tres palabras a 100 px deja el 70 % del encuadre vacío. El
     cuerpo sube cuando hay poco texto y baja cuando hay mucho: lo decide el
     recuento de palabras en cargar(), no el ojo. */
  html[data-fmt="v"] body.txt-xs .enunciado{font-size:150px;line-height:1.06}
  html[data-fmt="v"] body.txt-xs h1{font-size:168px}
  html[data-fmt="v"] body.txt-xs h2{font-size:124px}
  html[data-fmt="v"] body.txt-s  .enunciado{font-size:122px;line-height:1.10}
  html[data-fmt="v"] body.txt-s  h1{font-size:146px}
  html[data-fmt="v"] body.txt-s  h2{font-size:104px}
  html[data-fmt="v"] #personaje{right:auto;left:64px;bottom:430px;
                                width:250px;height:250px;transform:none}
  html[data-fmt="v"] #engranaje{right:56px;bottom:452px}

  /* Encargo "el solape del pie con el personaje" (MDS-015 escena 3, ver
     05_calendario/revisiones/MDS-015.md). NO es un problema de tamaño de
     letra —eso ya lo corrige ajustarTamano()/C21.1— sino de reparto
     vertical: #escena centra su contenido en una caja que llega hasta
     abajo (padding-bottom:430px) sin saber que el personaje, cuando
     aparece, ocupa 250px más por encima de esa línea (bottom:430px,
     height:250px → su borde superior cae en 1920-430-250=1240px desde
     arriba). Un `.cifra-pie` o `.pie` que crece hacia abajo puede acabar
     exactamente donde ya está la cara.
     La corrección es geometría, no un umbral adivinado: cuando hay
     personaje, el bloque de texto reserva esos mismos 250px (más un
     margen de 40px de aire) para que, centrado, nunca pueda llegar más
     abajo que el borde superior del personaje. Determinista (regla
     11.5): mismo guion, mismo reparto siempre. */
  /* 07/09/2026 · de 720 a 790. Los 720 salían de una medición ESTÁTICA
     —el punto de reposo de la escena— y ahí el hueco entre el texto y la
     cara medía 48px, que parecía suficiente. Con la escena EN MOVIMIENTO el
     hueco real de MDS-011 escena 4 baja a 7px y el vídeo salió publicado con
     la cara pegada al pie. Dos cosas se comen esos 41px y ninguna se ve en un
     fotograma quieto:
       · el personaje entra desde 26px más abajo y sube (translateY del
         escalonado de entrada) y además respira ±5px, así que su borde
         superior llega hasta 1235 en vez de quedarse en 1240;
       · `#escena` crece un 2,2 % durante la escena (el zoom lento de C15) y
         eso empuja el borde inferior de `.caja` unos 20px hacia abajo.
     790 = 430 (bottom del personaje) + 250 (su alto) + 5 (respiración)
         + 40 (el aire que ya se quería) + 65 (lo que empuja el zoom, medido).
     Comprobado sobre las 49 escenas verticales con personaje del repositorio,
     21 instantes por escena: el peor hueco pasa de -34px a +2px (MDS-007
     esc.4, `lista` de tres puntos, ya publicada) y todos los guiones
     pendientes quedan por encima de 108px. MDS-011 esc.4 pasa de 7 a 43px.
     Y la lección, que vale para todo lo demás: medir una escena quieta miente
     cuando la escena se mueve. */
  html[data-fmt="v"] body.con-personaje #escena{padding-bottom:790px}

  /* Remate de marca: los ultimos ~1,4 s de la escena «cierre». El video ya
     no acaba en seco sobre una negacion. Ver C15.5. */
  #remate{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;
        flex-direction:column;align-items:center;justify-content:center;
        padding-bottom:300px;text-align:center;
          opacity:0;display:none;pointer-events:none}
  #remate .n{font-size:52px;letter-spacing:.14em;text-transform:uppercase;color:var(--ambar)}
  #remate .q{font-size:38px;color:var(--tenue);margin-top:18px;
             font-family:"Inter","DejaVu Sans",sans-serif}
  html[data-fmt="v"] body.con-remate #remate{display:flex}

  /* motivo de marca: engranaje técnico en la esquina, fijo y discreto en
     TODAS las escenas — refuerza "mecánica" sin depender del contenido de
     cada guion y sin animarse (nada que capturar de más en render.py). */
  #engranaje{position:absolute;right:64px;bottom:132px;opacity:.15;pointer-events:none}
  /* --- EL ENGRANAJE, el personaje. Ver 02_marca/personaje.svg ---------------
     Solo aparece si la escena trae "personaje". Cuando aparece, se apaga el
     engranaje decorativo de la esquina: dos engranajes en pantalla compiten y
     ninguno significa nada. Entra con las demás unidades animables (clase .u),
     así que su coste de captura es el de la entrada, que render.py ya graba.
     NO se anima durante el tramo central: eso multiplicaría las capturas. */
  #personaje{position:absolute;right:56px;bottom:118px;width:172px;height:172px;
             pointer-events:none;display:none}
  body.con-personaje #engranaje{display:none}
  body.con-personaje #personaje{display:block}

</style>
</head>
<body>
<div id="avance"><i></i></div>
<div id="reticula"></div>
<div id="vineta"></div>
<div id="escena"></div>
<div id="marco"></div>
<svg id="engranaje" viewBox="0 0 120 120" width="104" height="104">
  <g fill="none" stroke="#FFB020" stroke-width="4">
    <circle cx="60" cy="60" r="34"/>
    <circle cx="60" cy="60" r="13"/>
    <g id="dientes" stroke-width="9" style="transform-origin:60px 60px"></g>
  </g>
</svg>
<svg id="personaje" class="u mdh-cara ex-neutra" viewBox="20 20 172 160" xmlns="http://www.w3.org/2000/svg">
  <!-- ================================================================
       EL ENGRANAJE — el personaje de Mecánica del Humor.

       Una cabeza dibujada como un plano de despiece: chapa, remaches,
       dos lentes por ojos, dos bielas por cejas y una boca articulada.
       No habla. Reacciona. Es el escéptico del canal.

       Se usa en línea (inline) dentro de escena.html y miniatura.py, así
       que no hay peticiones de red ni dependencias.

       La expresión se cambia poniendo una clase en el propio <svg>:
         ex-neutra · ex-duda · ex-entiende · ex-no · ex-rie · ex-piensa

       Coste de render CERO: no se anima sola. Cambia en la entrada de
       escena, que render.py ya captura.
       ================================================================ -->
  <style>
    .mdh-cara{--am:#FFB020;--ci:#4CC9F0;--te:#8A97AE;--ti:#F2F4F8}

<script>
// ===================================================================
// Motor de escenas. Playwright llama a cargar(datos) y luego a
// pintar(t) para cada fotograma. Nada es aleatorio: mismo t, mismo
// resultado, siempre.
// ===================================================================
let UNIDADES = [];
let DUR = 5;
let PALABRAS = [];      // unidades de revelado, en orden de lectura
let VERTICAL = false;
let T0 = 0, TOTAL = 0;  // posicion de la escena dentro del video entero
let REMATE = false;

// Reparte cada palabra de una unidad de texto en su propio <span class="p">,
// sin romper los <span class="amb"> que pone rico(): se recorren los nodos de
// TEXTO, no el innerHTML. Devuelve los spans en orden de lectura.
function despiezar(raiz){
  const salida = [];
  const nodos = [];
  const paseo = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT);
  while (paseo.nextNode()) nodos.push(paseo.currentNode);
  for (const nodo of nodos){
    if (!nodo.nodeValue.trim()) continue;
    const frag = document.createDocumentFragment();
    for (const trozo of nodo.nodeValue.split(/(\s+)/)){
      if (!trozo) continue;
      if (/^\s+$/.test(trozo)){ frag.appendChild(document.createTextNode(trozo)); continue; }
      const sp = document.createElement("span");
      sp.className = "p"; sp.textContent = trozo;
      // ¿va dentro de un resalte (ámbar o cian)? Esa palabra entra con rebote.
      sp.dataset.clave = (nodo.parentElement &&
        nodo.parentElement.closest(".amb,.cia")) ? "1" : "";
      frag.appendChild(sp); salida.push(sp);
    }
    nodo.parentNode.replaceChild(frag, nodo);
  }
  return salida;
}

function esc(s){ return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// permite resaltar con *asterisco* -> ámbar y _guion bajo_ -> cian
function rico(s){
  return esc(s)
    .replace(/\*([^*]+)\*/g,'<span class="amb">$1</span>')
    .replace(/_([^_]+)_/g,'<span class="cia">$1</span>');
}

// C19+C16 · el icono (07/09). d.icono es admisible en cualquier escena
// (esquema_guion.json); si no viene, no se pinta nada.
//
// Es una COPIA del contenido de 02_marca/iconos.svg, no un <use
// href="02_marca/iconos.svg#...">: Chromium clona el contenido de un
// <use> en un árbol de sombra que querySelectorAll no ve, así que
// dibujarIcono() no podría llegar a los <path> uno a uno para animar su
// trazo. Si se toca 02_marca/iconos.svg hay que traer el cambio aquí a
// mano — igual que el personaje, que por la misma razón también vive
// duplicado en este documento.
const ICONOS = {

function iconoHTML(id){
  if (!id || !ICONOS[id]) return "";
  return `<svg class="u icono" viewBox="0 0 200 200">${ICONOS[id]}</svg>`;
}

// Dibuja un icono a partir de «p» (0-1, la misma curva de entrada que ya
// usa pintar() para esta unidad) y «fuera» (0-1, la salida de la escena).
// Los trazos (.ic, .ic-am, .ic-ci, .ic-co, .ic-te) se revelan con
// stroke-dasharray/dashoffset — la longitud de cada trazo se mide una vez
// con getTotalLength() y se cachea en el propio nodo. Los rellenos (.ic-f:
// los remaches, la flecha) no se «dibujan», aparecen con un fundido corto
// al final. Las guías discontinuas (.ic-guia) se quedan con su propio
// stroke-dasharray decorativo y solo cambian de opacidad. Todo función de
// t a través de p/fuera — nada de setTimeout ni de CSS transition.
function dibujarIcono(svgEl, p, fuera){
  const vivo = Math.max(0, Math.min(1, p)) * (1 - fuera);
  svgEl.querySelectorAll("path.ic, path.ic-am, path.ic-ci, path.ic-co, path.ic-te, circle.ic, circle.ic-am, circle.ic-ci, circle.ic-co, circle.ic-te")
    .forEach(tr => {
      let len = tr.dataset.len;
      if (!len){
        len = tr.getTotalLength ? tr.getTotalLength() : 0;
        tr.dataset.len = len;
        tr.style.strokeDasharray = len;
      }
      tr.style.strokeDashoffset = (parseFloat(len) * (1 - vivo)).toFixed(2);
    });
  svgEl.querySelectorAll(".ic-guia").forEach(tr => {
    tr.style.opacity = (0.55 * vivo).toFixed(3);
  });
  svgEl.querySelectorAll(".ic-f").forEach(tr => {
    // el relleno entra en el último 25% del trazo, no desde t=0
    const q = Math.max(0, Math.min(1, (vivo - 0.75) / 0.25));
    tr.style.opacity = q.toFixed(3);
  });
}

const PLANTILLAS = {

  dato(d){

      ${iconoHTML(d.icono)}

  },
  figura(d){

    return `<div class="caja" style="text-align:center">
      ${iconoHTML(d.icono)}
      ${d.titulo?`<h2 class="u" style="margin-bottom:36px">${rico(d.titulo)}</h2>`:""}

  },
  diagrama(d){
    // En vertical el diagrama NO se encoge: se apila. Tres cajas repartidas
    // sobre 1920 px de ancho caben en 1080 px reduciendo la letra a 26 px, que

    // flecha baja en vez de ir a la derecha. (C15.4, 28/08.)
    if (document.documentElement.dataset.fmt === "v"){
      const pasos = d.pasos.map((p,i)=>`
        <div class="u paso${i===d.pasos.length-1?" fin":""}">

      ${d.subtitulo?`<div class="u sub">${rico(d.subtitulo)}</div>`:""}

};

// ===================================================================
// C21.1 · Encoger hasta que quepa. La escalera txt-xs/txt-s (más abajo,
// dentro de cargar()) elige un tamaño de partida por NÚMERO DE PALABRAS,
// pensada para que una frase corta no deje media pantalla vacía. Pero no
// mira nunca el ancho real del texto, y tres casos reales lo demostraron:
// MDS-009 ("Más generosos"), MDS-013 ("Ruta panorámica.", dos palabras a
// 150px que no caben igual) y MDS-015 ("10–16 millones de años" en
// `.cifra`, que ni siquiera tiene escalera — 300px fijos siempre). El
// fallo de fondo es el mismo en los tres: el criterio mide palabras, y lo
// que desborda es el ancho.
//
// Así que en vez de intentar adivinar un umbral nuevo (por longitud de la
// palabra más larga, por caracteres totales...), se mide de verdad: tras
// cargar() y con la escena ya montada, para cada elemento de texto, mientras
// desborde su caja Y la fuente siga por encima del suelo, se baja un 4% y se
// vuelve a medir. Se usan las mismas tolerancias que la barrera
// (comprobarDesbordes, más abajo) para que el encogido pare exactamente en
// el punto en que la barrera dejaría de quejarse — nunca más, nunca menos.
//
// El suelo son 64px (mínimo legible en 1080x1920, regla de C2). Si al
// llegar ahí el texto sigue sin caber, no se sigue encogiendo: se deja tal
// cual y es la barrera (render.py) quien para el render, porque entonces sí
// es un guion con demasiado texto, no un problema de escalado.
//
// Se ejecuta UNA vez dentro de cargar(), nunca dentro de pintar(t): mismo
// guion, mismo píxel en cualquier fotograma de esa escena.
// ===================================================================
function ajustarTamano(){
  const SELECTORES = [
    ".cifra", ".cifra-pie", ".enunciado", "h1", "h2", ".pie", "li",
    "blockquote", ".tx", ".et", ".pt", ".pp", ".autor", ".sub",
    "#remate .n", "#remate .q"
  ];
  const SUELO = 64;      // px — mínimo legible, regla de C2
  const PASO = 0.96;     // -4% por iteración
  const TOL_ANCHO = 1;   // igual que comprobarDesbordes
  const TOL_ALTO = 50;   // igual que comprobarDesbordes
  const GUARDA = 200;    // cota de iteraciones; 150px->64px son ~21 pasos

  const vistos = new Set();
  for (const sel of SELECTORES){
    let nodos;
    try { nodos = document.querySelectorAll(sel); } catch (err) { continue; }
    nodos.forEach(el => {
      if (vistos.has(el)) return;
      vistos.add(el);
      if (!(el instanceof HTMLElement)) return;
      if (el.getClientRects().length === 0) return;
      let tam = parseFloat(getComputedStyle(el).fontSize);
      if (!tam || !isFinite(tam)) return;
      let vueltas = 0;
      while (tam > SUELO && vueltas < GUARDA &&
             (el.scrollWidth > el.clientWidth + TOL_ANCHO ||
              el.scrollHeight > el.clientHeight + TOL_ALTO)){
        tam = Math.max(SUELO, tam * PASO);
        el.style.fontSize = tam.toFixed(2) + "px";
        vueltas++;
      }
    });
  }
}

function cargar(d){
  DUR = d.duracion_s || 5;
  // Formato: "corto" pinta 1080x1920. Lo fija render.py con el mismo dato que
  // usa para el viewport, así no hay forma de que el tamaño de página y el de
  // captura se desincronicen.
  document.documentElement.dataset.fmt = (d.formato === "corto") ? "v" : "h";
  // El personaje: si la escena no lo pide, no existe. Se pone la clase ANTES
  // de recoger UNIDADES para que entre en el escalonado como una unidad más.
  const cara = document.getElementById("personaje");
  document.body.classList.toggle("con-personaje", !!d.personaje);
  if (d.personaje) cara.setAttribute("class", "u mdh-cara ex-" + d.personaje);
  const f = PLANTILLAS[d.tipo] || PLANTILLAS.enunciado;
  document.getElementById("escena").innerHTML = f(d);
  document.getElementById("ref").textContent = d.ref || "";
  // La marca la manda render.py según el idioma del guion (Mecánica del Humor
  // / Humor Mechanics), así el mismo motor sirve para los dos canales.
  if (d.marca) document.getElementById("firma").textContent = d.marca;
  if (d.idioma) document.documentElement.lang = d.idioma;
  // El personaje va el ÚLTIMO del escalonado a propósito: primero se lee lo
  // que dice la escena y después reacciona. Al revés, la reacción no significa
  // nada porque llega antes que aquello a lo que reacciona.
  UNIDADES = Array.from(document.querySelectorAll("#escena .u"));
  if (d.personaje) UNIDADES.push(cara);

  // --- C15 · revelado por palabra, solo en vertical -------------------
  // En horizontal no se toca nada: el episodio largo sigue exactamente
  // como estaba (regla 11.1, un cambio por vez, y este es del Short).
  VERTICAL = (d.formato === "corto");
  T0 = Number(d.t_inicio) || 0;
  TOTAL = Number(d.total_s) || 0;
  PALABRAS = [];
  document.body.classList.remove("txt-xs","txt-s");
  if (VERTICAL){
    const n_pal = (document.getElementById("escena").textContent.trim().match(/\S+/g)||[]).length;
    if (n_pal <= 5)      document.body.classList.add("txt-xs");
    else if (n_pal <= 11) document.body.classList.add("txt-s");
    for (const u of UNIDADES){
      if (u.id === "personaje") continue;
      // Las figuras y los SVG no se despiezan: no son texto corrido.
      if (u.tagName === "IMG" || u.tagName === "svg" || u.tagName === "g") continue;
      PALABRAS = PALABRAS.concat(despiezar(u));
    }
  }

  // --- C15 · remate de marca al final de la escena de cierre ----------
  REMATE = VERTICAL && d.tipo === "cierre";
  document.body.classList.toggle("con-remate", REMATE);
  if (REMATE){
    document.querySelector("#remate .n").textContent = d.marca || "Mecánica del Humor";
    document.querySelector("#remate .q").textContent = d.remate || "El mecanismo, cada día a las 19:00";
  }

  // C21.1 · encoger hasta que quepa (ver la función arriba). Se aplica en
  // los dos formatos, no solo en vertical: `.cifra` con texto largo puede
  // desbordar también en horizontal si el ancho es ajustado.
  ajustarTamano();

  pintar(0);
  return UNIDADES.length;
}

// suavizado (ease-out cúbico)
function suave(x){ x = Math.max(0,Math.min(1,x)); return 1-Math.pow(1-x,3); }

// Cuenta desde 0 hasta el número con el que empieza el texto, con "p" (0-1,
// ya suavizado con la misma curva de entrada que el resto de la escena) como
// fracción de avance. "50 años" -> cuenta 0..50 y deja " años" fijo detrás.
// Si el texto no empieza por un número, se devuelve tal cual, sin animar.
function contar(texto, p){
  const m = String(texto).match(/^(\d+(?:[.,]\d+)?)(.*)$/);
  if (!m) return rico(texto);
  const objetivo = parseFloat(m[1].replace(",", "."));
  const decimales = (m[1].split(/[.,]/)[1] || "").length;
  const actual = objetivo * p;
  const numTxt = decimales ? actual.toFixed(decimales) : String(Math.round(actual));
  return rico(numTxt + m[2]);
}

function pintar(t){
  const escalonado = 0.16;              // desfase entre unidades, en segundos
  const entrada    = 0.55;              // lo que tarda cada unidad en entrar
  // En la escena de cierre el texto se retira ANTES para dejar sitio al remate
  // de marca: si se cruzan, el final se lee como una mancha.
  const salida_ini = Math.max(DUR - (REMATE ? 1.75 : 0.45), entrada);
  const fuera_g    = t > salida_ini ? suave((t - salida_ini)/(REMATE ? 0.6 : 0.45)) : 0;

  // ---------- Unidades ----------
  UNIDADES.forEach((el,i)=>{
    const t0 = i*escalonado;
    let p = suave((t - t0) / entrada);
    const fuera = fuera_g;
    // En vertical, las unidades de TEXTO ya no entran como bloque: la entrada
    // la llevan sus palabras, una a una. La unidad solo gestiona la salida.
    const tiene_palabras = VERTICAL && el.querySelector && el.querySelector(".p");
    // El personaje NO se va con el remate: se queda mirando mientras aparece
    // el nombre del canal. Es lo único que sobrevive al fundido del cierre.
    const se_queda = REMATE && el.id === "personaje";
    const op = se_queda ? Math.max(0, p)
             : tiene_palabras ? (1 - fuera) : Math.max(0, p * (1 - fuera));
    const dy = tiene_palabras ? (-fuera*14) : ((1-p)*26 - fuera*14);
    el.style.opacity = Math.max(0, op).toFixed(4);
    el.style.transform = `translateY(${dy.toFixed(2)}px)`;
    if (el.dataset.cuenta) el.innerHTML = contar(el.dataset.cuenta, p);
    // C19+C16 · el icono se dibuja a trazo (dasharray/dashoffset) en vez de
    // aparecer entero: el propio <svg> se queda a opacidad plena en cuanto
    // arranca (el "aparecer" lo hace el trazo, no el contenedor).
    if (el.classList && el.classList.contains("icono")) dibujarIcono(el, p, fuera);
  });

  // ---------- C15.1 · revelado palabra a palabra (solo vertical) ----------
  // El ritmo se ajusta al número de palabras de la escena: nunca más lento de
  // 0,30 s (se lee antes de que llegue la siguiente) ni más rápido de 0,11 s
  // (ilegible). Con eso el texto sigue llegando durante ~el 60 % de la escena
  // en vez de aparecer entero en el primer segundo.
  if (PALABRAS.length){
    const n = PALABRAS.length;
    const paso = Math.min(0.30, Math.max(0.11, (0.62*DUR - 0.12) / n));
    for (let i = 0; i < n; i++){
      const el = PALABRAS[i];
      const q = suave((t - (0.12 + i*paso)) / 0.38);
      // La palabra resaltada entra con un pequeño rebote: es el acento de la
      // frase y merece un golpe de más.
      const clave = el.dataset.clave === "1";
      const rebote = clave ? 1 + 0.16*Math.sin(Math.PI*Math.min(1,Math.max(0,q))) : 1;
      el.style.opacity = (q * (1 - fuera_g)).toFixed(4);
      el.style.transform = `translateY(${((1-q)*18).toFixed(2)}px) scale(${rebote.toFixed(4)})`;
    }
  }

  // ---------- C15.2 · la capa viva ----------
  // Tres movimientos continuos, los tres función del tiempo GLOBAL del vídeo
  // (T0 + t), no del de la escena: así no se reinician en cada corte, que es
  // lo que delataba el pase de diapositivas.
  const T = T0 + t;
  if (VERTICAL){
    // 1. Barra de avance. Es lo único que se mueve el 100 % del tiempo.
    if (TOTAL > 0){
      const b = document.querySelector("#avance i");
      if (b) b.style.width = (100*Math.min(1, T/TOTAL)).toFixed(3) + "%";
    }
    // 2. Deriva de la retícula: 2,2 px/s en diagonal sobre una trama de 64 px.
    //    Da vuelta completa cada 29 s, así que nunca se ve "saltar". Es
    //    background-position, no transform: no repinta el elemento entero.
    //    El barrido rápido del 18/08 mareaba; esto es un octavo de aquello.
    const r = document.getElementById("reticula");
    if (r){ const d = (T*2.2) % 64; r.style.backgroundPosition = `${d.toFixed(2)}px ${(d*0.6).toFixed(2)}px`; }
    // 3. Acercamiento lento del bloque de contenido: 2,2 % a lo largo de la
    //    escena. Es la «respiración» que C6.3 quería hacer con zoompan de
    //    FFmpeg y que se descartó por el temblor: zoompan trunca a píxel
    //    entero y salta. Aquí lo hace el navegador con precisión subpíxel,
    //    sin preescalar a ×4 y sin los 5,3× de coste de render que medía la
    //    bitácora del 24/08. Es el mismo efecto, en la capa correcta.
    const cont = document.getElementById("escena");
    if (cont) cont.style.transform = `scale(${(1 + 0.022*Math.min(1, t/Math.max(DUR,0.001))).toFixed(5)})`;
    // 4. El personaje respira y su engranaje gira. Es "mecánica": lo que la
    //    marca promete, moviéndose.
    const cara = document.getElementById("personaje");
    if (cara && document.body.classList.contains("con-personaje")){
      const bob = Math.sin(T*1.9) * 5;
      cara.style.transform = `translateY(${(bob + (1-suave((t-(UNIDADES.length-1)*escalonado)/entrada))*26).toFixed(2)}px)`;
      const eje = cara.querySelector(".eje");
      if (eje) eje.style.transform = `rotate(${(T*46).toFixed(1)}deg)`;
    } else {
      const g = document.getElementById("dientes");
      if (g) g.style.transform = `rotate(${(T*18).toFixed(1)}deg)`;
    }
  }

  // ---------- C15.5 · remate de marca ----------
  // Entra en los últimos 1,4 s de la escena de cierre. El vídeo deja de
  // terminar en seco sobre una negación ("No es un test.") y termina con el
  // nombre del canal y la cita de mañana. La crítica sigue estando —regla
  // 12— pero ya no es lo último que se ve.
  if (REMATE){
    const rem = document.getElementById("remate");
    if (rem){
      const q = suave((t - Math.max(0, DUR - 1.25)) / 0.45);
      rem.style.opacity = q.toFixed(4);
      rem.style.transform = `translateY(${((1-q)*20).toFixed(2)}px)`;
    }
  }
}

// Dibuja los dientes del engranaje de marca una sola vez (elemento estático,
// no forma parte de UNIDADES ni de pintar(t): cero coste de captura extra).
(function dibujarEngranaje(){
  const cont = document.getElementById("dientes");
  const N = 10, cx = 60, cy = 60, r1 = 30, r2 = 45;
  for (let i = 0; i < N; i++){
    const ang = (i / N) * 2 * Math.PI;
    const linea = document.createElementNS("http://www.w3.org/2000/svg", "line");
    linea.setAttribute("x1", (cx + r1 * Math.cos(ang)).toFixed(2));
    linea.setAttribute("y1", (cy + r1 * Math.sin(ang)).toFixed(2));
    linea.setAttribute("x2", (cx + r2 * Math.cos(ang)).toFixed(2));
    linea.setAttribute("y2", (cy + r2 * Math.sin(ang)).toFixed(2));
    cont.appendChild(linea);
  }
})();

// ===================================================================
// C21 · La barrera. Después de cargar() y de pintar() la escena en su
// estado asentado, render.py llama a esto antes de capturar un solo
// fotograma. Devuelve la lista de elementos de texto cuyo contenido no
// cabe en su caja, o que se salen del lienzo — nunca decide nada aquí:
// solo mide con las mismas propiedades que ya usa el navegador
// (scrollWidth/clientWidth, scrollHeight/clientHeight) y compara cada
// rectángulo con el tamaño real de la página. render.py es quien para
// el render si la lista no está vacía.
//
// Caso con el que se verificó (MDS-009, escena 3, "Más generosos" a
// 300px en un lienzo de 1080): antes de esto pasaba sin que nadie lo
// viera hasta que ya estaba público. Con esto, `.cifra` desbordando el
// ancho de su caja para el render con un SystemExit.
// ===================================================================
function comprobarDesbordes(){
  // .titulo no es una clase en este CSS: el título de una escena vive en
  // <h1> (tipo "titulo") o en <h2> (cabecera de "lista"/"comparacion"/
  // "diagrama"/"figura"), y las dos ya están en esta lista.
  //
  // .caja queda FUERA de esta lista y se comprueba aparte (ver abajo):
  // el diagrama horizontal («mecanismo del chiste») mete un <svg
  // style="margin-left:-40px;width:calc(100% + 80px)"> a propósito, así
  // que .caja.scrollWidth es sistemáticamente 40px mayor que su
  // clientWidth en TODAS las escenas «diagrama» horizontales — no es un
  // desbordamiento, es el diseño. Lo que importa de .caja es si eso la
  // saca del lienzo, y eso ya lo cubre el rectángulo.
  const SELECTORES = [
    ".cifra", ".cifra-pie", ".enunciado", "h1", "h2", ".pie", "li",
    "blockquote", ".tx", ".et", ".pt", ".pp", ".autor", ".sub",
    "#remate .n", "#remate .q", "ul.lista", "svg text"
  ];
  // Solo para el rectángulo contra el lienzo, no para scrollWidth/Height.
  const SELECTORES_SOLO_LIENZO = [".caja"];

  // Calibrado el 04/09/2026 renderizando los 21 guiones ya escritos con
  // este mismo motor: sin ningún desbordamiento real, scrollHeight supera
  // a clientHeight entre 3 y 39 px en CASI TODAS las escenas —line-height
  // fraccionario (p.ej. .cifra usa .9) y el redondeo de métricas de fuente
  // lo hacen sistemático, no un fallo. Un margen de 1 px (como sí vale
  // para el ancho, donde el mismo barrido dio 0 en cada escena limpia)
  // habría bloqueado el render de los 21 guiones sin excepción. 50 px deja
  // margen sobre el máximo observado (39) y sigue muy por debajo de lo que
  // mediría una línea de texto entera sin pintar (ver constantes de tipo
  // más arriba: nunca menos de 72 px de fuente). El ancho no tiene este
  // problema — 0 px de margen de sobra en cada escena limpia del barrido,
  // así que se deja en el +1 de siempre.
  const TOL_ANCHO = 1;
  const TOL_ALTO = 50;

  const W = document.documentElement.clientWidth;
  const H = document.documentElement.clientHeight;
  const vistos = new Set();
  const problemas = [];

  function medir(el, sel, soloLienzo){
    if (vistos.has(el)) return;
    vistos.add(el);
    // getClientRects vacío = no está en el árbol de render (p.ej. dentro
    // de #remate cuando la escena no es el cierre en vertical, o un `li`
    // de una lista que no se ha montado). Nada que medir.
    if (el.getClientRects().length === 0) return;

    const r = el.getBoundingClientRect();
    const fueraLienzo = r.left < -1 || r.top < -1 || r.right > W + 1 || r.bottom > H + 1;

    // scrollWidth/clientWidth solo existen (con sentido) en elementos
    // HTML normales. Un <text> de SVG no los tiene: para ese caso basta
    // con el rectángulo, que sí es real en las dos familias de elemento.
    let desbordaAncho = false, desbordaAlto = false;
    if (!soloLienzo && el instanceof HTMLElement){
      desbordaAncho = el.scrollWidth > el.clientWidth + TOL_ANCHO;
      desbordaAlto = el.scrollHeight > el.clientHeight + TOL_ALTO;
    }

    if (desbordaAncho || desbordaAlto || fueraLienzo){
      problemas.push({
        selector: sel,
        texto: (el.textContent || "").trim().replace(/\s+/g, " ").slice(0, 140),
        scrollWidth: el.scrollWidth || null, clientWidth: el.clientWidth || null,
        scrollHeight: el.scrollHeight || null, clientHeight: el.clientHeight || null,
        rect: { left: Math.round(r.left), top: Math.round(r.top),
                 right: Math.round(r.right), bottom: Math.round(r.bottom) },
        lienzo: { W, H },
        desbordaAncho, desbordaAlto, fueraLienzo
      });
    }
  }

  for (const sel of SELECTORES){
    let nodos;
    try { nodos = document.querySelectorAll(sel); } catch (err) { continue; }
    nodos.forEach(el => medir(el, sel, false));
  }
  for (const sel of SELECTORES_SOLO_LIENZO){
    let nodos;
    try { nodos = document.querySelectorAll(sel); } catch (err) { continue; }
    nodos.forEach(el => medir(el, sel, true));
  }
  return problemas;
}

window.cargar = cargar;
window.pintar = pintar;
window.comprobarDesbordes = comprobarDesbordes;
window.ajustarTamano = ajustarTamano;
</script>
