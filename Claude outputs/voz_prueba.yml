name: Prueba de voces

# ---------------------------------------------------------------------------
# La prueba de C7, escalón 2. NO forma parte de la producción y NO tiene cron:
# solo corre cuando alguien le da al botón.
#
# POR QUÉ ES UN WORKFLOW Y NO UNA TAREA PROGRAMADA
# ------------------------------------------------
# Las tareas programadas salen a internet por un proxy con lista blanca: el
# 03/09 la revisión diaria no pudo llegar ni a Incompetech ni a FreePD. Aquí
# no hay esa restricción, y además es donde vive GEMINI_API_KEY.
#
# QUÉ HACE: genera tres audios del mismo guion —edge-tts (lo de hoy), Gemini
# sin dirección y Gemini con dirección de actor— más un informe de silencios
# que dice si el audio se puede repartir por escena. Silvestre los escucha y
# decide.
#
# CUOTA: el nivel gratuito de los modelos TTS da 3 peticiones por minuto y
# 10 por día, POR MODELO. Esta prueba gasta exactamente 2. Si se agotan las
# 10 del día, relanzar con modelo = gemini-2.5-flash-preview-tts, que lleva
# su propia cuota, en vez de esperar a mañana.
#
# NO ESCRIBE NADA EN EL REPOSITORIO. Solo deja un artefacto que caduca solo.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      guion:
        description: "Guion a locutar (ruta desde la raíz del repositorio)"
        type: string
        default: "05_calendario/guiones/MDS-010.es.json"
      modelo:
        description: "Modelo TTS (cada uno tiene su propia cuota diaria)"
        type: choice
        default: "gemini-3.1-flash-tts-preview"
        options:
          - "gemini-3.1-flash-tts-preview"
          - "gemini-2.5-flash-preview-tts"
          - "gemini-2.5-pro-preview-tts"

permissions:
  contents: read

concurrency:
  group: voz-prueba
  cancel-in-progress: true

jobs:
  locutar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install --quiet "edge-tts>=7,<8" google-genai

      - name: Locutar las tres versiones
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 04_agentes/prueba_voz.py "${{ inputs.guion }}" \
            --modelo "${{ inputs.modelo }}" \
            --salida prueba_voz

      - uses: actions/upload-artifact@v4
        with:
          name: prueba-de-voces
          path: prueba_voz/
          retention-days: 14
