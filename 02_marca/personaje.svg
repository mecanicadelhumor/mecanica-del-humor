<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 172 160" class="mdh-cara ex-neutra" role="img" aria-label="Mecánica del Humor">
  <!-- ================================================================
       EL ENGRANAJE — el personaje de Mecánica del Humor.

       Una cabeza dibujada como un plano de despiece: chapa, remaches,
       dos lentes por ojos, dos bielas por cejas y una boca articulada.
       No habla. Reacciona. Es el escéptico del canal.

       Se usa en línea (inline) dentro de escena.html y miniatura.py, así
       que no hay peticiones de red ni dependencias.

       La expresión se cambia poniendo una clase en el propio <svg>:
         ex-neutra · ex-duda · ex-entiende · ex-no · ex-rie · ex-piensa

       Coste de render CERO: no se anima sola. Cambia en la entrada de
       escena, que render.py ya captura.
       ================================================================ -->
  <style>
    .mdh-cara{--am:#FFB020;--ci:#4CC9F0;--te:#8A97AE;--ti:#F2F4F8}
    .mdh-cara .chapa{fill:none;stroke:var(--am);stroke-width:3.2}
    .mdh-cara .fino {fill:none;stroke:var(--te);stroke-width:1.6;opacity:.75}
    .mdh-cara .lente{fill:none;stroke:var(--ci);stroke-width:3}
    .mdh-cara .pupila{fill:var(--ci)}
    .mdh-cara .biela{fill:var(--ti);transform-box:fill-box;transform-origin:center}
    .mdh-cara .boca {fill:none;stroke:var(--ti);stroke-width:4.4;stroke-linecap:round;display:none}
    .mdh-cara .remache{fill:var(--te);opacity:.8}
    .mdh-cara .diente{stroke:var(--am);stroke-width:4;opacity:.9}
    .mdh-cara .eje{fill:none;stroke:var(--am);stroke-width:2.6;opacity:.9;
                   transform-box:fill-box;transform-origin:center}

    /* --- expresiones: qué boca se ve y cómo giran las bielas --- */
    .ex-neutra   .b-recta   {display:block}
    .ex-neutra   .ceja-i    {transform:rotate(0deg)}
    .ex-neutra   .ceja-d    {transform:rotate(0deg)}

    .ex-duda     .b-torcida {display:block}
    .ex-duda     .ceja-i    {transform:translateY(-10px) rotate(-8deg)}
    .ex-duda     .ceja-d    {transform:rotate(4deg)}

    .ex-entiende .b-o       {display:block}
    .ex-entiende .ceja-i    {transform:translateY(-9px)}
    .ex-entiende .ceja-d    {transform:translateY(-9px)}

    .ex-no       .b-plana   {display:block}
    .ex-no       .ceja-i    {transform:translateY(6px)}
    .ex-no       .ceja-d    {transform:translateY(6px)}

    .ex-rie      .b-risa    {display:block}
    .ex-rie      .ceja-i    {transform:rotate(-6deg) translateY(-6px)}
    .ex-rie      .ceja-d    {transform:rotate(6deg) translateY(-6px)}

    .ex-piensa   .b-torcida {display:block}
    .ex-piensa   .ceja-i    {transform:translateY(-4px) rotate(-5deg)}
    .ex-piensa   .ceja-d    {transform:translateY(2px) rotate(12deg)}
    .ex-piensa   .eje       {transform:rotate(24deg)}
  </style>

  <!-- chapa: octógono achaflanado, como una pieza mecanizada -->
  <path class="chapa" d="M62 26 h76 l24 24 v76 l-24 24 h-76 l-24 -24 v-76 z"/>
  <path class="fino"  d="M70 36 h60 l18 18 v60 l-18 18 h-60 l-18 -18 v-60 z"/>

  <!-- remaches de las cuatro esquinas -->
  <circle class="remache" cx="62" cy="50"  r="3"/>
  <circle class="remache" cx="138" cy="50"  r="3"/>
  <circle class="remache" cx="62" cy="150" r="3"/>
  <circle class="remache" cx="138" cy="150" r="3"/>

  <!-- cejas: dos bielas. Son <rect> y no <line> a propósito: con fill-box, una
       línea horizontal tiene caja de altura cero y el giro sale descentrado. -->
  <rect class="biela ceja-i" x="58"  y="73.5" width="30" height="5" rx="2.5"/>
  <rect class="biela ceja-d" x="112" y="73.5" width="30" height="5" rx="2.5"/>

  <!-- ojos: dos lentes -->
  <circle class="lente"  cx="74"  cy="98" r="13"/>
  <circle class="pupila" cx="74"  cy="98" r="4.6"/>
  <circle class="lente"  cx="126" cy="98" r="13"/>
  <circle class="pupila" cx="126" cy="98" r="4.6"/>

  <!-- bocas: solo una visible según la clase -->
  <path class="boca b-recta"   d="M79 133 H121"/>
  <path class="boca b-plana"   d="M84 134 H116"/>
  <path class="boca b-torcida" d="M78 136 Q100 128 122 133"/>
  <path class="boca b-o"       d="M100 133 m-11 0 a11 9 0 1 0 22 0 a11 9 0 1 0 -22 0"/>
  <path class="boca b-risa"    d="M76 127 Q100 149 124 127"/>

  <!-- engranaje de la sien: gira solo en «piensa» -->
  <g class="eje">
    <circle cx="166" cy="56" r="11"/>
    <g class="diente">
      <line x1="166" y1="40" x2="166" y2="47"/>
      <line x1="166" y1="65" x2="166" y2="72"/>
      <line x1="150" y1="56" x2="157" y2="56"/>
      <line x1="175" y1="56" x2="182" y2="56"/>
      <line x1="155" y1="45" x2="160" y2="50"/>
      <line x1="172" y1="62" x2="177" y2="67"/>
    </g>
  </g>
</svg>
