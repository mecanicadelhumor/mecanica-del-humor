name: Explorar demanda

# ---------------------------------------------------------------------------
# Mide qué pregunta la gente y deja los números en 05_calendario/demanda_bruta.json.
#
# POR QUÉ ESTÁ AQUÍ Y NO DENTRO DE LA TAREA DE PLANIFICACIÓN
# ----------------------------------------------------------
# La tarea de planificación corre desatendida y en ese modo no tiene acceso a la
# red: la primera ejecución, el 20 de agosto, entregó la medición con
# «vistas_top10: null» en todos los candidatos y lo dijo explícitamente.
#
# Actions no tiene esa restricción, corre solo y es gratis en un repositorio
# público. Así que aquí se MIDE y allí se JUZGA. Nadie tiene que estar delante.
#
# CUÁNDO: jueves a las 12:00 UTC (14:00 en España). Después de la producción de
# la madrugada —para no competir por la cuota de la API de YouTube, que es
# diaria y una subida cuesta 1.600 de 10.000— y ocho horas antes de que la tarea
# de planificación se despierte a las 20:00 UTC.
# ---------------------------------------------------------------------------

on:
  schedule:
    # Fuera del minuto 0, y con un segundo intento a las 15:52 UTC — todavía
    # cuatro horas antes de que la planificación despierte a las 20:00. El
    # 27/08 este workflow no llegó a correr y la tanda entera de la semana se
    # eligió sin una sola vista medida.
    - cron: "26 12 * * 4"
    - cron: "52 15 * * 4"
  workflow_dispatch:
    inputs:
      sin_youtube:
        description: "Saltar la API de YouTube (no gasta cuota)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: demanda
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install --quiet google-api-python-client google-auth

      - name: Medir
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python3 04_agentes/explorador_de_demanda.py \
            ${{ inputs.sin_youtube && '--sin-youtube' || '' }}

      # Este workflow es el ÚNICO que escribe demanda_bruta.json. Ninguna tarea
      # programada lo toca, así que no puede haber conflicto: ver
      # 00_estrategia/PROPIEDAD_DE_FICHEROS.md.
      - name: Commit
        run: |
          git config user.name  "Mecánica del Humor"
          git config user.email "mecanicadelhumor@gmail.com"
          git add 05_calendario/demanda_bruta.json
          if git diff --cached --quiet; then
            echo "Sin cambios en la medición."
          else
            git commit -m "medición de demanda $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main
            git push
          fi
