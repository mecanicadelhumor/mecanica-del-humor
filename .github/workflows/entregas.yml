name: Entregas (C53)

# ---------------------------------------------------------------------------
# Pasa a main lo que entrega cada tarea programada, y solo lo que es suyo.
#
# POR QUÉ (dirección, 28/09/2026, versión 14 del plan, C53)
# ---------------------------------------------------------
# Hasta el 28/09 las tareas entregaban un .tar.gz que el codirector aplicaba a
# mano. Esa semana no pudo, y las revisiones del 26 y el 27 se perdieron. Ahora
# cada tarea sube su trabajo a una rama claude/entrega-<tarea>-<fecha> (las
# sesiones en la nube pueden escribir ramas claude/ en un repositorio añadido a
# la tarea) y este workflow lo pasa a main.
#
# QUÉ HACE: con la copia de 04_agentes/entregar.py que hay en MAIN —una tarea
# no puede aflojarse las reglas cambiándolo en su rama— clasifica lo que trae
# la rama contra la tabla de PROPIEDAD_DE_FICHEROS.md, aplica solo lo de la
# tarea encima de lo último de main (mezcla a tres bandas: si alguien cambió lo
# mismo, no pisa, para), valida los guiones, sube main y borra la rama. Lo que
# se queda fuera va escrito en el mensaje del commit.
#
# Si no puede aplicarla, la rama NO se borra y el resumen de la ejecución dice
# por qué. La revisión diaria busca ramas claude/entrega-* que sigan vivas.
#
# Lo que sube este workflow lo sube el GITHUB_TOKEN, y eso no dispara otros
# workflows: por eso lanza a mano «Visuales (C50)» y «Vista previa» si hace falta.
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - "claude/entrega-**"

permissions:
  contents: write
  actions: write

concurrency:
  group: entregas
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar la entrega en main
        id: aplicar
        run: |
          git config user.name  "Mecánica del Humor (bot)"
          git config user.email "mecanicadelhumor@users.noreply.github.com"
          python3 04_agentes/entregar.py --aplicar "$GITHUB_REF_NAME"

      - name: Lanzar lo que no se lanza solo
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.aplicar.outputs.visuales }}" = "true" ]; then
            gh workflow run visuales.yml --ref main && echo "Visuales (C50) lanzado."
          fi
          if [ "${{ steps.aplicar.outputs.vista }}" = "true" ]; then
            gh workflow run vista.yml --ref main && echo "Vista previa lanzada."
          fi
